[package]
name = "vce-revision-tracker"
version = "1.0.0"
description = "A desktop revision tracker for VCE Units 3 and 4"
authors = ["samsell0482-dev"]
license = ""
repository = "https://github.com/samsell0482-dev/VCE-Revision-Tracker"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vce_revision_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
