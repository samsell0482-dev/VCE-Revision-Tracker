/* ── sync ── */
const supported = typeof window.showSaveFilePicker === "function";
let handle = null, lastSavedAt = lsGet(KEY_SAVED) || null, lastStamp = 0, writeTimer = null, poller = null;

function db() { return new Promise((res,rej) => { const r = indexedDB.open(DB_NAME,1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kv(mode, fn) { const d = await db(); return new Promise((res,rej) => {
  const q = fn(d.transaction("kv",mode).objectStore("kv"));
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
const kvGet = k => kv("readonly", s => s.get(k));
const kvSet = (k,v) => kv("readwrite", s => s.put(v,k));
const kvDel = k => kv("readwrite", s => s.delete(k));

async function permission(h, ask) {
  if (!h) return "denied";
  const o = { mode:"readwrite" };
  if (await h.queryPermission(o) === "granted") return "granted";
  return ask ? await h.requestPermission(o) : "prompt";
}

function envelope() {
  const subjects = {};
  for (const s of SUBJECTS) subjects[s.id] = ratings[s.id];
  return { app:"vce-tracker", version:3, savedAt:new Date().toISOString(), device:deviceId, subjects, practice:practiceAttempts };
}

async function writeFile() {
  if (!handle) return;
  try {
    const body = envelope();
    const w = await handle.createWritable();
    await w.write(JSON.stringify(body,null,2)); await w.close();
    lastSavedAt = body.savedAt; lsSet(KEY_SAVED,lastSavedAt);
    lastStamp = (await handle.getFile()).lastModified;
    syncStatus("saved");
  } catch (e) { syncStatus("writefail"); }
}
function scheduleWrite() {
  if (!handle) return;
  clearTimeout(writeTimer); syncStatus("saving");
  writeTimer = setTimeout(writeFile, 700);
}

async function readFile() {
  const f = await handle.getFile();
  lastStamp = f.lastModified;
  const text = await f.text();
  if (!text.trim()) return null;
  return JSON.parse(text);
}

function adopt(doc) {
  let touched = 0;
  const apply = (id, r) => {
    if (!ratings[id]) return;
    for (const p of byId[id].points) {
      const v = r[p.id];
      if (Array.isArray(v) && v.length === 3) { ratings[id][p.id] = v.map(n => Number(n)||0); touched++; }
    }
    save(id);
  };
  if (doc.subjects) { for (const id in doc.subjects) apply(id, doc.subjects[id]); }
  else if (doc.subject && doc.ratings) { apply(doc.subject, doc.ratings); }
  else if (doc.ratings) { for (const s of SUBJECTS) apply(s.id, doc.ratings); }
  if (doc.practice && typeof doc.practice === 'object') {
    practiceAttempts = cleanPractice(doc.practice);
    lsSet(PRACTICE_KEY, JSON.stringify(practiceAttempts));
    touched += Object.keys(practiceAttempts).length;
  }
  if (current) { buildMap(); applyView(); summarise(); } else renderHome();
  return touched;
}

async function attach(h, mode) {
  handle = h;
  try { await kvSet("handle", h); } catch (e) {}
  let doc = null;
  try { doc = await readFile(); } catch (e) { doc = null; }
  if (doc) {
    const theirs = Date.parse(doc.savedAt||0)||0, mine = Date.parse(lastSavedAt||0)||0;
    if (mode === "open" || theirs > mine) {
      adopt(doc); lastSavedAt = doc.savedAt; lsSet(KEY_SAVED, lastSavedAt||"");
      syncStatus("pulled"); startPolling(); return;
    }
  }
  await writeFile(); startPolling();
}

async function createSyncFile() {
  try { await attach(await window.showSaveFilePicker({ suggestedName:SUGGESTED,
    types:[{description:"Tracker progress", accept:{"application/json":[".json"]}}] }), "create"); }
  catch (e) { if (e.name !== "AbortError") syncStatus("pickfail"); }
}
async function openSyncFile() {
  try { const [h] = await window.showOpenFilePicker({
    types:[{description:"Tracker progress", accept:{"application/json":[".json"]}}] });
    await attach(h,"open"); }
  catch (e) { if (e.name !== "AbortError") syncStatus("pickfail"); }
}
async function reconnect() {
  if (await permission(handle,true) === "granted") await attach(handle,"open");
  else syncStatus("blocked");
}
async function disconnect() {
  clearInterval(poller); handle = null;
  try { await kvDel("handle"); } catch (e) {}
  syncStatus("off");
}

function startPolling() {
  clearInterval(poller);
  poller = setInterval(async () => {
    if (!handle || document.hidden) return;
    try {
      const f = await handle.getFile();
      if (f.lastModified === lastStamp) return;
      const doc = await readFile();
      if (!doc) return;
      const theirs = Date.parse(doc.savedAt||0)||0, mine = Date.parse(lastSavedAt||0)||0;
      if (theirs > mine && doc.device !== deviceId) {
        adopt(doc); lastSavedAt = doc.savedAt; lsSet(KEY_SAVED,lastSavedAt);
        syncStatus("pulled");
      }
    } catch (e) {}
  }, 12000);
}

function actions(list) {
  const host = document.getElementById("sync-actions");
  host.innerHTML = "";
  for (const a of list) {
    const b = document.createElement("button");
    b.className = "ghost"; b.type = "button"; b.textContent = a.label;
    b.addEventListener("click", a.run); host.appendChild(b);
  }
}

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const t = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return new Date().toDateString() === d.toDateString() ? "today at "+t
    : d.toLocaleDateString([], {day:"numeric", month:"short"}) + " at " + t;
}

function syncStatus(kind) {
  const panel = document.getElementById("sync"), text = document.getElementById("sync-status");
  const name = handle ? handle.name : SUGGESTED;
  const connected = [
    { label:"Reload from file", run: async () => { try { const d = await readFile(); if (d) { adopt(d); lastSavedAt = d.savedAt; syncStatus("pulled"); } } catch (e) { syncStatus("writefail"); } } },
    { label:"Stop syncing", run: disconnect }
  ];
  if (!supported) {
    panel.dataset.live = "warn";
    text.innerHTML = "This browser can't write to a file directly. Use <b>Chrome or Edge</b> on both computers for automatic sync, or use the backup file buttons below.";
    actions([]); return;
  }
  switch (kind) {
    case "off":
      panel.dataset.live = "false";
      text.innerHTML = "Not syncing yet. On this computer, create <b>"+SUGGESTED+"</b> inside your OneDrive vault folder. One file now covers every subject. On the other computer, choose <b>Use existing file</b> and point at the same one.";
      actions([{label:"Create the sync file", run:createSyncFile},{label:"Use existing file", run:openSyncFile}]);
      break;
    case "resume":
      panel.dataset.live = "warn";
      text.innerHTML = "Syncing to <b>"+name+"</b>, but the browser needs permission again. It asks once each time you open the page.";
      actions([{label:"Reconnect", run:reconnect},{label:"Stop syncing", run:disconnect}]);
      break;
    case "saving": panel.dataset.live="true"; text.innerHTML="Saving to <b>"+name+"</b>…"; actions(connected); break;
    case "saved": panel.dataset.live="true"; text.innerHTML="Synced to <b>"+name+"</b>. Last saved "+when(lastSavedAt)+"."; actions(connected); break;
    case "pulled": panel.dataset.live="true"; text.innerHTML="Loaded the ratings saved "+when(lastSavedAt)+", and will keep this file up to date from now on."; actions(connected); break;
    case "writefail":
      panel.dataset.live="warn";
      text.innerHTML="Couldn't reach <b>"+name+"</b>. If OneDrive is still syncing or the file moved, reconnect and try again.";
      actions([{label:"Use existing file", run:openSyncFile},{label:"Stop syncing", run:disconnect}]); break;
    case "blocked":
      panel.dataset.live="warn";
      text.innerHTML="Permission was refused, so nothing is being saved to the file. Your ratings are still stored in this browser.";
      actions([{label:"Try again", run:reconnect},{label:"Stop syncing", run:disconnect}]); break;
    default:
      panel.dataset.live="warn"; text.textContent="Something went wrong choosing the file. Try again.";
      actions([{label:"Create the sync file", run:createSyncFile},{label:"Use existing file", run:openSyncFile}]);
  }
}

async function bootSync() {
  if (!supported) { syncStatus("unsupported"); return; }
  let stored = null;
  try { stored = await kvGet("handle"); } catch (e) {}
  if (!stored) { syncStatus("off"); return; }
  handle = stored;
  if (await permission(handle,false) === "granted") await attach(handle,"open");
  else syncStatus("resume");
}

window.addEventListener("beforeunload", () => { if (handle && writeTimer) { clearTimeout(writeTimer); writeFile(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && writeTimer) { clearTimeout(writeTimer); writeFile(); } });

/* ── backup ── */
function exportFile() {
  const blob = new Blob([JSON.stringify(envelope(),null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = SUGGESTED; a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById("status").textContent = "Backup saved to your downloads";
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const n = adopt(JSON.parse(reader.result));
      document.getElementById("status").textContent = n ? "Backup loaded" : "Nothing in that file matched these subjects";
      scheduleWrite();
    } catch (e) {
      const s = document.getElementById("status");
      s.textContent = "That file isn't a tracker backup"; s.dataset.warn = "true";
    }
  };
  reader.readAsText(file);
}

/* ── start ── */
load();
if (!canSave) {
  const s = document.getElementById("status");
  s.textContent = "This browser won't let the page save. Use Save a backup file before you close it.";
  s.dataset.warn = "true";
}

buildChips("pass-chips",
  [{label:"Pass 1",value:0},{label:"Pass 2",value:1},{label:"Pass 3",value:2}],
  0, v => { pass = v; applyView(); refreshMapCounts(); summarise(); });
buildChips("view-chips",
  [{label:"Rate",value:"rate"},{label:"Cue cards",value:"cards"},{label:"Practice",value:"practice"}],
  "rate", v => { view = v; applyView(); });
buildChips("filter-chips",
  [{label:"Everything",value:"all"},{label:"Not yet rated",value:"unrated"},{label:"Red and amber",value:"weak"}],
  "all", v => { filter = v; renderList(); });

document.getElementById("back").addEventListener("click", () => go(null));
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#/,"");
  if (id !== (current ? current.id : "")) go(id || null);
});
document.getElementById("export").addEventListener("click", exportFile);
document.getElementById("import").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value=""; });
document.getElementById("reset").addEventListener("click", () => {
  const what = current ? current.name : "your selected subjects";
  if (!confirm("Clear all three passes for " + what + "? This cannot be undone.")) return;
  const list = current ? [current] : activeSubjects();
  for (const s of list) { for (const p of s.points) ratings[s.id][p.id] = [0,0,0]; save(s.id); }
  scheduleWrite();
  if (current) { buildMap(); applyView(); summarise(); } else renderHome();
});

document.getElementById("colophon").textContent =
  "Shift-click a box to step backwards. " + totalPoints + " key knowledge points across " +
  SUBJECTS.length + " subjects, from the current VCE study designs.";

const setupStyle = document.createElement('style');
setupStyle.textContent = `
  #subject-setup{width:min(620px,calc(100% - 32px));max-height:calc(100dvh - 48px);overflow:auto;border:1px solid var(--rule);border-radius:20px;padding:clamp(24px,5vw,40px);background:var(--paper);color:var(--ink);font:inherit}
  #subject-setup::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
  #subject-setup h2{font-size:clamp(28px,5vw,40px);line-height:1.1;letter-spacing:-.03em;margin:8px 0 16px}
  #subject-setup p{color:var(--ink-soft)}
  #subject-setup fieldset{border:0;padding:0;margin:24px 0}
  #subject-setup legend{font-size:13px;margin-bottom:10px;color:var(--ink-soft)}
  .setup-choice{display:flex;gap:14px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
  .setup-choice:has(input:checked){background:var(--track)}
  .setup-choice input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
  .setup-choice input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .setup-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
  #setup-save{background:var(--ink);color:var(--paper);padding:12px 20px;min-height:44px}
  #setup-save:disabled{opacity:.45;cursor:not-allowed}
  #setup-count{font-size:13px;margin:0}
  #manage-subjects{margin-left:12px;text-transform:none;letter-spacing:normal}
`;
document.head.appendChild(setupStyle);
const setup = document.createElement('dialog');
setup.id = 'subject-setup';
setup.setAttribute('aria-labelledby', 'setup-title');
setup.setAttribute('aria-describedby', 'setup-description');
setup.innerHTML = `<form method="dialog">
  <span class="tag">YOUR VCE REVISION</span>
  <h2 id="setup-title" tabindex="-1">Choose your subjects.</h2>
  <p id="setup-description">Build a tracker for what you study. You can change these any time.</p>
  <fieldset><legend>Select at least one subject</legend><div id="setup-options"></div></fieldset>
  <p>These five subjects have revision content ready. More subjects can be added later.</p>
  <p id="setup-count" role="status" aria-live="polite"></p>
  <div class="setup-actions"><button id="setup-save" class="ghost" type="submit">Start revising</button><button id="setup-cancel" class="ghost" type="button">Cancel</button></div>
</form>`;
document.body.appendChild(setup);
function openSubjectSetup() {
  const options = setup.querySelector('#setup-options');
  options.replaceChildren();
  for (const subject of SUBJECTS) {
    const label = document.createElement('label');
    label.className = 'setup-choice';
    const input = document.createElement('input');
    input.type = 'checkbox'; input.value = subject.id;
    input.checked = !!selectedSubjects?.includes(subject.id);
    label.append(input, document.createTextNode(subject.name));
    options.append(label);
  }
  setup.querySelector('#setup-save').textContent = selectedSubjects ? 'Save subjects' : 'Start revising';
  setup.querySelector('#setup-cancel').hidden = !selectedSubjects;
  updateSetupCount();
  setup.showModal();
  setup.querySelector('#setup-title').focus();
}
function updateSetupCount() {
  const count = setup.querySelectorAll('input:checked').length;
  setup.querySelector('#setup-count').textContent = count ? count + (count === 1 ? ' subject selected' : ' subjects selected') : 'Choose at least one subject to continue.';
  setup.querySelector('#setup-save').disabled = !count;
}
setup.addEventListener('change', updateSetupCount);
setup.addEventListener('cancel', event => { if (!selectedSubjects) event.preventDefault(); });
setup.querySelector('#setup-cancel').addEventListener('click', () => setup.close());
setup.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  const choices = [...setup.querySelectorAll('input:checked')].map(input => input.value);
  if (!choices.length) return;
  selectedSubjects = choices;
  lsSet(SELECTION_KEY, JSON.stringify(choices));
  setup.close();
  go(null);
  document.getElementById('manage-subjects').focus();
  if (!canSave) document.getElementById('status').textContent = 'Browser saving is unavailable. Your subject choices apply for this visit only.';
});
document.getElementById('manage-subjects').addEventListener('click', openSubjectSetup);
go(location.hash.replace(/^#/,"") || null);
if (!selectedSubjects) openSubjectSetup();
bootSync();
</script>
</body>
</html>
