e current system — duplicated manual data entry.", "Benefit: reduced staff time and fewer transcription errors, improving data integrity.", "In a case study the reason must be tied to evidence in the stimulus material."]}], "card": {"key": "A11", "title": "Why organisations develop software", "front": "Give the reasons, and tie them to a case study.", "back": ["A new opportunity to exploit", "Inefficiency or failure in the current system", "Changing user needs or expectations", "Legal or regulatory change forcing an update", "Competitive advantage, or cost reduction", "In a case study, name the reason AND the evidence for it in that organisation"]}}, {"id": "3.2.2", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Features of a brief", "detail": "Background/context, the problem or need, scope, stakeholders, constraints, timeline, deliverables. It's the agreed starting point that everything later is checked back against.", "questions": [{"marks": 4, "q": "A community sports club has asked a developer to build a membership system. Describe four elements that should appear in the brief and explain the purpose of the brief overall.", "answer": ["Any four of: background/context, statement of the problem or opportunity, scope, stakeholders, constraints, timeline, deliverables.", "Purpose: it is the agreed starting point that later work is checked back against.", "It settles what the solution is expected to cover before design begins."]}], "card": {"key": "R1", "title": "Features of a brief", "front": "What goes in a brief, and what is it for?", "back": ["Background and context of the organisation or situation", "Statement of the problem, need or opportunity", "Scope — what the solution will and won't cover", "Stakeholders affected, and the constraints in play", "Timeline and deliverables expected", "It's the agreed starting point everything later is checked back against"]}}, {"id": "3.2.3", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Project management using Gantt charts", "detail": "Tasks, durations, dependencies, milestones, the critical path (the longest path with no slack) and slack/float. Be able to read a chart, find the critical path and work out the effect of a delay.", "questions": [{"marks": 4, "q": "Explain what the critical path on a Gantt chart represents, what slack means, and the effect of a three-day delay to a task with two days of slack.", "answer": ["The critical path is the longest sequence of dependent tasks, determining the minimum project duration.", "Tasks on it have zero slack — any delay delays the whole project.", "Slack is the time a task can be delayed without affecting the project end date.", "A three-day delay on a task with two days of slack overruns by one day, so the project finishes one day late and that task becomes critical."]}]}, {"id": "3.2.4", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Techniques for collecting data", "detail": "Interviews, surveys, observation, analysis of existing documents. Know the strengths and weaknesses of each so you can justify one for a given situation, plus ethical collection (consent, de-identification).", "questions": [{"marks": 4, "q": "A developer must gather requirements from 300 staff across five sites. Recommend two data collection techniques, justify each, and state one limitation of your combined approach.", "answer": ["Surveys — reach all 300 efficiently and produce quantitative data that can be compared across sites.", "Interviews with a small sample — provide depth and allow follow-up questions surveys cannot.", "Limitation: survey response rates may be low and self-selecting, and interviews cover only a few staff.", "Also acceptable: observation, analysis of existing documents."]}]}, {"id": "3.2.5", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Functional and non-functional requirements in analysis", "detail": "Same distinction as 3.1.2, but now you're deriving them from collected data and writing them into the SRS. They need to be specific and measurable enough to test against later.", "questions": [{"marks": 3, "q": "Rewrite the vague requirement 'the system should be fast' as a measurable non-functional requirement, and explain why the original is unusable.", "answer": ["Measurable version: 'The system must return search results within 2 seconds for a database of up to 50 000 records.'", "The original cannot be tested — there is no threshold to check against.", "Requirements are applied as evaluation criteria later, so they must be measurable at the point they are written."]}]}, {"id": "3.2.6", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Constraints that influence solution development", "detail": "Economic (budget), technical (hardware, software, speed, storage), social (user expectations and skill level), legal (privacy, copyright), usability. Know the difference between a constraint and a requirement.", "questions": [{"marks": 4, "q": "A school has a fixed budget of $8000, existing servers running an older operating system, and staff with limited technical skills. Classify each of these as a type of constraint and explain how each would shape the solution.", "answer": ["$8000 budget — economic constraint; limits the tools, licences and development time available.", "Older operating system — technical constraint; limits the languages and frameworks that can be deployed.", "Limited staff skills — social/usability constraint; the interface must be simple and training minimal.", "A constraint limits HOW the solution is built; a requirement states what it must do."]}], "card": {"key": "A12", "title": "Constraints and solution scope", "front": "Distinguish a constraint from a requirement, and define scope.", "back": ["Constraints: economic, technical, social, legal, usability", "A requirement is what the solution must do; a constraint LIMITS how you do it", "Scope is the boundary — what's in, and explicitly what's out", "Constraints shape the scope directly", "A clear scope is what protects you from scope creep", "Write out-of-scope statements, not just in-scope ones"]}}, {"id": "3.2.7", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Characteristics of solution scope", "detail": "The boundary — what the solution will and won't do. Shaped directly by the constraints, and the thing that protects you from scope creep. Be able to write in-scope and out-of-scope statements.", "questions": [{"marks": 3, "q": "A client asks for a booking system, then later requests an added payroll module. Explain how a clearly defined scope protects the project, and write one out-of-scope statement for this solution.", "answer": ["Scope defines the boundary of what the solution will and will not do, agreed before design begins.", "It gives an objective basis for refusing or re-negotiating additions, preventing scope creep.", "Out-of-scope statement: 'The solution will not process staff payroll or salary payments.'", "Changes beyond scope require a renegotiated timeline and budget."]}], "card": {"key": "A12", "title": "Constraints and solution scope", "front": "Distinguish a constraint from a requirement, and define scope.", "back": ["Constraints: economic, technical, social, legal, usability", "A requirement is what the solution must do; a constraint LIMITS how you do it", "Scope is the boundary — what's in, and explicitly what's out", "Constraints shape the scope directly", "A clear scope is what protects you from scope creep", "Write out-of-scope statements, not just in-scope ones"]}}, {"id": "3.2.8", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Context diagrams", "detail": "One process representing the whole system, the external entities around it, and the data flows between them. No data stores, no internal processes. Know the conventions well enough to spot errors.", "questions": [{"marks": 4, "q": "A student draws a context diagram showing two processes, an external entity and a data store. Identify two errors and explain the correct convention in each case.", "answer": ["Error: a context diagram must contain exactly ONE process, representing the whole system.", "Error: a context diagram contains NO data stores — those appear only in the data flow diagram.", "External entities and labelled data flows in and out are correct.", "1 mark for each error identified, 1 for each correct convention stated."]}, {"marks": 3, "q": "Explain what it means for a data flow diagram to 'balance' with its context diagram, and state one consequence of it failing to balance.", "answer": ["The DFD must show the same external entities as the context diagram.", "The data flows crossing the system boundary must be the same in both, in name and direction.", "If they do not balance, the two documents describe different systems, so the design cannot be trusted or built from."]}], "card": {"key": "R2", "title": "Context diagrams and data flow diagrams", "front": "Give the conventions for both, and the rule connecting them.", "back": ["Context diagram: ONE process = the whole system, with external entities around it", "Context diagram has NO data stores and no internal processes", "DFD: numbered processes, data stores, external entities, labelled data flows", "Every flow must be labelled with the data it carries", "The DFD must BALANCE with the context diagram — same entities, same external flows", "Data cannot flow entity to entity, or store to store, without a process"]}}, {"id": "3.2.9", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Data flow diagrams", "detail": "Numbered processes, data stores, external entities, data flows. Must balance with the context diagram — same entities, same external flows. Common convention errors are a favourite exam question.", "questions": [{"marks": 4, "q": "In a level 1 data flow diagram, a student draws a data flow directly from the external entity 'Customer' to the data store 'Orders'. Identify the error, explain the correct convention, and state two other conventions a DFD must follow.", "answer": ["Error: data cannot flow directly between an external entity and a data store.", "A process must sit between them — something in the system must handle the data before it is stored.", "Convention: every data flow must be labelled with the data it carries.", "Convention: processes are numbered, and the diagram must balance with the context diagram."]}], "card": {"key": "R2", "title": "Context diagrams and data flow diagrams", "front": "Give the conventions for both, and the rule connecting them.", "back": ["Context diagram: ONE process = the whole system, with external entities around it", "Context diagram has NO data stores and no internal processes", "DFD: numbered processes, data stores, external entities, labelled data flows", "Every flow must be labelled with the data it carries", "The DFD must BALANCE with the context diagram — same entities, same external flows", "Data cannot flow entity to entity, or store to store, without a process"]}}, {"id": "3.2.10", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Use case diagrams", "detail": "Actors, use cases, the system boundary, and include/extend relationships. Shows what each type of user can do with the system, not how it works internally.", "questions": [{"marks": 3, "q": "A use case diagram for a library system shows an actor 'Member' connected to 'Borrow item', which has an «include» relationship to 'Verify membership'. Explain what the diagram is communicating.", "answer": ["Member is an actor — a role interacting with the system from outside the boundary.", "Borrow item is a use case — something the system does for that actor.", "«include» means verifying membership ALWAYS occurs as part of borrowing an item.", "The diagram shows what a user can do, not how the system performs it."]}], "card": {"key": "R3", "title": "Use case diagrams", "front": "What does a use case diagram show, and what are its parts?", "back": ["Actors — the people or systems interacting, drawn as stick figures outside", "Use cases — what the system does for them, drawn as ovals inside", "System boundary — the box separating inside from outside", "Include — one use case always invokes another", "Extend — optional or conditional behaviour", "It shows WHAT a user can do, never how the system does it"]}}, {"id": "3.2.11", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Software requirements specification", "detail": "Pulls together the brief, functional and non-functional requirements, constraints, scope and the analysis diagrams into one agreed document that the design stage is built from. Know its purpose and typical contents.", "questions": [{"marks": 3, "q": "State the purpose of a software requirements specification and name three components it contains.", "answer": ["Purpose: it is the agreed and documented basis from which the design stage proceeds.", "Any three of: functional requirements, non-functional requirements, constraints, scope, the analysis diagrams, background from the brief.", "It is signed off before design so that 'done' is defined in advance."]}], "card": {"key": "A13", "title": "Software requirements specification", "front": "What goes into an SRS and what is it for?", "back": ["The brief and the background it came from", "Functional and non-functional requirements", "Constraints and scope", "The analysis diagrams: context diagram, DFD, use case diagram", "It's the agreed basis the design stage is built from", "Signed off before design starts — it settles what 'done' means"]}}, {"id": "3.2.12", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Key legal requirements around privacy and ownership of data", "detail": "Privacy Act 1988 (Cwlth) and the APPs (especially APP 11, security), Health Records Act 2001 (HPPs), Privacy and Data Protection Act 2014 (IPPs, Victorian public sector), Copyright Act 1968 (ownership of code and content). Know which applies to which kind of organisation.", "questions": [{"marks": 4, "q": "A Victorian medical clinic is developing software that stores patient records. Name two pieces of legislation that apply and state one specific obligation each imposes on the developer.", "answer": ["Health Records Act 2001 (Vic) — governs handling of health information through the Health Privacy Principles.", "Privacy Act 1988 (Cwlth) — the Australian Privacy Principles; APP 11 requires reasonable steps to secure personal information.", "Also acceptable: Privacy Amendment (Notifiable Data Breaches) Act 2017 — eligible breaches must be reported to the OAIC and affected individuals.", "The obligation must be specific, not just the name of the Act."]}], "card": {"key": "A14", "title": "Legislation affecting data and software", "front": "Name the Acts and who each applies to.", "back": ["Privacy Act 1988 (Cwlth) — the Australian Privacy Principles; APP 11 is security", "Privacy Amendment (Notifiable Data Breaches) Act 2017 — must report eligible breaches", "Health Records Act 2001 (Vic) — health information, the HPPs", "Privacy and Data Protection Act 2014 (Vic) — Victorian public sector, the IPPs", "Copyright Act 1968 — ownership of code, content and designs", "Say which Act applies to THAT organisation and what it obliges them to do"]}}, {"id": "3.2.13", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "File management techniques", "detail": "Meaningful file naming, logical folder structures, version control (e.g. Git/GitHub), backups, archiving and disposal. Tie these to protecting work in progress on a long project.", "questions": [{"marks": 3, "q": "A team of four developers is working on the same codebase over six months. Describe three file management techniques they should use and the risk each addresses.", "answer": ["Version control (e.g. Git): tracks changes and allows rollback; addresses overwriting each other's work.", "Regular offsite or cloud backups: addresses loss of work through hardware failure.", "Consistent naming and folder structure: addresses time lost locating files and accidental duplication.", "Also acceptable: archiving completed work, secure disposal of superseded files."]}], "card": {"key": "A15", "title": "File management techniques", "front": "How is work protected across a long project?", "back": ["Meaningful, consistent file naming", "A logical folder structure agreed by the team", "Version control — Git or similar, with a history you can roll back", "Regular backups, ideally offsite or cloud", "Archiving completed work and disposing of what's no longer needed securely", "Tie these to protecting work in progress, not just tidiness"]}}, {"id": "3.2.14", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Techniques for generating design ideas", "detail": "Ideation tools — brainstorming, mind mapping, sketching, SCAMPER, rapid prototyping. The point is divergence: several genuinely different ideas before you narrow down to one.", "questions": [{"marks": 3, "q": "Name two techniques for generating design ideas and explain why divergence matters before a design is chosen.", "answer": ["Any two of: brainstorming, mind mapping, sketching, SCAMPER, rapid prototyping.", "Divergence produces several genuinely different ideas rather than variations on the first one.", "Committing to the first idea risks missing a better approach, and leaves no basis for justifying the choice made."]}]}, {"id": "3.2.15", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Criteria for evaluating efficiency and effectiveness", "detail": "Measurable criteria written from the requirements. Efficiency covers time, cost and effort; effectiveness covers functionality, accuracy, usability, completeness, readability, attractiveness and timeliness. Written in Unit 3, applied in Unit 4.", "questions": [{"marks": 4, "q": "Write two evaluation criteria for a school timetabling solution — one measuring efficiency and one measuring effectiveness — and explain how each would be measured.", "answer": ["Efficiency criterion, e.g. the solution generates a full timetable in under 60 seconds. Measured by timing test runs.", "Effectiveness criterion, e.g. no student is scheduled into two classes in the same period. Measured by checking generated timetables for clashes.", "Efficiency covers time, cost and effort; effectiveness covers functionality, accuracy, usability and completeness.", "Criteria must be measurable or they cannot be applied in the evaluation."]}], "card": {"key": "A16", "title": "Efficiency and effectiveness", "front": "Define both and list what each covers.", "back": ["Efficiency — time, cost and effort used to achieve the result", "Effectiveness — whether it actually does the job", "Effectiveness covers functionality, accuracy, usability, completeness", "Also readability, attractiveness, timeliness, communication of message", "A solution can be efficient and ineffective, or the reverse", "Criteria are written in Unit 3 design and applied in Unit 4"]}}, {"id": "3.2.16", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Tools for turning design ideas into detailed designs", "detail": "Data dictionaries, mock-ups, object descriptions, IPO charts, pseudocode. The test of a detailed design: could another competent developer build the solution from it without asking you questions?", "questions": [{"marks": 3, "q": "State the test of whether a detailed design is complete, and name three tools that contribute to meeting it.", "answer": ["Test: another competent developer could build the solution from the design without asking questions.", "Data dictionary — every variable's type, size, format and validation.", "Mock-ups and object descriptions — the interface and the structure of each class.", "Pseudocode and IPO charts — the logic and the data movement through each module."]}]}, {"id": "3.2.17", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Characteristics of user experiences", "detail": "Usefulness, usability, accessibility/findability, desirability, credibility. Be able to explain how each one affects user satisfaction and whether people keep using the software.", "questions": [{"marks": 3, "q": "Explain three characteristics of user experience and describe how each affects whether a solution continues to be used.", "answer": ["Usefulness — if it does not solve a real problem, users abandon it regardless of quality.", "Usability — if operating it requires training, users make errors and disengage.", "Accessibility — if users with differing abilities cannot operate it, part of the audience is excluded.", "Also acceptable: desirability, credibility."]}], "card": {"key": "A18", "title": "Characteristics of user experiences", "front": "Name the qualities of a good user experience.", "back": ["Usefulness — does it solve a real problem for this user", "Usability — can they operate it without training", "Accessibility — can people with differing abilities use it", "Desirability — do they want to use it", "Credibility — do they trust it with their data", "Explain how each affects whether people keep using the software"]}}, {"id": "3.2.18", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Design principles influencing appearance", "detail": "Alignment, repetition, contrast, space, balance. Apply them to a given mock-up and explain what a specific change would improve.", "questions": [{"marks": 4, "q": "A mock-up has headings in four different fonts, controls at varied indents, and no space between sections. Identify two design principles being breached and describe a specific change to correct each.", "answer": ["Repetition is breached — use a single consistent heading font and style throughout.", "Alignment is breached — align all controls to a common left edge or grid.", "Also acceptable: space — add white space between sections to group related content.", "Marks are for naming the principle AND describing a specific corrective change."]}], "card": {"key": "A19", "title": "Design principles", "front": "Split the principles into appearance and functionality.", "back": ["Appearance: alignment, repetition, contrast, space, balance", "Functionality: navigation, ease of use, error tolerance, robustness, accessibility", "Error tolerance — the solution survives bad input and helps the user recover", "Robustness — it keeps working under unexpected conditions", "Security features like authentication trade off against ease of use", "Apply them to a given mock-up and say what a specific change would improve"]}}, {"id": "3.2.19", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Design principles influencing functionality", "detail": "Navigation, ease of use, error tolerance, robustness, accessibility. Also how security features like user authentication or encryption affect functionality and the user experience.", "questions": [{"marks": 3, "q": "Explain what is meant by error tolerance and describe two features that would improve the error tolerance of a data entry form.", "answer": ["Error tolerance: the solution anticipates mistakes, prevents damage, and helps the user recover.", "Feature: validation with a clear message identifying which field is wrong and why.", "Feature: confirmation before a destructive action, or an undo function.", "Also acceptable: retaining entered data when a form is rejected rather than clearing it."]}], "card": {"key": "A19", "title": "Design principles", "front": "Split the principles into appearance and functionality.", "back": ["Appearance: alignment, repetition, contrast, space, balance", "Functionality: navigation, ease of use, error tolerance, robustness, accessibility", "Error tolerance — the solution survives bad input and helps the user recover", "Robustness — it keeps working under unexpected conditions", "Security features like authentication trade off against ease of use", "Apply them to a given mock-up and say what a specific change would improve"]}}, {"id": "4.1.1", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Characteristics of efficient and effective solutions", "detail": "Efficiency is measured in time, cost and effort. Effectiveness is whether it actually does the job — functionality, accuracy, usability, completeness, readability, attractiveness, timeliness, communication of message. A solution can easily be one without the other.", "questions": [{"marks": 3, "q": "A solution produces correct output but takes 40 seconds to load and requires users to re-enter data on every screen. Evaluate this solution in terms of efficiency and effectiveness.", "answer": ["Effective in part — it is functional and accurate, producing correct output.", "Not effective in usability — repeated re-entry frustrates users and increases error rates.", "Not efficient — 40 seconds of loading wastes user time and effort.", "A solution can be effective without being efficient, and the reverse."]}], "card": {"key": "A16", "title": "Efficiency and effectiveness", "front": "Define both and list what each covers.", "back": ["Efficiency — time, cost and effort used to achieve the result", "Effectiveness — whether it actually does the job", "Effectiveness covers functionality, accuracy, usability, completeness", "Also readability, attractiveness, timeliness, communication of message", "A solution can be efficient and ineffective, or the reverse", "Criteria are written in Unit 3 design and applied in Unit 4"]}}, {"id": "4.1.2", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Data types, structures and sources for input, storage and output", "detail": "Choosing structures that make manipulation efficient across a whole solution, not one module — how data comes in, how it's held while the program runs, how it's written back out.", "questions": [{"marks": 3, "q": "A solution reads a CSV of sales records, totals them by region, and writes a summary file. Identify an appropriate data source, data structure and data type for this process.", "answer": ["Data source: a delimited (CSV) file — flat records with fixed fields suit tabular sales data.", "Data structure: an array of records, or an associative array keyed by region for accumulating totals.", "Data type: floating point for the monetary totals; string for the region name."]}]}, {"id": "4.1.3", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Features of a programming language in a full solution", "detail": "Modularity, functions and methods, classes, error/exception handling, GUI elements, file input and output — used together to build something complete rather than as isolated exercises.", "questions": [{"marks": 3, "q": "Explain why exception handling is needed in a solution that reads from an external data file, and describe what should happen when the file cannot be found.", "answer": ["Without handling, a missing or malformed file causes a runtime error and the program crashes.", "The exception should be caught and the failure handled gracefully.", "The user should see a clear message identifying the problem, with the solution remaining usable.", "Robustness: the solution keeps working under unexpected conditions."]}], "card": {"key": "A20", "title": "A programming language in a full solution", "front": "What does building a complete solution require beyond isolated modules?", "back": ["Modularity — the solution broken into functions, methods and classes", "Error and exception handling so it fails gracefully", "A GUI with event handling wired to the logic", "File input and output for persistence", "Validation at every point where data enters", "The parts working together, not just each working alone"]}}, {"id": "4.1.4", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Established and innovative approaches to software development", "detail": "APIs, libraries, frameworks, public code repositories, AI-based coding assistants. Benefits (speed, reuse, tested code) against risks (dependency, access revoked or the API changed, licensing and IP, security holes, unverified output).", "questions": [{"marks": 4, "q": "A developer plans to use a third-party API for payment processing. Describe two benefits and two risks of this approach.", "answer": ["Benefit: development is faster — the payment logic is already built and tested.", "Benefit: security and compliance are handled by a specialist provider.", "Risk: dependency — if the API changes or access is revoked, the solution breaks.", "Risk: licensing, cost and data sovereignty — customer data passes through a third party."]}], "card": {"key": "A21", "title": "Established and innovative approaches", "front": "What are the options, and what does each risk?", "back": ["APIs, libraries, frameworks, public code repositories, AI coding assistants", "Benefits: speed, reuse, well-tested code, features you couldn't build alone", "Risk: dependency on something outside your control", "Risk: the API changes or access is revoked mid-project", "Risk: licensing and IP — can you legally ship it", "Risk: security holes and unverified code entering your solution"]}}, {"id": "4.1.5", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Validation techniques", "detail": "Existence, type and range checking applied at every input point in the solution, with clear feedback to the user when input is rejected.", "questions": [{"marks": 3, "q": "Explain why validation must be applied at every point where data enters a solution, and describe what should happen when input is rejected.", "answer": ["Any unvalidated entry point allows invalid data into the system, corrupting stored data and causing runtime errors later.", "Validating in one place only is defeated by a second input path.", "On rejection: the user should see a clear message naming the field and the problem, with their other entries retained rather than cleared."]}]}, {"id": "4.1.6", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Debugging and alpha testing techniques", "detail": "Alpha testing is internal — done by you or the development team before release, in a controlled environment. Paired with debugging tools to find and fix faults before real users see them.", "questions": [{"marks": 3, "q": "Distinguish between alpha and beta testing, and explain why both are conducted.", "answer": ["Alpha testing is internal — carried out by the developer or team in a controlled environment before release.", "Beta testing uses real users in a real environment after alpha testing is complete.", "Both are needed because they find different classes of problem: alpha catches known faults, beta catches uses the developer never imagined.", "Beta testing requires a plan — who tests, what tasks, how feedback is collected."]}], "card": {"key": "A22", "title": "Debugging and alpha testing", "front": "What is alpha testing and how does it differ from beta?", "back": ["Alpha testing is INTERNAL — the developer or team, before release", "Carried out in a controlled environment on an incomplete or complete build", "Paired with debugging tools to find and fix faults", "Beta testing comes after: real users, real environment", "Alpha catches the faults; beta catches what the developer couldn't imagine", "Both are needed — they find different classes of problem"]}}, {"id": "4.1.7", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Conducting beta testing", "detail": "Real users, real environment, after alpha. Needs a plan: who tests, what tasks they do, how feedback is collected, and how you respond to what comes back. Know how it differs from alpha testing and why both are needed.", "questions": [{"marks": 4, "q": "Describe what a beta testing plan should include, and explain why beta testing finds problems alpha testing cannot.", "answer": ["Who the testers are and how they are selected; the tasks they will perform.", "How feedback will be collected, and how the team will respond to it.", "Beta uses real users in real environments, on hardware and with data the developer never anticipated.", "Developers know how the solution is meant to be used, so they do not test the ways real users get it wrong."]}]}, {"id": "4.1.8", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Features of evaluation strategies", "detail": "Three parts: the criteria themselves, what data you'll collect and how, and the timeline plus who is responsible for collecting it. The strategy is planned before the evaluation happens.", "questions": [{"marks": 3, "q": "Name the three components of an evaluation strategy and explain when the strategy is created.", "answer": ["The evaluation criteria themselves.", "What data will be collected and how it will be collected.", "The timeline for collection and who is responsible for it.", "The strategy is created during design, before the solution is finished — not after."]}], "card": {"key": "A23", "title": "Features of evaluation strategies", "front": "What are the three parts of an evaluation strategy?", "back": ["The evaluation criteria themselves", "What data will be collected, and how it will be collected", "The timeline, and who is responsible for collecting it", "Planned BEFORE the evaluation happens, during design", "Data sources: user surveys, test results, usage logs, observation", "A strategy without a timeline and an owner is incomplete"]}}, {"id": "4.1.9", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Techniques for applying evaluation criteria", "detail": "Gather evidence — test results, user feedback, usage data — and judge each criterion against it. An evaluation is a supported judgement, not an opinion about how you feel it went.", "questions": [{"marks": 4, "q": "A developer writes in their evaluation: 'The solution works well and users seem happy with it.' Explain two weaknesses in this evaluation and describe what a stronger evaluation would include.", "answer": ["Weakness: it is an opinion, not a judgement supported by evidence.", "Weakness: it does not reference the evaluation criteria established during design.", "Stronger: each criterion addressed in turn, stating whether it was met, partly met or not met.", "Stronger: supported by evidence — test results, user survey responses, usage data or timings."]}], "card": {"key": "A17", "title": "Applying evaluation criteria", "front": "How do you actually evaluate a solution?", "back": ["Take each criterion in turn and gather evidence against it", "Evidence: test results, user feedback, usage data, timings", "Make a judgement and support it with that evidence", "An evaluation is not an opinion about how it felt to build", "Criteria must be measurable or you can't apply them", "Say whether the criterion was met, partly met or not met"]}}, {"id": "4.1.10", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Factors influencing the effectiveness of project plans", "detail": "Realistic time estimates, correct task sequencing and dependencies, identified milestones, resource and skill availability, contingency time, and unexpected events.", "questions": [{"marks": 4, "q": "A project plan overruns by three weeks. Identify three factors that commonly cause this and explain how each could have been managed.", "answer": ["Unrealistic time estimates — use historical data from similar tasks rather than best-case guesses.", "Missing or wrong dependencies — map predecessors properly so sequencing reflects reality.", "No contingency time — build slack into the plan for tasks with uncertain scope.", "Also acceptable: resource or skill availability, unexpected events, scope creep."]}]}, {"id": "4.1.11", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Techniques for recording the progress of projects", "detail": "Annotated Gantt charts, project journals and logs, change logs, issue logs, version control history. These become the evidence you use when assessing the plan.", "questions": [{"marks": 3, "q": "Name three techniques for recording project progress and explain why the record matters at the end of the project.", "answer": ["Annotated Gantt chart showing actual versus planned dates.", "A project journal or log recording decisions, problems and time spent.", "Change and issue logs, plus version control history.", "These are the evidence used to assess the plan afterwards — without them the evaluation is guesswork."]}]}, {"id": "4.1.12", "area": "Unit 4 AoS 1 — Development and Evaluation", "title": "Assessing the effectiveness of a project plan", "detail": "Compare planned against actual using your logs — where did it slip, why, and what would you change next time. Needs specific evidence, not \"I ran out of time\".", "questions": [{"marks": 4, "q": "A student writes 'the plan worked well but I ran out of time at the end'. Explain two weaknesses in this assessment and describe what a stronger one would contain.", "answer": ["It contains no evidence — no comparison of planned against actual dates.", "It identifies no cause, so nothing can be learned or changed next time.", "Stronger: name the specific tasks that overran, by how long, and why.", "Stronger: state what you would change — a revised estimate, an earlier start, or a reduced scope."]}]}, {"id": "4.2.1", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Goals and objectives of organisations", "detail": "Goals are broad and long-term; objectives are specific and measurable. Be able to link secure development practices to the organisation's goals — business continuity, reputation, customer trust, legal compliance.", "questions": [{"marks": 3, "q": "Explain the difference between an organisation's goals and its objectives, and link secure development practices to one goal.", "answer": ["Goals are broad, long-term statements of what the organisation is trying to achieve.", "Objectives are specific, measurable steps toward a goal, usually with a timeframe.", "Example: a goal of maintaining customer trust is supported by secure development, since a breach of customer data would directly damage it.", "Also acceptable: business continuity, legal compliance, reputation."]}]}, {"id": "4.2.2", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Advantages and disadvantages of developing software in-house", "detail": "For: control, customisation, retained IP, domain knowledge, data stays internal. Against: cost, time, staffing and skills, and the ongoing maintenance burden falls on you.", "questions": [{"marks": 4, "q": "A medium-sized organisation is deciding whether to develop a new inventory system in-house or purchase an off-the-shelf product. Describe two advantages and two disadvantages of developing it in-house.", "answer": ["Advantage: the solution is customised exactly to the organisation's processes.", "Advantage: intellectual property is retained and data never leaves the organisation.", "Disadvantage: higher upfront cost and a longer timeline before it is usable.", "Disadvantage: the organisation carries the ongoing maintenance and support burden."]}], "card": {"key": "A24", "title": "Developing software in-house", "front": "Weigh up in-house development.", "back": ["For: full control over the product and the timeline", "For: customised exactly to the organisation's needs", "For: IP retained, and data never leaves the organisation", "For: developers who understand the business domain", "Against: higher cost, longer timeline, staffing and skills needed", "Against: the ongoing maintenance burden falls on you forever"]}}, {"id": "4.2.3", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Vulnerabilities within insecure development environments", "detail": "Weak access control, shared or hardcoded credentials, unpatched tools, unsecured or public repositories, no code review, real personal data used as test data, unvetted third-party libraries, insider threat.", "questions": [{"marks": 4, "q": "An audit of a development team finds that API keys are written directly into source code, the code repository is publicly visible, and the test database contains real customer records. Identify cks, biometrics, secure server rooms, cable locks", "Software — firewalls, antivirus, encryption, MFA, access logs", "Procedural — access policies, code review, patching schedules, backups, training", "Procedural controls are the ones most often forgotten in answers", "Name the control AND the specific threat it addresses", "Layered controls: no single one is sufficient"]}}, {"id": "4.2.5", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Principles of threat modelling", "detail": "Systematically identify the assets worth protecting, who would attack them and how, and what the impact would be — then rank by likelihood and consequence so controls target real threats rather than guesses.", "questions": [{"marks": 4, "q": "Describe the steps involved in threat modelling and explain why an organisation would carry it out before selecting security controls.", "answer": ["Identify the assets worth protecting — data, code, systems, reputation.", "Identify who would attack them, how they would do it, and what the impact would be.", "Rank the threats by likelihood and consequence.", "Controls are then chosen against real, ranked threats rather than guesses, so limited budget is spent where risk is greatest."]}], "card": {"key": "A27", "title": "Principles of threat modelling", "front": "What are the steps of threat modelling?", "back": ["Identify the assets worth protecting — data, code, systems, reputation", "Identify who would attack them and what they'd want", "Identify how they'd do it — the attack vectors", "Assess the impact if it succeeded", "Rank by likelihood and consequence", "Choose controls that address the real ranked threats, not guesses"]}}, {"id": "4.2.6", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Criteria for evaluating the security of development practices", "detail": "Confidentiality (only authorised people get access), integrity (data stays accurate and unaltered), availability (accessible when needed). Use these as the framework when a case study asks you to judge current practices.", "questions": [{"marks": 3, "q": "An organisation's daily backups have never been tested by restoring them. Using the criteria for evaluating security, explain which element is at risk and why.", "answer": ["Availability is at risk — data must be accessible when it is needed.", "An untested backup may be corrupt or incomplete, so it provides no guarantee of recovery.", "Integrity may also be compromised if a restored backup contains altered or partial data.", "Confidentiality, integrity and availability are the three criteria."]}], "card": {"key": "A28", "title": "Criteria for evaluating security", "front": "Use the CIA triad to judge development practices.", "back": ["Confidentiality — only authorised people can access the data", "Integrity — data stays accurate, complete and unaltered", "Availability — data and systems are accessible when needed", "Backups serve availability; encryption serves confidentiality", "Version control and checksums serve integrity", "Use all three as the framework when a case study asks you to judge"]}}, {"id": "4.2.7", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Key legislation affecting organisations and data", "detail": "Privacy Act 1988 (Cwlth) and the APPs, Privacy Amendment (Notifiable Data Breaches) Act 2017, Health Records Act 2001, Privacy and Data Protection Act 2014, Copyright Act 1968. Know which applies to which organisation and what it actually obliges them to do.", "questions": [{"marks": 3, "q": "An online retailer suffers a breach exposing customer names, addresses and card details. Name the legislation that governs their response and state two obligations it imposes.", "answer": ["Privacy Amendment (Notifiable Data Breaches) Act 2017, operating under the Privacy Act 1988 (Cwlth).", "Obligation: assess whether the breach is likely to result in serious harm.", "Obligation: notify the OAIC and the affected individuals as soon as practicable.", "APP 11 also requires reasonable steps to have been taken to secure the information beforehand."]}], "card": {"key": "A14", "title": "Legislation affecting data and software", "front": "Name the Acts and who each applies to.", "back": ["Privacy Act 1988 (Cwlth) — the Australian Privacy Principles; APP 11 is security", "Privacy Amendment (Notifiable Data Breaches) Act 2017 — must report eligible breaches", "Health Records Act 2001 (Vic) — health information, the HPPs", "Privacy and Data Protection Act 2014 (Vic) — Victorian public sector, the IPPs", "Copyright Act 1968 — ownership of code, content and designs", "Say which Act applies to THAT organisation and what it obliges them to do"]}}, {"id": "4.2.8", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Ethical issues arising when developing software", "detail": "Ethical is not the same as legal. Collecting more data than needed, using real customer data in testing, attribution of AI-generated or copied code, disclosing known vulnerabilities, developer responsibility for harm. The ACS Code of Professional Conduct is a useful reference point.", "questions": [{"marks": 4, "q": "A development team wants to use a copy of the live customer database for testing. Explain why this is an ethical problem even if it is legal, and describe an alternative.", "answer": ["Customers consented to their data being used to provide a service, not for software testing.", "The test environment usually has weaker controls, so the risk of exposure is higher than they agreed to.", "Ethical practice includes data minimisation — use only the data actually needed.", "Alternative: generate synthetic test data, or de-identify the copy so individuals cannot be re-identified."]}]}, {"id": "4.2.9", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Measures to reduce or eliminate threats and risks", "detail": "Prevention, detection and response: patching, multi-factor authentication, encryption, least-privilege access, backups and disaster recovery planning, monitoring, and staff training.", "questions": [{"marks": 4, "q": "Describe one preventative, one detective and one responsive measure an organisation could use to protect its development environment, and explain why all three categories are needed.", "answer": ["Preventative: multi-factor authentication and least-privilege access, stopping unauthorised entry.", "Detective: access logging and monitoring, revealing an intrusion that prevention missed.", "Responsive: tested backups and a documented incident response plan, limiting damage once a breach occurs.", "No preventative control is perfect, so detection and response are needed for the breaches that get through."]}], "card": {"key": "A29", "title": "Measures to reduce threats and risks", "front": "Group your countermeasures.", "back": ["Prevention — patching, MFA, encryption, least-privilege access, training", "Detection — monitoring, logging, intrusion detection, audits", "Response — incident plan, backups, disaster recovery, breach notification", "Least privilege: give each person the minimum access they need", "Backups only count if they've been tested by restoring them", "A good answer covers all three phases, not just prevention"]}}, {"id": "4.2.10", "area": "Unit 4 AoS 2 — Cyber Security", "title": "Improving the security of software development practices", "detail": "Each recommendation must be tied to a specific threat or vulnerability you identified in the case study, justified, and honest about its cost or limitations. Generic recommendations score poorly.", "questions": [{"marks": 4, "q": "A case study describes a development team that shares one administrator account and has no patching schedule. Write two recommendations, each tied to a specific vulnerability, and note one limitation of your recommendations.", "answer": ["Recommendation: individual accounts with least-privilege access, addressing the shared administrator account — actions become attributable and a single compromise exposes less.", "Recommendation: a scheduled patching cycle with a named owner, addressing the unpatched tools that leave known exploits open.", "Limitation: both require staff time and may slow the team initially; patching can break existing dependencies.", "Generic recommendations score poorly — each must name the vulnerability from the stimulus."]}], "card": {"key": "A30", "title": "Improving security practices", "front": "What makes a recommendation score well?", "back": ["Tie it to a SPECIFIC threat or vulnerability you identified in the case study", "Say what the control is and how it addresses that vulnerability", "Justify why it's appropriate for this organisation", "Acknowledge the cost, limitation or trade-off honestly", "Generic recommendations ('use strong passwords') score poorly", "Quote the detail from the stimulus — that's what shows you read it"]}}], "source": "VCE Applied Computing Study Design 2025–2028.", "theme": {"paper": "#e9ece6", "lift": "#f2f4ef", "ink": "#1b2a27", "soft": "#5c6b66", "faint": "#626b67", "rule": "#cfd5cb", "ruleSoft": "#dde1d8", "accent": "#2f6b4a", "track": "#dfe2db"}, "papers": "2025 VCE Applied Computing: Software Development examination. Section A is 20 multiple-choice, Section B is 5 short-answer, Section C is a 60-mark case study."}];
// spoken labels: what the colour means, not what the colour is
const STATES = ["not rated","couldn't explain it","somewhat confident","confident"];
const SUGGESTED = "vce-tracker-progress.json";
const KEY_SAVED = "vce-tracker:all:savedAt";
const KEY_DEVICE = "vce-tracker:device";
const DB_NAME = "vce-tracker-all";

const byId = {};
for (const s of SUBJECTS) byId[s.id] = s;

let ratings = {};           // subjectId -> pointId -> [n,n,n]
let current = null;         // subject object or null for home
let pass = 0, filter = "all", view = "rate";
const cellFor = {};

/* ── storage (same per-subject keys the single-subject files use) ── */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch (e) { canSave = false; } };
let canSave = true;

function key(id) { return "vce-tracker:" + id + ":ratings"; }

function load() {
  for (const s of SUBJECTS) {
    let r = {};
    try { r = JSON.parse(lsGet(key(s.id)) || "{}") || {}; } catch (e) { r = {}; }
    ratings[s.id] = {};
    for (const p of s.points) {
      const v = r[p.id];
      ratings[s.id][p.id] = (Array.isArray(v) && v.length === 3) ? v.map(n => Number(n)||0) : [0,0,0];
    }
  }
  if (lsGet("vce-tracker:probe") === null) lsSet("vce-tracker:probe","1");
}

function save(id) { lsSet(key(id), JSON.stringify(ratings[id])); }
function saveAll() { for (const s of SUBJECTS) save(s.id); }

const deviceId = (() => {
  let d = lsGet(KEY_DEVICE);
  if (!d) { d = Math.random().toString(36).slice(2,8); lsSet(KEY_DEVICE,d); }
  return d;
})();

/* ── counting ── */
function tally(points, subjectId, r) {
  const c = [0,0,0,0];
  for (const p of points) c[ratings[subjectId][p.id][r]]++;
  return c;
}
function tallyAll(r) {
  const c = [0,0,0,0];
  for (const s of activeSubjects()) { const t = tally(s.points, s.id, r); for (let i=0;i<4;i++) c[i]+=t[i]; }
  return c;
}
const SELECTION_KEY = 'vce-tracker:subjects:v1';
let selectedSubjects = null;
try {
  const saved = JSON.parse(lsGet(SELECTION_KEY));
  if (Array.isArray(saved)) {
    const valid = [...new Set(saved.filter(id => Object.hasOwn(byId,id)))];
    if (valid.length) selectedSubjects = valid;
  }
} catch (e) {}
const activeSubjects = () => SUBJECTS.filter(s => !selectedSubjects || selectedSubjects.includes(s.id));
let totalPoints = activeSubjects().reduce((n,s) => n + s.points.length, 0);

/* ── overview ── */
function bar(counts, total) {
  const el = document.createElement("div");
  el.className = "bar";
  for (const s of [3,2,1]) {
    const seg = document.createElement("div");
    seg.className = "seg"; seg.dataset.s = String(s);
    seg.style.width = (counts[s] / total * 100) + "%";
    el.appendChild(seg);
  }
  return el;
}

function renderHome() {
  const subjects = activeSubjects();
  totalPoints = subjects.reduce((n,s) => n + s.points.length, 0);
  document.getElementById("colophon").textContent = "Shift-click a box to step backwards. " + totalPoints + " key knowledge points across " + subjects.length + " selected subjects.";
  const host = document.getElementById("totals");
  host.innerHTML = "";
  for (let r=0;r<3;r++) {
    const c = tallyAll(r);
    const row = document.createElement("div");
    row.className = "totals-row";
    const tag = document.createElement("div");
    tag.className = "tag"; tag.textContent = String(r+1);
    const count = document.createElement("div");
    count.className = "count";
    count.innerHTML = c[0] === totalPoints ? "not started"
      : "<b>" + c[3] + "</b> of " + totalPoints + " green";
    row.appendChild(tag); row.appendChild(bar(c,totalPoints)); row.appendChild(count);
    host.appendChild(row);
  }

  host.appendChild(legendKey());

  const done = tallyAll(0)[0] === totalPoints;
  document.getElementById("home-readout").innerHTML = done
    ? "Nothing rated yet. " + subjects.length + " subjects, " + totalPoints + " key knowledge points."
    : subjects.length + " subjects, <b>" + totalPoints + "</b> key knowledge points.";

  const list = document.getElementById("subject-list");
  list.innerHTML = "";
  for (const s of subjects) {
    const b = document.createElement("button");
    b.className = "subject"; b.type = "button";
    if (s.theme) b.style.setProperty("--swatch", swatchFor(s.theme));
    b.addEventListener("click", () => go(s.id));

    const left = document.createElement("div");
    const h2 = document.createElement("h2");
    const dot = document.createElement("span"); dot.className = "dot";
    h2.appendChild(dot); h2.appendChild(document.createTextNode(s.name));
    const meta = document.createElement("div"); meta.className = "meta";
    const c0 = tally(s.points, s.id, 0);
    meta.textContent = c0[0] === s.points.length
      ? s.points.length + " points"
      : c0[3] + " of " + s.points.length + " green in pass 1";
    left.appendChild(h2); left.appendChild(meta);

    const minis = document.createElement("div"); minis.className = "minis";
    for (let r=0;r<3;r++) {
      const m = document.createElement("div"); m.className = "mini";
      const lab = document.createElement("span"); lab.textContent = String(r+1);
      m.appendChild(lab); m.appendChild(bar(tally(s.points, s.id, r), s.points.length));
      minis.appendChild(m);
    }
    b.appendChild(left); b.appendChild(minis);
    list.appendChild(b);
  }
}

/* ── routing ── */
function go(id) {
  if (id && byId[id] && (!selectedSubjects || selectedSubjects.includes(id))) { current = byId[id]; location.hash = id; }
  else { current = null; if (location.hash) location.hash = ""; }
  render();
}

const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

/* subject accents were picked for light paper; blend toward white to clear 4.5:1 on the dark one */
function lift(hex, target) {
  const lin = v => v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  const base = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)/255);
  let lo = 0, hi = 1, c = base;
  for (let i = 0; i < 24; i++) {
    const m = (lo+hi)/2;
    c = base.map(v => v + (1-v)*m);
    if (0.2126*lin(c[0]) + 0.7152*lin(c[1]) + 0.0722*lin(c[2]) < target) lo = m; else hi = m;
  }
  return "#" + c.map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("");
}
function accentFor(t) {
  const theme = document.documentElement.dataset.theme;
  const dark = theme === "midnight" || (theme !== "notebook" && darkMQ.matches);
  if (!t) return theme === "midnight" ? "#b6acff" : theme === "notebook" ? "#315d82" : dark ? "#9fb0a8" : "#3f4f4a";
  return dark ? lift(t.accent, 0.42) : t.accent;
}
const swatchFor = t => !t ? "transparent" : accentFor(t);

function paintChrome() {
  const m = document.querySelector('meta[name="theme-color"][media*="' + (darkMQ.matches ? "dark" : "light") + '"]');
  const paper = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
  if (m && paper) m.setAttribute("content", paper);
}

let themeTimer = null;
function applyTheme(t) {
  document.documentElement.classList.add("theming");
  clearTimeout(themeTimer);
  themeTimer = setTimeout(() => document.documentElement.classList.remove("theming"), 380);
  // the palette is fixed per page; only the accent moves with the subject
  document.documentElement.style.setProperty("--accent", accentFor(t));
  paintChrome();
}

darkMQ.addEventListener("change", () => { applyTheme(current ? current.theme : null); if (!current) renderHome(); });
window.addEventListener("tracker-theme-change", () => { applyTheme(current ? current.theme : null); if (!current) renderHome(); });

function render() {
  document.getElementById("home").classList.toggle("hidden", !!current);
  document.getElementById("subject-view").classList.toggle("hidden", !current);
  applyTheme(current ? current.theme : null);
  if (current) {
    document.getElementById("subject-title").textContent = current.name;
    pass = 0; filter = "all"; view = "rate";
    syncChips("pass-chips", 0); syncChips("filter-chips", "all"); syncChips("view-chips", "rate");
    buildMap(); applyView(); summarise();
    window.scrollTo(0,0);
  } else {
    renderHome();
    window.scrollTo(0,0);
  }
}

/* ── map ── */
function buildMap() {
  const host = document.getElementById("map-rows");
  host.innerHTML = "";
  for (const k in cellFor) delete cellFor[k];
  const S = current;

  for (let r=0;r<3;r++) {
    const row = document.createElement("div");
    row.className = "map-row"; row.dataset.pass = String(r);
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = String(r+1);
    const groups = document.createElement("div"); groups.className = "map-groups";
    let n = 0;
    for (const area of S.areas) {
      const inArea = S.points.filter(p => p.area === area);
      const g = document.createElement("div"); g.className = "map-group";
      g.style.flex = inArea.length + " 1 0";
      for (const p of inArea) {
        const cell = document.createElement("button");
        cell.className = "cell"; cell.type = "button";
        cell.dataset.state = String(ratings[S.id][p.id][r]);
        cell.style.animationDelay = Math.min(n*3 + r*60, 360) + "ms";
        cell.setAttribute("aria-label", "Pass "+(r+1)+", "+p.id+" "+p.title+": "+STATES[ratings[S.id][p.id][r]]);
        cell.addEventListener("mouseenter", () => say(p,r));
        cell.addEventListener("focus", () => say(p,r));
        cell.addEventListener("mouseleave", summarise);
        cell.addEventListener("blur", summarise);
        cell.addEventListener("click", () => jumpTo(p.id));
        (cellFor[p.id] = cellFor[p.id] || [])[r] = cell;
        g.appendChild(cell); n++;
      }
      groups.appendChild(g);
    }
    const count = document.createElement("div"); count.className = "count";
    row.appendChild(tag); row.appendChild(groups); row.appendChild(count);
    host.appendChild(row);
  }

  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const area of S.areas) {
    const inArea = S.points.filter(p => p.area === area);
    const sp = document.createElement("span");
    sp.style.flex = inArea.length + " 1 0";
    sp.textContent = (S.short && S.short[area]) || area;
    sp.title = area;
    legend.appendChild(sp);
  }
  refreshMapCounts();
}

function refreshMapCounts() {
  const S = current, total = S.points.length;
  document.querySelectorAll(".map-row").forEach(row => {
    const r = Number(row.dataset.pass);
    const c = tally(S.points, S.id, r);
    row.querySelector(".count").innerHTML = c[0] === total ? "not started"
      : "<b>" + c[3] + "</b> of " + total + " green";
  });
}

function say(p, r) {
  document.getElementById("readout").innerHTML =
    "<b>"+p.id+"</b> "+p.title+". Pass "+(r+1)+", "+STATES[ratings[current.id][p.id][r]]+". Click to jump to it.";
}

function summarise() {
  if (!current) return;
  const c = tally(current.points, current.id, pass);
  const rated = current.points.length - c[0];
  const el = document.getElementById("readout");
  el.innerHTML = rated === 0
    ? "Pass " + (pass+1) + " hasn't been started. Rate anything below and it appears here."
    : "Pass "+(pass+1)+": <b>"+c[3]+"</b> green, "+c[2]+" amber, "+c[1]+" red"+(c[0] ? ", "+c[0]+" still to rate" : "")+".";
  renderStats();
}

const cssId = id => "p-" + String(id).replace(/\./g,"-");

const STAT_LABEL = ["not yet rated","couldn't explain it","somewhat confident","confident"];

function renderStats() {
  const host = document.getElementById("stats");
  if (!host || !current) return;
  const c = tally(current.points, current.id, pass);
  host.innerHTML = "";
  for (const s of [3,2,1,0]) {
    const d = document.createElement("div"); d.className = "stat"; d.dataset.s = String(s);
    const n = document.createElement("span"); n.className = "stat-n"; n.textContent = String(c[s]);
    const k = document.createElement("span"); k.className = "stat-k"; k.textContent = STAT_LABEL[s];
    d.appendChild(n); d.appendChild(k); host.appendChild(d);
  }
}

function legendKey() {
  const wrap = document.createElement("div"); wrap.className = "legend-key";
  for (const s of [1,2,3]) {
    const k = document.createElement("span"); k.className = "key"; k.dataset.s = String(s);
    const i = document.createElement("i");
    k.appendChild(i); k.appendChild(document.createTextNode(STAT_LABEL[s]));
    wrap.appendChild(k);
  }
  return wrap;
}

function announce(msg) { document.getElementById("announce").textContent = msg; }

function jumpTo(id) {
  let t = document.getElementById(cssId(id));
  if (!t) { filter = "all"; syncChips("filter-chips","all"); renderList(); t = document.getElementById(cssId(id)); }
  if (!t) return;
  t.scrollIntoView({block:"center"});
  t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
}

/* ── list ── */
function visible(p) {
  const v = ratings[current.id][p.id][pass];
  if (filter === "unrated") return v === 0;
  if (filter === "weak") return v === 1 || v === 2;
  return true;
}

function renderList() {
  const S = current, host = document.getElementById("list");
  host.innerHTML = "";
  let shown = 0;
  for (const area of S.areas) {

function autoCard(p) {
  const bits = p.detail.split(/(?:;|\. )/).map(x => x.trim().replace(/\.$/,"")).filter(x => x.length > 2);
  // don't lowercase acronyms or proper nouns — "DC generators" must not become "dC generators"
  const t = /^[A-Z][a-z]/.test(p.title) ? p.title.charAt(0).toLowerCase() + p.title.slice(1) : p.title;
  return { front: "Explain " + t + ".", back: bits, auto: true };
}

function renderCards() {

  host.innerHTML = "";

  for (const [want, kind, heading, note] of [

    [2, "amber", "Amber", "The half-known ones. Shorter cards are fine here; you mostly need the missing detail, not the whole idea."]
  ]) {
    const pts = S.points.filter(p => ratings[S.id][p.id][pass] === want);
    if (!pts.length) continue;

    // merge points that share an authored card
    const decks = [], seen = {};
    for (const p of pts) {
      const c = p.card || autoCard(p);
      const k = (p.card && p.card.key) ? "k" + p.card.key : "p" + p.id;
      if (seen[k] !== undefined) { decks[seen[k]].refs.push(p.id); continue; }

    btn.textContent = "Print the deck";
    btn.addEventListener("click", () => window.print());

const PRACTICE_KEY = 'vce-tracker:practice:v1';
let practiceScope = 'red';
function practiceKey(subject, point, index, round) { return [subject, point, index, round].join('|'); }
function cleanPractice(raw) {
  const clean = {};
  if (!raw || typeof raw !== 'object') return clean;
  for (const s of SUBJECTS) for (const p of s.points) (p.questions || []).forEach((q, i) => {
    for (let r = 0; r < 3; r++) {
      const k = practiceKey(s.id, p.id, i, r), a = raw[k];
      if (!a || typeof a !== 'object') continue;
      clean[k] = {
        text: typeof a.text === 'string' ? a.text : '',
        choice: Number.isInteger(a.choice) && q.options && a.choice >= 0 && a.choice < q.options.length ? a.choice : null,
        revealed: a.revealed === true,
        score: Number.isInteger(a.score) && a.score >= 0 && a.score <= (q.marks || 1) ? a.score : null,
        checks: (q.answer || []).map((_, j) => !!(Array.isArray(a.checks) && a.checks[j]))

    }

  return clean;
}
let practiceAttempts = (() => { try { return cleanPractice(JSON.parse(lsGet(PRACTICE_KEY) || '{}')); } catch (e) { return {}; } })();
function savePractice() {

}
function renderPractice() {

  const button = (text, action) => { const b = el('button', 'reveal', text); b.type = 'button'; b.addEventListener('click', action); return b; };
  const all = [];
  for (const p of S.points) (p.questions || []).forEach((q, i) => all.push({p, q, key:practiceKey(S.id, p.id, i, round)}));
  if (!all.length) {
    const box = el('div','empty'); box.append(el('strong', '', 'No question bank for ' + S.name + ' yet')); host.append(box); return;
  }
  const head = el('div', 'deck-head'); head.append(el('h3', '', 'Practice'), el('span', '', 'Pass ' + (round + 1))); host.append(head);
  host.append(el('p', 'deck-note', 'Write your answer, reveal the guide, then record your own mark. Multiple-choice answers are checked automatically.'));
  const toolbar = el('div', 'practice-toolbar');
  toolbar.setAttribute('role','group'); toolbar.setAttribute('aria-label','Practice question selection');
  for (const [value, label] of [['red','Red topics'], ['all','All questions'], ['unfinished','Not marked yet']]) {
    const b = button(label, () => { practiceScope = value; renderPractice(); }); b.className = 'chip'; b.setAttribute('aria-pressed', String(practiceScope === value)); toolbar.append(b);
  }
  host.append(toolbar);
  const qs = all.filter(x => practiceScope === 'all' || (practiceScope === 'red' ? ratings[S.id][x.p.id][round] === 1 : practiceAttempts[x.key]?.score == null));
  const summary = el('p', 'practice-summary'); summary.setAttribute('aria-live','polite'); host.append(summary);
  const saveNote = el('p', 'practice-save', 'Answers and scores save in this browser and are included in backup files.'); host.append(saveNote);
  const updateSummary = () => {
    const marked = all.filter(x => practiceAttempts[x.key]?.score != null);
    const earned = marked.reduce((n,x) => n + practiceAttempts[x.key].score, 0);
    const possible = marked.reduce((n,x) => n + (x.q.marks || 1), 0);
    summary.textContent = qs.length + ' shown · ' + marked.length + '/' + all.length + ' marked this pass' + (possible ? ' · ' + earned + '/' + possible + ' marks (' + Math.round(100 * earned / possible) + '%)' : '');
  };
  updateSummary();
  if (!qs.length) {
    const box = el('div', 'empty'); box.append(el('strong', '', practiceScope === 'red' ? 'No red topics in this pass' : 'Every question is marked'), el('span', '', 'Choose All questions to practise any topic.')); host.append(box); return;
  }
  qs.forEach((item, index) => {
    const {q,p,key} = item, max = q.marks || 1;
    const state = practiceAttempts[key] || {text:'', choice:null, revealed:false, score:null, checks:[]};
    const persist = () => { practiceAttempts[key] = state; savePractice(); updateSummary(); };
    const art = el('article','qz'); const prefix = 'practice-' + index;
    const hd = el('div','qz-head'); hd.append(el('span','n','Q' + (index + 1) + ' · ' + p.id), el('span','marks',max + (max === 1 ? ' mark' : ' marks'))); art.append(hd);
    const stem = el('p','stem',q.q); stem.id = prefix + '-question'; art.append(stem);
    const inputs = [];

    const correct = match ? match[1].charCodeAt(0) - 65 : -1;
    const auto = !!q.options && correct >= 0 && correct < q.options.length;
    const ans = el('div','ans'); ans.id = prefix + '-answer';
    const feedback = el('p','practice-feedback'); feedback.setAttribute('role','status');
    const markLabel = el('label','practice-mark','Your mark ');

    for (let i = 0; i <= max; i++) { const opt = el('option','',i + ' / ' + max); opt.value = String(i); mark.append(opt); }
    markLabel.append(mark);
    const refresh = () => {
      ans.classList.toggle('hidden', !state.revealed);
      reveal.textContent = state.revealed ? 'Hide answer guide' : auto ? 'Check answer' : 'Reveal answer guide';
      reveal.setAttribute('aria-expanded', String(state.revealed));
      reveal.disabled = auto && state.choice === null;
      mark.value = state.score === null ? '' : String(state.score);
      if (auto && state.score !== null) feedback.textContent = (state.score === max ? 'Correct. ' : 'Not quite. The correct answer is ' + String.fromCharCode(65 + correct) + '. ') + state.score + '/' + max + ' marks.';
      else feedback.textContent = state.score === null ? (state.revealed ? 'Compare your response with the guide, then choose your mark.' : (state.text || state.choice !== null ? 'Answer saved as a draft.' : 'Not attempted yet.')) : 'Self-marked: ' + state.score + '/' + max + '.';
    };
    const edited = () => { state.score = null; state.revealed = false; state.checks = []; ans.querySelectorAll('input[type="checkbox"]').forEach(c => { c.checked = false; }); persist(); refresh(); };
    if (q.options) {
      const group = el('fieldset','practice-options'); group.setAttribute('aria-labelledby',stem.id);
      q.options.forEach((option, i) => {
        const label = el('label','practice-choice'); const radio = el('input'); radio.type = 'radio'; radio.name = prefix + '-choice'; radio.value = String(i); radio.checked = state.choice === i;
        radio.addEventListener('change', () => { state.choice = i; edited(); }); inputs.push(radio);
        label.append(radio, el('span','',String.fromCharCode(65 + i) + '. ' + option)); group.append(label);
      }); art.append(group);
    } else {
      const label = el('label','practice-input-label','Your answer / working'); label.htmlFor = prefix + '-input';
      input = el('textarea','practice-input'); input.id = prefix + '-input'; input.rows = 5; input.value = state.text; input.placeholder = 'Write your response and show your working here…';
      input.addEventListener('input', () => { state.text = input.value; edited(); }); art.append(label,input);
    }
    const actions = el('div','practice-actions');
    const reveal = button('', () => {
      state.revealed = !state.revealed;
      if (state.revealed && auto) state.score = state.choice === correct ? max : 0;

    }); reveal.setAttribute('aria-controls',ans.id);
    const retry = button('Try again', () => {

      Object.assign(state,{text:'',choice:null,revealed:false,score:null,checks:[]});
      if (input) input.value = ''; inputs.forEach(r => { r.checked = false; }); ans.querySelectorAll('input[type="checkbox"]').forEach(c => { c.checked = false; }); persist(); refresh(); (input || inputs[0] || reveal).focus();
    });
    actions.append(reveal,retry); art.append(actions,feedback);
    ans.append(el('p','','Answer guide'));
    const guide = el('div','practice-guide');
    (q.answer || []).forEach((line,j) => {
      const label = el('label','practice-check'); const check = el('input'); check.type = 'checkbox'; check.checked = !!state.checks[j];
      check.addEventListener('change', () => { state.checks[j] = check.checked; persist(); });

    }); ans.append(guide);
    if (!auto) {
      ans.append(el('div','practice-help','Tick the ideas you covered, then choose a mark. Guide points are not necessarily worth one mark each.'));
      mark.addEventListener('change', () => { state.score = mark.value === '' ? null : Number(mark.value); persist(); refresh(); }); ans.append(markLabel);
    }
    art.append(ans);

    refresh(); host.append(art);
  });

}
