netic field at the position of the second is perpendicular to that second current.", "Applying the right-hand rule to F = nIlB gives a force directed toward the first wire, and the same applies in reverse."]}], "card": {"key": "A11", "title": "Interaction of two fields", "front": "Which interactions attract, which repel?", "back": ["Masses only ever attract", "Like charges repel, unlike charges attract", "Like magnetic poles repel, unlike attract", "Parallel currents in the same direction attract; opposite directions repel", "A field alone does nothing — it needs a second object to act on"]}}, {"id": "3.2.14", "area": "Unit 3 AoS 2 — Fields", "title": "Force on a current-carrying conductor", "detail": "F = nIlB, where the directions of I and B are perpendicular or parallel to each other.", "questions": [{"marks": 3, "q": "A wire of length 0.25 m carrying 3.0 A sits perpendicular to a 0.40 T magnetic field. Calculate the force on it, and state what happens if the wire is rotated to lie parallel to the field.", "answer": ["F = nIlB = 1 × 3.0 × 0.25 × 0.40", "F = 0.30 N.", "Parallel to the field, there is no component of current perpendicular to B.", "The force becomes zero."]}]}, {"id": "3.2.15", "area": "Unit 3 AoS 2 — Fields", "title": "Simple DC motors", "detail": "A single coil of several loops free to rotate about an axis in a uniform magnetic field, including the role of the split ring commutator in reversing the current each half turn.", "questions": [{"marks": 3, "q": "Explain the function of the split ring commutator in a simple DC motor, and state what would happen to the coil's motion without it.", "answer": ["It reverses the direction of current through the coil every half turn.", "This keeps the torque acting in the same rotational direction as the coil passes the vertical.", "Without it, the torque would reverse after half a turn and the coil would oscillate rather than rotate continuously."]}], "card": {"key": "A12", "title": "DC motors and torque", "front": "How does a simple DC motor work, and what increases its torque?", "back": ["A current-carrying coil sits in an external magnetic field", "Force on each side: F = nIlB, in opposite directions on opposite sides", "That force pair creates a torque and the coil rotates", "The split ring commutator reverses current each half turn to keep it turning one way", "Torque increases with larger current, stronger external field, more loops", "Torque is zero when the coil plane is perpendicular to the field"]}}, {"id": "3.2.16", "area": "Unit 3 AoS 2 — Fields", "title": "Torque in a simple motor", "detail": "The qualitative effect of the current, the strength of the external magnetic field and the number of loops of wire on the torque produced.", "questions": [{"marks": 2, "q": "State two changes that would increase the torque produced by a simple DC motor, and identify the coil orientation at which the torque is zero.", "answer": ["Any two of: increase the current, increase the external magnetic field strength, increase the number of loops, increase the coil area.", "Torque is zero when the plane of the coil is perpendicular to the field.", "At that point the forces on the sides act along the same line and produce no turning effect."]}], "card": {"key": "A12", "title": "DC motors and torque", "front": "How does a simple DC motor work, and what increases its torque?", "back": ["A current-carrying coil sits in an external magnetic field", "Force on each side: F = nIlB, in opposite directions on opposite sides", "That force pair creates a torque and the coil rotates", "The split ring commutator reverses current each half turn to keep it turning one way", "Torque increases with larger current, stronger external field, more loops", "Torque is zero when the coil plane is perpendicular to the field"]}}, {"id": "3.2.17", "area": "Unit 3 AoS 2 — Fields", "title": "Particle accelerators", "detail": "Modelling acceleration of particles, limited to linear acceleration by a uniform electric field and direction change by a uniform magnetic field.", "questions": [{"marks": 3, "q": "In a particle accelerator, explain the role of the electric field and of the magnetic field, and why only one of them changes the particle's speed.", "answer": ["A uniform electric field accelerates the charged particle, doing work on it and increasing its speed.", "A magnetic field changes the direction of motion, steering the particle around the ring.", "The magnetic force is always perpendicular to the velocity, so it does no work.", "Speed is therefore changed only by the electric field."]}]}, {"id": "3.3.1", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Magnetic flux", "detail": "Φ = B⊥A when the field is perpendicular to the area, plus a qualitative description of what happens at other angles between the area and the field.", "questions": [{"marks": 3, "q": "A square coil of side 0.15 m sits with its plane perpendicular to a uniform 0.40 T magnetic field. Calculate the magnetic flux through the coil, then state the flux when the coil is rotated so its plane is parallel to the field.", "answer": ["Φ = B⊥A = 0.40 × (0.15)² = 0.40 × 0.0225", "Φ = 9.0 × 10⁻³ Wb.", "With the plane parallel to the field, no field lines pass through the coil, so Φ = 0."]}], "card": {"key": "A13", "title": "Magnetic flux and induced emf", "front": "State the flux and induction relationships, and explain the minus sign.", "back": ["Flux Φ = B⊥A when the field is perpendicular to the area, in webers", "Rotating the loop changes the perpendicular component and so changes Φ", "Induced emf ε = −N ΔΦ/Δt", "Bigger emf from a faster change, a bigger flux change, or more loops", "The minus sign is Lenz's law: the induced current opposes the change causing it", "Lenz's law is conservation of energy — otherwise you'd get free energy"]}}, {"id": "3.3.2", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Induced emf", "detail": "ε = −N ΔΦ/Δt, with reference to the rate of change of flux, the number of loops the flux passes through, and the direction of the induced emf. The minus sign is Lenz's law — be able to explain it, not just quote it.", "questions": [{"marks": 4, "q": "A 50-turn coil experiences a change in flux from 8.0 × 10⁻³ Wb to 2.0 × 10⁻³ Wb in 0.030 s. Calculate the magnitude of the average induced emf, and explain the significance of the negative sign in ε = −N ΔΦ/Δt.", "answer": ["ΔΦ = 2.0 × 10⁻³ − 8.0 × 10⁻³ = −6.0 × 10⁻³ Wb.", "ε = −50 × (−6.0 × 10⁻³) / 0.030 = 10 V.", "The negative sign represents Lenz's law: the induced emf drives a current whose magnetic field opposes the change producing it.", "This is a consequence of conservation of energy — otherwise the induced effect would reinforce the change and create energy from nothing."]}], "card": {"key": "A13", "title": "Magnetic flux and induced emf", "front": "State the flux and induction relationships, and explain the minus sign.", "back": ["Flux Φ = B⊥A when the field is perpendicular to the area, in webers", "Rotating the loop changes the perpendicular component and so changes Φ", "Induced emf ε = −N ΔΦ/Δt", "Bigger emf from a faster change, a bigger flux change, or more loops", "The minus sign is Lenz's law: the induced current opposes the change causing it", "Lenz's law is conservation of energy — otherwise you'd get free energy"]}}, {"id": "3.3.3", "area": "Unit 3 AoS 3 — Electricity generation", "title": "DC generators and alternators", "detail": "Production of DC voltage using a split ring commutator, and AC voltage using slip rings. Know the shape of the output voltage in each case.", "questions": [{"marks": 3, "q": "A single coil rotates at constant frequency in a uniform magnetic field. Describe how the output differs when the coil is connected through slip rings compared with a split ring commutator.", "answer": ["Slip rings: each end of the coil stays connected to its own ring, so the output is sinusoidal AC.", "Split ring commutator: connections swap every half turn, flipping the negative half-cycles positive.", "Peak emf is identical in both cases — only the external connection differs.", "The DC output is pulsating, not constant."]}], "card": {"key": "R2", "title": "DC generators and alternators", "front": "How do the two differ, and what does each output look like?", "back": ["Both: a coil rotating in a magnetic field induces an emf", "Alternator uses slip rings — each end of the coil stays on its own ring", "Output is sinusoidal AC, reversing every half turn", "DC generator uses a split ring commutator that swaps connections each half turn", "Output is the same sine wave with the negative humps flipped positive", "Peak emf is identical; only the connection to the external circuit differs"]}}, {"id": "3.3.4", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Photovoltaic cells", "detail": "Producing electricity from photovoltaic cells and why an inverter is needed to convert DC to AC for household use. Semiconductor action and inverter circuitry are not required.", "questions": [{"marks": 2, "q": "A household rooftop solar installation includes photovoltaic cells and an inverter. State the function of each.", "answer": ["The photovoltaic cells convert light energy directly into DC electricity.", "The inverter converts that DC into mains-frequency AC for household appliances and the grid.", "Semiconductor action and inverter circuitry are not required knowledge."]}], "card": {"key": "R3", "title": "Photovoltaic cells", "front": "How is household electricity produced from solar panels?", "back": ["A photovoltaic cell converts light directly into DC electricity", "Semiconductor action is NOT required — don't lose time on it", "Household appliances and the grid run on AC", "An inverter converts the DC output into mains-frequency AC", "Inverter circuitry is also not required"]}}, {"id": "3.3.5", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Sinusoidal AC from a rotating loop", "detail": "Comparing AC voltages produced by uniform rotation of a loop in a constant magnetic field: frequency, period, amplitude, peak-to-peak voltage and peak-to-peak current.", "questions": [{"marks": 3, "q": "A coil rotating uniformly in a constant magnetic field produces a sinusoidal emf with a peak value of 12 V and a period of 20 ms. State the frequency, the peak-to-peak voltage, and the coil orientation at which the emf is maximum.", "answer": ["f = 1/T = 1/0.020 = 50 Hz.", "Peak-to-peak = 2 × 12 = 24 V.", "emf is maximum when the plane of the coil is parallel to the field.", "At that orientation the flux is zero but changing at its fastest rate."]}], "card": {"key": "A14", "title": "Sinusoidal AC from a rotating loop", "front": "Describe the output of a rotating loop and define its measures.", "back": ["Uniform rotation in a constant field gives a sine wave emf", "Period T is the time for one full rotation; frequency f = 1/T", "Amplitude = peak voltage; peak-to-peak = twice that", "emf is maximum when the coil plane is parallel to the field (flux changing fastest)", "emf is zero when the coil plane is perpendicular (flux at a maximum)"]}}, {"id": "3.3.6", "area": "Unit 3 AoS 3 — Electricity generation", "title": "RMS values", "detail": "The root-mean-square voltage as the constant DC voltage that would deliver the same power in a resistive component.", "questions": [{"marks": 3, "q": "Explain what is meant by the rms voltage of an AC supply, and why it is the value quoted for mains electricity.", "answer": ["The rms voltage is the constant DC voltage that would deliver the same power to a resistive component.", "It is the value that determines heating and power, not the instantaneous or peak value.", "Quoting the peak would overstate the power delivered.", "Australian mains is quoted as 230 V rms."]}]}, {"id": "3.3.7", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Converting between rms, peak and peak-to-peak", "detail": "Converting confidently in both directions for voltage and current, and picking the right one for a power calculation.", "questions": [{"marks": 3, "q": "An AC supply has a peak voltage of 340 V. Calculate the rms voltage and the peak-to-peak voltage.", "answer": ["Vrms = Vpeak/√2 = 340/1.414 = 240 V.", "Peak-to-peak = 2 × Vpeak = 680 V.", "Check which value a question gives you — mixing rms and peak is the most common error here."]}]}, {"id": "3.3.8", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Transformer action", "detail": "N₁/N₂ = V₁/V₂ = I₂/I₁ for an ideal transformer, explained through electromagnetic induction. Also why a transformer only works on AC.", "questions": [{"marks": 3, "q": "An ideal transformer has 200 turns on the primary and 50 on the secondary. The primary is supplied with 240 V AC drawing 2.0 A. Calculate the secondary voltage and current, and explain why the transformer would not operate on DC.", "answer": ["V₂ = V₁ × N₂/N₁ = 240 × 50/200 = 60 V.", "I₂ = I₁ × N₁/N₂ = 2.0 × 200/50 = 8.0 A (power is conserved: 480 W both sides).", "A transformer needs a CHANGING flux in the core to induce an emf in the secondary.", "DC produces a constant current and so a constant flux — no change, no induced emf."]}], "card": {"key": "A15", "title": "Transformer action", "front": "State the transformer relationship and explain why it needs AC.", "back": ["N₁/N₂ = V₁/V₂ = I₂/I₁ for an ideal transformer", "Power in equals power out when ideal, so raising V lowers I", "Primary coil's changing current makes a changing flux in the core", "That changing flux induces an emf in the secondary", "DC gives constant flux, so no change, so no induced emf", "Step-up has more turns on the secondary"]}}, {"id": "3.3.9", "area": "Unit 3 AoS 3 — Electricity generation", "title": "Transmission losses", "detail": "Analysing the supply of power with losses across transmission lines, and why stepping voltage up for transmission reduces the power lost.", "questions": [{"marks": 4, "q": "A generator supplies 30 kW to transmission lines of total resistance 2.0 Ω. Compare the power lost when transmitted at 1000 V with the loss at 10 000 V, and explain the result.", "answer": ["At 1000 V: I = P/V = 30 000/1000 = 30 A. Ploss = I²R = 900 × 2.0 = 1800 W.", "At 10 000 V: I = 3.0 A. Ploss = 9.0 × 2.0 = 18 W.", "Power loss depends on I²R, so it depends on the CURRENT, not the supply voltage.", "Raising the transmission voltage by 10 reduces the current by 10 and the loss by 100."]}], "card": {"key": "A16", "title": "Transmission losses", "front": "Why is power transmitted at high voltage?", "back": ["Power lost in the lines is Ploss = I²R — it depends on CURRENT, not supply voltage", "Transformers step voltage up so the same power travels at lower current", "Halving the current quarters the loss", "Voltage drop across the lines is Vdrop = IR", "Voltage delivered = supply voltage − voltage drop", "Stepped back down near the consumer for safety"]}}, {"id": "4.1.1", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Light as a transverse electromagnetic wave", "detail": "Produced by the acceleration of charges, which creates changing electric fields and associated changing magnetic fields.", "questions": [{"marks": 3, "q": "Describe how an electromagnetic wave is produced and explain why it is classified as transverse.", "answer": ["An accelerating charge produces a changing electric field.", "That changing electric field generates an associated changing magnetic field, and the process self-propagates.", "The electric and magnetic fields oscillate perpendicular to each other and to the direction of travel.", "Because the oscillation is perpendicular to propagation, the wave is transverse."]}]}, {"id": "4.1.2", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "All electromagnetic waves travel at c", "detail": "The same speed in a vacuum regardless of frequency or wavelength.", "questions": [{"marks": 2, "q": "A radio wave and a gamma ray both travel through a vacuum. Compare their speeds and their wavelengths.", "answer": ["Both travel at exactly c = 3.0 × 10⁸ m s⁻¹ in a vacuum, regardless of frequency.", "The radio wave has a far longer wavelength and lower frequency.", "Since c = fλ is fixed, higher frequency necessarily means shorter wavelength."]}]}, {"id": "4.1.3", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Standing waves", "detail": "Formation by superposition of a travelling wave and its reflection. Analysis is limited to standing waves with nodes at both ends — nodes, antinodes, and wavelength in terms of length.", "questions": [{"marks": 4, "q": "A string 1.2 m long is fixed at both ends and vibrates in its third harmonic. Calculate the wavelength and state the number of nodes and antinodes.", "answer": ["For the nth harmonic with nodes at both ends, L = nλ/2.", "1.2 = 3λ/2, so λ = 0.80 m.", "The third harmonic has 4 nodes (including both ends) and 3 antinodes.", "Standing waves form from superposition of a travelling wave and its reflection."]}]}, {"id": "4.1.4", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Diffraction", "detail": "The directional spread of waves depends on the λ/w ratio — gap width or obstacle size relative to wavelength. Applied to the limits of imaging using electromagnetic waves.", "questions": [{"marks": 2, "q": "Explain why sound diffracts noticeably around a doorway but visible light does not.", "answer": ["The amount of diffraction depends on the ratio λ/w — wavelength compared with the gap width.", "Audible sound has wavelengths comparable to a doorway (around a metre), so λ/w is large and spreading is significant.", "Visible light has wavelengths around 5 × 10⁻⁷ m, so λ/w is tiny and the spreading is negligible."]}], "card": {"key": "A17", "title": "Diffraction", "front": "What determines how much a wave spreads?", "back": ["Spreading depends on the ratio λ/w — wavelength to gap or obstacle size", "Larger λ/w means more diffraction", "Significant spreading when the gap is comparable to the wavelength", "Long wavelengths diffract around obstacles; short ones cast sharper shadows", "Sets the resolution limit when imaging with electromagnetic waves"]}}, {"id": "4.1.5", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Young's double slit experiment", "detail": "Evidence for the wave-like nature of light. Constructive interference at path differences of nλ and destructive at (n − ½)λ, for coherent waves.", "questions": [{"marks": 3, "q": "In a double slit experiment, light of wavelength 600 nm produces a pattern on a distant screen. State the path difference at the second bright fringe from the centre and at the first dark fringe, and explain why the pattern is evidence for a wave model.", "answer": ["Second bright fringe: path difference = 2λ = 1.2 × 10⁻⁶ m.", "First dark fringe: path difference = ½λ = 3.0 × 10⁻⁷ m.", "Dark fringes require destructive interference — two contributions cancelling.", "A particle model cannot explain how opening a second slit produces regions of darkness."]}], "card": {"key": "A18", "title": "Young's double slit and fringe spacing", "front": "Give the path difference conditions and the spacing relationship.", "back": ["Two coherent sources produce an interference pattern — evidence for waves", "Constructive (bright): path difference = nλ", "Destructive (dark): path difference = (n − ½)λ", "Fringe spacing Δx = λL/d, valid when L is much greater than d", "Longer λ or bigger L widens the fringes; wider slit separation narrows them", "A particle model cannot produce dark fringes from two open slits"]}}, {"id": "4.1.6", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Interference pattern spacing", "detail": "Δx = λL/d when L is much greater than d, and the effect of changing wavelength, screen distance or slit separation on the fringe pattern.", "questions": [{"marks": 3, "q": "Two slits 0.25 mm apart are illuminated with 640 nm light. The screen is 2.0 m away. Calculate the fringe spacing, and state what happens to the spacing if the slit separation is halved.", "answer": ["Δx = λL/d = (640 × 10⁻⁹ × 2.0) / (0.25 × 10⁻³)", "Δx = 1.28 × 10⁻⁶ / 2.5 × 10⁻⁴ = 5.1 × 10⁻³ m, about 5.1 mm.", "Halving d doubles Δx, so the fringes spread to about 10.2 mm apart.", "Δx is inversely proportional to the slit separation."]}], "card": {"key": "A18", "title": "Young's double slit and fringe spacing", "front": "Give the path difference conditions and the spacing relationship.", "back": ["Two coherent sources produce an interference pattern — evidence for waves", "Constructive (bright): path difference = nλ", "Destructive (dark): path difference = (n − ½)λ", "Fringe spacing Δx = λL/d, valid when L is much greater than d", "Longer λ or bigger L widens the fringes; wider slit separation narrows them", "A particle model cannot produce dark fringes from two open slits"]}}, {"id": "4.1.7", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Quantised photon energy", "detail": "E = hf = hc/λ, working in both joules and electron-volts and converting between them.", "questions": [{"marks": 3, "q": "Calculate the energy of a photon of wavelength 450 nm in both joules and electron-volts. Take hc = 1.99 × 10⁻²⁵ J m and 1 eV = 1.6 × 10⁻¹⁹ J.", "answer": ["E = hc/λ = 1.99 × 10⁻²⁵ / 450 × 10⁻⁹", "E = 4.42 × 10⁻¹⁹ J.", "In eV: 4.42 × 10⁻¹⁹ / 1.6 × 10⁻¹⁹ = 2.8 eV.", "Check which unit the question wants — energy level diagrams are usually in eV."]}]}, {"id": "4.1.8", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "The photoelectric effect", "detail": "Evidence for the particle-like nature of light. Reading graphs of photocurrent vs electrode potential and of kinetic energy vs frequency; Ek max = hf − φ; work function and threshold frequency; and the effect of the intensity of the incident light on the number of photoelectrons.", "questions": [{"marks": 4, "q": "Light of frequency 8.0 × 10¹⁴ Hz falls on a metal of work function 2.0 eV. Calculate the maximum kinetic energy of the emitted photoelectrons in eV, and state what happens to this value if the light intensity is doubled. Take h = 4.14 × 10⁻¹⁵ eV s.", "answer": ["E = hf = 4.14 × 10⁻¹⁵ × 8.0 × 10¹⁴ = 3.31 eV.", "Ek(max) = hf − φ = 3.31 − 2.0 = 1.3 eV.", "Doubling the intensity does NOT change Ek(max).", "It doubles the number of photons per second, so more photoelectrons and a larger photocurrent — but each still arrives with the same maximum energy."]}, {"marks": 3, "q": "On a graph of maximum kinetic energy against frequency for the photoelectric effect, state the physical meaning of the gradient, the horizontal intercept and the vertical intercept.", "answer": ["Gradient = Planck's constant h.", "Horizontal intercept = the threshold frequency f₀, below which no emission occurs.", "Vertical intercept = −φ, the negative of the work function.", "The gradient is the same for every metal; only the intercepts shift."]}], "card": {"key": "A19", "title": "The photoelectric effect", "front": "What are the four results, and which defeat the wave model?", "back": ["Ek(max) = hf − φ, where φ is the work function", "Below the threshold frequency f₀ = φ/h, NO electrons at any intensity", "Ek(max) depends on frequency only, never on intensity", "Intensity changes the NUMBER of photoelectrons, so the photocurrent", "Emission is immediate — no time delay to accumulate energy", "On an Ek vs f graph: gradient = h, x-intercept = f₀, y-intercept = −φ"]}}, {"id": "4.1.9", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Limitations of the wave model of light", "detail": "Which specific photoelectric results the wave model fails to explain — the threshold frequency, the absence of a time delay, and why intensity changes current but not maximum kinetic energy.", "questions": [{"marks": 4, "q": "State two experimental results of the photoelectric effect that the wave model of light cannot explain, and explain why the wave model fails in each case.", "answer": ["The threshold frequency: below f₀ no electrons are emitted at any intensity.", "A wave model predicts that sufficient intensity would eventually supply enough energy regardless of frequency.", "The absence of a time delay: emission is immediate even at very low intensity.", "A wave model predicts a measurable delay while energy accumulates in the metal."]}]}, {"id": "4.1.10", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Electron diffraction", "detail": "Interpreting electron diffraction patterns as evidence for the wave-like nature of matter.", "questions": [{"marks": 3, "q": "Calculate the de Broglie wavelength of an electron travelling at 2.0 × 10⁶ m s⁻¹, and explain why a cricket ball does not show observable diffraction. Take h = 6.63 × 10⁻³⁴ J s, mₑ = 9.1 × 10⁻³¹ kg.", "answer": ["λ = h/mv = 6.63 × 10⁻³⁴ / (9.1 × 10⁻³¹ × 2.0 × 10⁶)", "λ = 6.63 × 10⁻³⁴ / 1.82 × 10⁻²⁴ = 3.6 × 10⁻¹⁰ m.", "This is comparable to atomic spacing in a crystal, so diffraction is observable.", "A cricket ball has a far larger momentum, giving λ around 10⁻³⁴ m — vastly smaller than any gap, so λ/w is effectively zero."]}], "card": {"key": "A20", "title": "Electron diffraction", "front": "What does electron diffraction show, and what is the calculation?", "back": ["Electrons fired at a crystal produce a diffraction pattern", "Diffraction is a wave behaviour, so matter has wave properties", "de Broglie wavelength λ = h/p = h/mv", "Everyday objects have λ far too small to show diffraction", "Matching a photon pattern means matching the wavelength"]}}, {"id": "4.1.11", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Photon vs electron diffraction patterns", "detail": "Distinguishing the patterns produced by photons from those produced by electrons.", "questions": [{"marks": 3, "q": "An electron beam and a beam of X-ray photons are directed at the same crystal, producing indistinguishable diffraction patterns. Explain what this tells you about the two beams.", "answer": ["The diffraction pattern depends only on the wavelength relative to the crystal spacing.", "Identical patterns therefore mean the two beams have the same wavelength.", "For the electrons this is the de Broglie wavelength, λ = h/p.", "It does NOT mean they have the same energy or momentum value in the same sense — only matching λ."]}], "card": {"key": "R4", "title": "Photon vs electron diffraction patterns", "front": "Why do photon and electron diffraction patterns look the same?", "back": ["Both produce identical concentric ring patterns through a crystal or aperture", "The pattern depends only on the wavelength relative to the gap or spacing", "For an electron the wavelength is the de Broglie wavelength λ = h/p", "Matching patterns means matching wavelengths, not matching energies", "This is the evidence that matter has wave-like properties", "Given a pattern alone you cannot tell which particle made it"]}}, {"id": "4.1.12", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "de Broglie wavelength", "detail": "λ = h/p for matter, and what it implies about why wave behaviour isn't observed for everyday objects.", "questions": [{"marks": 3, "q": "Calculate the de Broglie wavelength of a 0.15 kg ball travelling at 30 m s⁻¹, and comment on why its wave nature is not observed. Take h = 6.63 × 10⁻³⁴ J s.", "answer": ["λ = h/mv = 6.63 × 10⁻³⁴ / (0.15 × 30)", "λ = 6.63 × 10⁻³⁴ / 4.5 = 1.5 × 10⁻³⁴ m.", "This is vastly smaller than any aperture or obstacle the ball could encounter.", "λ/w is effectively zero, so no diffraction or interference is observable."]}]}, {"id": "4.1.13", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "The idea of quantisation", "detail": "Its importance in developing knowledge about light and in explaining the nature of atoms.", "questions": [{"marks": 3, "q": "Explain what is meant by quantisation, and use it to account for the discrete lines observed in an atomic emission spectrum.", "answer": ["Quantisation means a quantity is restricted to discrete values rather than a continuous range.", "Electrons in an atom may only occupy allowed energy states.", "A transition emits a photon of energy exactly equal to the difference between two states.", "Only certain differences exist, so only certain photon energies appear — discrete lines, not a continuous band."]}], "card": {"key": "R5", "title": "The idea of quantisation", "front": "What does it mean to say something is quantised, and why does it matter?", "back": ["Quantised = restricted to discrete values, not a continuous range", "Photon energy comes in packets E = hf, not any amount you like", "Electrons in an atom sit only in allowed energy states", "A transition emits or absorbs exactly the energy difference between two states", "That is why spectra are discrete lines rather than a continuous band", "Quantisation is what classical wave physics could not explain"]}}, {"id": "4.1.14", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Momentum of photons and matter", "detail": "Comparing the momentum of photons and of matter of the same wavelength using p = h/λ.", "questions": [{"marks": 3, "q": "A photon and an electron have the same wavelength of 5.0 × 10⁻¹¹ m. Compare their momentum and explain your reasoning.", "answer": ["For both, p = h/λ — the relationship applies to photons and to matter.", "p = 6.63 × 10⁻³⁴ / 5.0 × 10⁻¹¹ = 1.3 × 10⁻²³ kg m s⁻¹.", "Their momentum is identical, because momentum depends only on wavelength.", "Their energies differ: the photon uses E = hc/λ while the electron uses its kinetic energy."]}]}, {"id": "4.1.15", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Absorption and emission line spectra", "detail": "How atomic absorption and emission line spectra are produced, including those from metal vapour lamps.", "questions": [{"marks": 3, "q": "Explain how an absorption spectrum is produced and why the dark lines appear at the same wavelengths as the bright lines in that element's emission spectrum.", "answer": ["White light passes through a cool gas; photons matching an allowed energy gap are absorbed, exciting electrons.", "Those wavelengths are removed from the transmitted light, leaving dark lines.", "The same energy gaps govern both absorption and emission for a given element.", "So the absorbed and emitted photon energies, and therefore wavelengths, are identical."]}], "card": {"key": "A21", "title": "Spectra and interpreting them", "front": "How are line spectra produced and how do you read one?", "back": ["Emission — an excited electron drops down, emitting a photon of exactly ΔE", "Absorption — a photon of exactly ΔE is absorbed, leaving a dark line", "Same element gives the same line positions in both", "Only discrete lines appear because energy states are quantised", "Photon energy from the line: E = hf = hc/λ", "Work in eV where the energy level diagram uses eV"]}}, {"id": "4.1.16", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Interpreting spectra", "detail": "Calculating the energy of an absorbed or emitted photon from spectral data using E = hf = hc/λ.", "questions": [{"marks": 3, "q": "An atom emits a photon when an electron falls from an energy state of −3.4 eV to one of −13.6 eV. Calculate the photon's energy in eV and its wavelength. Take hc = 1.24 × 10³ eV nm.", "answer": ["ΔE = −3.4 − (−13.6) = 10.2 eV.", "λ = hc/E = 1.24 × 10³ / 10.2", "λ = 122 nm.", "This lies in the ultraviolet."]}], "card": {"key": "A21", "title": "Spectra and interpreting them", "front": "How are line spectra produced and how do you read one?", "back": ["Emission — an excited electron drops down, emitting a photon of exactly ΔE", "Absorption — a photon of exactly ΔE is absorbed, leaving a dark line", "Same element gives the same line positions in both", "Only discrete lines appear because energy states are quantised", "Photon energy from the line: E = hf = hc/λ", "Work in eV where the energy level diagram uses eV"]}}, {"id": "4.1.17", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Photon emission and electron energy states", "detail": "Emission or absorption of a photon as a change in the electron energy state of an atom, with the difference between the states equal to the photon energy.", "questions": [{"marks": 2, "q": "An atom has energy levels at −10.0 eV, −6.0 eV and −2.5 eV. A photon of 3.0 eV is directed at the atom in its ground state. Explain whether it will be absorbed.", "answer": ["The available transitions from the ground state require 4.0 eV or 7.5 eV.", "A 3.0 eV photon matches no energy gap.", "It is not absorbed and passes through — absorption is all-or-nothing, not partial."]}], "card": {"key": "A22", "title": "Photon emission and electron energy states", "front": "Link a transition on an energy level diagram to a photon.", "back": ["Electrons occupy discrete energy levels, most negative at the ground state", "A transition between two levels emits or absorbs exactly the difference", "Ephoton = E(higher) − E(lower), so λ = hc/ΔE", "Bigger energy gap means higher frequency and shorter wavelength", "An atom can only absorb a photon that exactly matches a gap"]}}, {"id": "4.1.18", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "The single photon or electron double slit experiment", "detail": "Interpreting it as evidence for the dual nature of both light and matter.", "questions": [{"marks": 4, "q": "In a double slit experiment, photons are fired one at a time over several hours. Describe what is observed and explain why the result is significant.", "answer": ["Each photon arrives as a single localised dot on the detector — particle-like behaviour.", "Over time the accumulated dots build up the interference pattern — wave-like behaviour.", "Each individual photon must therefore interfere with itself, passing through both slits.", "This is evidence that light is neither purely wave nor purely particle, but exhibits both natures."]}]}, {"id": "4.1.19", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Limitations of classical mechanics", "detail": "Where classical mechanics breaks down for motion approaching the speed of light.", "questions": [{"marks": 3, "q": "Explain why classical mechanics fails for objects moving close to the speed of light, giving one specific prediction it gets wrong.", "answer": ["Classical mechanics assumes time and length are absolute and velocities add simply.", "It predicts that continued acceleration would carry an object past the speed of light.", "Relativity shows kinetic energy is (γ − 1)mc², which diverges as v approaches c.", "Infinite energy would be required, so a massive object can never reach c."]}]}, {"id": "4.1.20", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Einstein's two postulates", "detail": "The laws of physics are the same in all inertial (non-accelerated) frames of reference, and the speed of light is constant for all observers regardless of the motion of observer or source.", "questions": [{"marks": 2, "q": "State Einstein's two postulates of special relativity.", "answer": ["The laws of physics are the same in all inertial (non-accelerating) frames of reference.", "The speed of light in a vacuum is the same for all observers, regardless of the motion of the source or observer.", "The second postulate is the one that forces time dilation and length contraction."]}]}, {"id": "4.1.21", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "The Michelson–Morley experiment", "detail": "Interpreting its null result as evidence supporting the special theory of relativity.", "questions": [{"marks": 3, "q": "Describe what the Michelson–Morley experiment set out to detect, what result it obtained, and how that result supports special relativity.", "answer": ["It aimed to detect Earth's motion through the hypothetical luminiferous aether.", "It compared light travelling along two perpendicular arms, expecting a shift in the interference fringes.", "No shift was observed — a null result.", "This is consistent with Einstein's second postulate: the speed of light is the same for all observers regardless of motion."]}], "card": {"key": "A23", "title": "The Michelson–Morley experiment", "front": "What was it looking for, what did it find, and why does it matter?", "back": ["It was designed to detect Earth's motion through the luminiferous aether", "It compared light travelling along two perpendicular arms", "Expected a shift in the interference fringes; found none — a null result", "No evidence for an aether, and no dependence of light speed on motion", "Supports Einstein's second postulate: c is the same for all observers"]}}, {"id": "4.1.22", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Special relativity vs classical physics", "detail": "Comparing Einstein's theory with the principles of classical physics, including what each predicts about adding velocities.", "questions": [{"marks": 3, "q": "A spacecraft travelling at 0.7c fires a projectile forward at 0.5c relative to itself. State what classical physics predicts for the projectile's speed relative to Earth, and what relativity says.", "answer": ["Classical physics predicts simple addition: 0.7c + 0.5c = 1.2c.", "Relativity forbids this — no object can exceed c in any frame.", "The relativistic result is less than c, approaching but never reaching it.", "Velocities do not add linearly at relativistic speeds."]}]}, {"id": "4.1.23", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Proper time", "detail": "t₀ as the time interval between two events measured in the reference frame where the two events occur at the same point in space. Identifying which observer measures it is usually the hard part.", "questions": [{"marks": 4, "q": "A muon created in the upper atmosphere travels toward Earth at 0.98c. Its half-life measured at rest is 1.5 μs. Identify which observer measures proper time, and calculate the half-life as measured from Earth.", "answer": ["Proper time is measured in the muon's frame, where creation and decay occur at the same point in space.", "γ = 1/√(1 − 0.98²) = 1/√(1 − 0.9604) = 1/√0.0396 = 5.03.", "t = γt₀ = 5.03 × 1.5 = 7.5 μs as measured from Earth.", "This dilation is why muons reach the surface in far greater numbers than classical physics predicts."]}], "card": {"key": "A24", "title": "Proper time and proper length", "front": "Define both and identify which observer measures them.", "back": ["Proper time t₀ — measured where the two events happen at the SAME PLACE", "That's the observer travelling with the clock", "Proper length L₀ — measured in the frame where the object is AT REST", "Everyone else measures a longer time and a shorter length", "t = γt₀ and L = L₀/γ, with γ = 1/√(1 − v²/c²)", "Time dilates, length contracts — identify the frame first, always"]}}, {"id": "4.1.24", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Proper length", "detail": "L₀ as the length measured in the reference frame in which the object is at rest.", "questions": [{"marks": 3, "q": "A spacecraft of rest length 80 m travels past an observer at 0.60c. Calculate the length measured by that observer, and state who measures the proper length.", "answer": ["γ = 1/√(1 − 0.36) = 1/0.80 = 1.25.", "L = L₀/γ = 80/1.25 = 64 m.", "Proper length is measured in the frame where the object is at rest — an observer aboard the spacecraft.", "Everyone else measures it shorter; length contracts while time dilates."]}], "card": {"key": "A24", "title": "Proper time and proper length", "front": "Define both and identify which observer measures them.", "back": ["Proper time t₀ — measured where the two events happen at the SAME PLACE", "That's the observer travelling with the clock", "Proper length L₀ — measured in the frame where the object is AT REST", "Everyone else measures a longer time and a shorter length", "t = γt₀ and L = L₀/γ, with γ = 1/√(1 − v²/c²)", "Time dilates, length contracts — identify the frame first, always"]}}, {"id": "4.1.25", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Time dilation and length contraction", "detail": "t = t₀γ and L = L₀/γ, with γ = 1/√(1 − v²/c²). Knowing which frame measures which quantity, and that time dilates while length contracts.", "questions": [{"marks": 4, "q": "A spacecraft travels at 0.80c relative to Earth. Calculate γ, then find the time an Earth observer measures for a process taking 6.0 s aboard the spacecraft.", "answer": ["γ = 1/√(1 − 0.80²) = 1/√(1 − 0.64) = 1/√0.36 = 1/0.60 = 1.67.", "The 6.0 s is proper time — the events occur at the same place aboard the craft.", "t = γt₀ = 1.67 × 6.0 = 10 s as measured from Earth.", "The Earth observer measures a longer time: the moving clock runs slow."]}]}, {"id": "4.1.26", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Examples of special relativity", "detail": "Muons reaching Earth's surface despite their half-life, particle accelerator lengths accounting for relativistic effects, and corrections to GPS satellite time signals due to orbital velocity.", "questions": [{"marks": 3, "q": "Explain why GPS satellites require relativistic corrections to their time signals.", "answer": ["The satellites move at high orbital speed relative to receivers on the ground.", "Time dilation means their onboard clocks run slow relative to Earth clocks by a predictable amount.", "GPS position is calculated from signal travel times, so a clock error becomes a position error.", "Uncorrected, the error would accumulate to kilometres within a day."]}]}, {"id": "4.1.27", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Mass–energy", "detail": "Etot = Ek + E0 = γmc², rest energy E0 = mc², and relativistic kinetic energy Ek = (γ − 1)mc².", "questions": [{"marks": 3, "q": "An electron is accelerated to 0.80c. Calculate its total energy as a multiple of its rest energy, and state its kinetic energy in the same terms.", "answer": ["γ = 1/√(1 − 0.64) = 1/0.60 = 1.67.", "Etot = γmc² = 1.67 × E₀, so about 1.7 times the rest energy.", "Ek = (γ − 1)mc² = 0.67 × E₀.", "Note Ek is NOT ½mv² at this speed — the classical formula fails as v approaches c."]}], "card": {"key": "A25", "title": "Mass–energy", "front": "Give the relativistic energy relationships.", "back": ["Rest energy E₀ = mc²", "Total energy Etot = γmc²", "Kinetic energy Ek = (γ − 1)mc², NOT ½mv² at high speed", "Etot = Ek + E₀", "As v approaches c, γ diverges and energy grows without limit", "Which is why a massive object can never reach c"]}}, {"id": "4.1.28", "area": "Unit 4 AoS 1 — Light, matter and relativity", "title": "Mass converted to energy in the Sun", "detail": "How nuclear fusion converts matter to energy, decreasing the Sun's mass and emitting electromagnetic radiation.", "questions": [{"marks": 3, "q": "Explain how the Sun produces energy and what happens to its mass, referring to E = mc².", "answer": ["Nuclear fusion joins hydrogen nuclei into helium in the core.", "The mass of the products is slightly less than the mass of the reactants.", "That mass difference is converted to energy according to E = mc², radiated as electromagnetic radiation.", "The Sun's mass therefore decreases continuously, by roughly four million tonnes per second."]}]}, {"id": "4.2.1", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Physics concepts behind your investigation", "detail": "The concepts specific to your own investigation and why they matter — definitions of key terms, and the representations and conventions used to express them.", "questions": [{"marks": 3, "q": "Explain why a scientific poster must define the key physics concepts behind the investigation, and give an example for an investigation into projectile range.", "answer": ["The reader must be able to follow the reasoning without prior knowledge of your particular setup.", "Definitions establish the meaning of the terms used consistently through the poster.", "Example: define range, launch angle, and the independence of horizontal and vertical components.", "The concepts also justify why the chosen variables are the relevant ones."]}]}, {"id": "4.2.2", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Designing the investigation", "detail": "A testable question and hypothesis, and clear identification of the independent, dependent and controlled variables.", "questions": [{"marks": 3, "q": "A student investigates how the period of a pendulum depends on its length. Identify the independent, dependent and one controlled variable, and state one way to reduce random error in the timing.", "answer": ["Independent variable: length of the pendulum.", "Dependent variable: period of oscillation.", "Controlled: mass of the bob, release angle, or location (so g is constant).", "Time 10 oscillations and divide by 10, repeated several times, to reduce random timing error."]}], "card": {"key": "A26", "title": "Designing the investigation", "front": "What must a good investigation design specify?", "back": ["A question that can actually be answered by measurement", "Independent, dependent and controlled variables identified explicitly", "Methodology chosen and justified against the question", "Equipment, procedure, the range of IV values and how many measurements", "Repeat measurements to handle random error", "Justify each choice — that's where the marks are"]}}, {"id": "4.2.3", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Methodology and method", "detail": "Choosing the appropriate methodology, then the equipment, procedure, range of values and number of measurements — and being able to justify each choice.", "questions": [{"marks": 2, "q": "Explain why a student investigating the relationship between two variables should take measurements across a wide range of the independent variable rather than a narrow one.", "answer": ["A wide range makes any trend clearer relative to the scatter in the data.", "It allows the form of the relationship to be identified — linear, inverse or square — rather than assumed.", "A narrow range can make a curve look linear and support a wrong conclusion."]}], "card": {"key": "A26", "title": "Designing the investigation", "front": "What must a good investigation design specify?", "back": ["A question that can actually be answered by measurement", "Independent, dependent and controlled variables identified explicitly", "Methodology chosen and justified against the question", "Equipment, procedure, the range of IV values and how many measurements", "Repeat measurements to handle random error", "Justify each choice — that's where the marks are"]}}, {"id": "4.2.4", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Safety and ethical guidelines", "detail": "Risk assessment informed by safety data sheets, relevant occupational health and safety guidance, and ethical conduct in carrying out and reporting the investigation.", "questions": [{"marks": 3, "q": "A student plans an investigation using a high-voltage power supply and a laser. Identify two specific safety considerations and one ethical consideration.", "answer": ["Safety: never look directly into the laser beam or its reflection; use the lowest power that works.", "Safety: isolate the high-voltage supply before altering the circuit, and use insulated leads.", "Ethical: report all data honestly, including results that do not support the hypothesis.", "A written risk assessment should be completed before practical work begins."]}]}, {"id": "4.2.5", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Generating and recording primary data", "detail": "Systematic recording in the logbook, replicate measurements, appropriate units and significant figures, and tables that follow the conventions.", "questions": [{"marks": 3, "q": "Describe three features of a well-constructed results table for a physics investigation.", "answer": ["Column headings state the quantity and its unit, e.g. 'Time (s)'.", "Values recorded to a consistent and appropriate number of significant figures, reflecting the instrument's resolution.", "Repeat measurements shown individually, with a mean calculated in a separate column.", "The independent variable is usually the first column, ordered systematically."]}]}, {"id": "4.2.6", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Analysing the data", "detail": "Processing data with the right relationships, graphing and linearising, interpreting the gradient, and identifying and accounting for outliers.", "questions": [{"marks": 4, "q": "A student obtains a curved graph of period against length for a pendulum. Explain how they could linearise it and what the gradient of the linearised graph would represent.", "answer": ["The relationship is T = 2π√(L/g), so T is proportional to √L.", "Plot T against √L, or plot T² against L.", "T² against L gives a straight line through the origin with gradient 4π²/g.", "g can then be found as 4π² divided by the gradient."]}]}, {"id": "4.2.7", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Evaluating the method", "detail": "Accuracy, precision, repeatability, reproducibility and validity of your measurements; identifying sources of random and systematic error and suggesting specific improvements.", "questions": [{"marks": 4, "q": "A student's experimental value for g is consistently 8.9 m s⁻² across all trials. Identify the likely type of error, suggest a plausible cause, and state one improvement.", "answer": ["A systematic error — every trial is low by a similar amount, so the results are precise but inaccurate.", "Plausible cause: air resistance, a consistently late stopwatch start, or a mis-measured drop height.", "Improvement: use light gates instead of a manual stopwatch to remove reaction time.", "Repeating more trials would not help, since averaging does not remove systematic error."]}]}, {"id": "4.2.8", "area": "Unit 4 AoS 2 — Practical investigation", "title": "Conclusions and limitations", "detail": "Judging how far the evidence supports the hypothesis, stating the limitations of the conclusion, and suggesting further investigation — with no new information introduced in the conclusion.", "questions": [{"marks": 3, "q": "Distinguish between a limitation of an investigation and an error in it, and give one example of each for an experiment measuring the acceleration due to gravity by timing a falling object.", "answer": ["A limitation is a constraint on what the investigation can conclude; an error is a fault in the measurement.", "Limitation: only one object and one drop height were tested, so the conclusion cannot be generalised.", "Error: reaction time in starting and stopping the stopwatch — a random error affecting precision.", "Air resistance producing a consistently low value would be a systematic error."]}], "card": {"key": "A27", "title": "Conclusions and limitations", "front": "How do you conclude a practical investigation?", "back": ["Answer the question directly, referring to your own data", "State how far the evidence supports the hypothesis", "Name the limitations: range, sample size, uncontrolled variables, assumptions", "Distinguish limitations from errors you could have avoided", "Suggest a specific improvement or extension, not just 'be more careful'"]}}, {"id": "4.2.9", "area": "Unit 4 AoS 2 — Practical investigation", "title": "The scientific poster", "detail": "The required sections, the 600-word limit excluding tables, graphs, captions and references, and the one-sentence communication statement at the centre occupying 20–25% of the poster.", "questions": [{"marks": 2, "q": "State the word limit for a VCE Physics scientific poster, what that limit excludes, and the required proportion of the poster occupied by the communication statement.", "answer": ["600 words.", "Excludes tables, graphs, captions, acknowledgements and references.", "The one-sentence communication statement sits centrally and occupies 20–25% of the poster area."]}], "card": {"key": "A28", "title": "The scientific poster", "front": "What are the format requirements?", "back": ["600 word limit, excluding tables, graphs, captions and references", "A one-sentence communication statement reporting the key finding", "It sits in the centre and occupies 20–25% of the poster", "Sections: title, introduction, methodology and method, results, discussion, conclusion", "Acknowledgements and references included", "Results shown as tables and graphs, not prose"]}}], "source": "VCE Physics Study Design 2024–2027.", "theme": {"paper": "#e4e9ee", "lift": "#eff3f7", "ink": "#17222c", "soft": "#546471", "faint": "#5f6970", "rule": "#c7d1da", "ruleSoft": "#d7dfe6", "accent": "#2f6080", "track": "#d9dfe4"}, "papers": "2024, 2025 and 2026 NHT Physics examinations, plus 2025 NHT. Section A is 20 multiple-choice, Section B is short and extended answer."}, {"id": "software-dev-34", "name": "Software Development", "areas": ["Cross-unit", "Unit 3 AoS 1 — Programming", "Unit 3 AoS 2 — Analysis and Design", "Unit 4 AoS 1 — Development and Evaluation", "Unit 4 AoS 2 — Cyber Security"], "short": {"Cross-unit": "Cross-unit", "Unit 3 AoS 1 — Programming": "U3 Programming", "Unit 3 AoS 2 — Analysis and Design": "U3 Analysis and design", "Unit 4 AoS 1 — Development and Evaluation": "U4 Development and evaluation", "Unit 4 AoS 2 — Cyber Security": "U4 Cyber security"}, "points": [{"id": "X1", "area": "Cross-unit", "title": "The four stages of the problem-solving methodology", "detail": "Analysis, design, development, evaluation. Know the purpose of each stage and that the process is iterative — you loop back, you don't just march forward.", "questions": [{"marks": 3, "q": "Name the four stages of the problem-solving methodology and explain why the process is described as iterative rather than linear.", "answer": ["Analysis, design, development, evaluation.", "Iterative because work in a later stage often reveals a problem in an earlier one.", "Testing during development may show a requirement was misunderstood, sending you back to analysis.", "A purely linear reading of the PSM is a common error."]}]}, {"id": "X2", "area": "Cross-unit", "title": "The activities inside each PSM stage", "detail": "Analysis: solution requirements, constraints, scope. Design: solution design, evaluation criteria. Development: manipulation/coding, validation, testing, documentation. Evaluation: evaluation strategy, then the evaluation itself. Examiners ask which stage an activity belongs to.", "questions": [{"marks": 1, "q": "Determining the evaluation criteria for a solution occurs during which stage of the problem-solving methodology?", "options": ["Analysis", "Design", "Development", "Evaluation"], "answer": ["B — design.", "Evaluation criteria are written during design and applied during evaluation.", "A common trap: the criteria are not created in the evaluation stage."]}, {"marks": 2, "q": "Name the four stages of the problem-solving methodology in order and state one activity that occurs in the development stage.", "answer": ["Analysis, design, development, evaluation.", "Development activities: manipulation (coding), validation, testing, documentation.", "1 mark for the four stages in order, 1 mark for a correct development activity."]}], "card": {"key": "A0", "title": "The activities inside each PSM stage", "front": "Which activities belong to which stage of the problem-solving methodology?", "back": ["Analysis — solution requirements, constraints, scope", "Design — solution design, evaluation criteria", "Development — manipulation/coding, validation, testing, documentation", "Evaluation — evaluation strategy, then the evaluation itself", "Evaluation criteria are written in DESIGN, applied in EVALUATION", "The evaluation strategy is planned before the solution is finished"]}}, {"id": "X3", "area": "Cross-unit", "title": "\"Terms used in this study\" glossary", "detail": "The VCAA definitions — especially efficiency (time, cost, effort), effectiveness (functionality, accuracy, usability, completeness, readability, attractiveness, timeliness, communication of message), data vs information, and data integrity. Use their wording, not your own.", "questions": [{"marks": 3, "q": "Define efficiency and effectiveness as the study design uses the terms, and list three measures of effectiveness.", "answer": ["Efficiency: how well a solution uses time, cost and effort.", "Effectiveness: how well the solution achieves what it was intended to do.", "Measures of effectiveness: functionality, accuracy, usability, completeness, readability, attractiveness, timeliness, communication of message.", "Use the study design's own wording — paraphrasing loses marks here."]}]}, {"id": "X4", "area": "Cross-unit", "title": "Reading, writing and tracing pseudocode", "detail": "Trace loops and selection by hand to produce the output, spot a logic error in given pseudocode, and write an algorithm from a described problem. No single mandated dialect, but stay consistent.", "questions": [{"marks": 3, "q": "A pre-test loop is written as: WHILE count < 5 DO ... count ← count + 1 ... END WHILE, with count initialised to 0 and a running total increased by count on each pass. State the number of iterations and the final value of the total.", "answer": ["5 iterations — count takes the values 0, 1, 2, 3, 4.", "Total = 0 + 1 + 2 + 3 + 4 = 10.", "Build a trace table with one column per variable rather than tracking it mentally.", "The loop exits when count reaches 5, so 5 is never added."]}], "card": {"key": "A1", "title": "Reading and writing pseudocode", "front": "How do you trace and write pseudocode under exam conditions?", "back": ["Build a trace table — one column per variable, one row per pass", "Update every variable on every iteration; don't do it in your head", "Check the loop condition: is it pre-test or post-test? Off-by-one lives here", "Watch array indices and whether the loop is inclusive of the last value", "When writing: consistent indentation, clear variable names, terminate the loop", "Any consistent dialect is acceptable"]}}, {"id": "3.1.1", "area": "Unit 3 AoS 1 — Programming", "title": "Emerging trends in programming using AI", "detail": "Prompt-based code generation, automated debugging and testing, code optimisation. Know the benefits (speed, boilerplate, learning) and the risks (incorrect or insecure output, IP and attribution problems, over-reliance, the need to verify everything).", "questions": [{"marks": 4, "q": "A software development team begins using an AI coding assistant to generate sections of a new solution. Describe one benefit and two risks of this approach, and state one practice the team should adopt in response.", "answer": ["Benefit: speed — routine or boilerplate code is produced quickly, freeing time for design.", "Risk: generated code may be plausible but incorrect, or contain security vulnerabilities.", "Risk: intellectual property and attribution — the training data and ownership of output are unclear.", "Practice: every generated section must be read, tested and understood before it is accepted."]}], "card": {"key": "A2", "title": "Emerging trends in programming using AI", "front": "How is AI used in programming, and what are the risks?", "back": ["Prompt-based code generation, automated debugging and testing, optimisation", "Benefits: speed, boilerplate removed, a starting point when learning", "Risk: output can be plausible and wrong, or insecure", "Risk: IP and attribution — whose code was it trained on, who owns the output", "Risk: over-reliance eroding the developer's own skill", "Everything generated still has to be read, tested and understood"]}}, {"id": "3.1.2", "area": "Unit 3 AoS 1 — Programming", "title": "Functional and non-functional requirements", "detail": "Functional = what the solution must do. Non-functional = how well it does it (usability, reliability, portability, robustness, maintainability, security). Practise sorting statements from a case study into the two categories.", "questions": [{"marks": 4, "q": "A client states: 'The system must produce a monthly sales report' and 'The system must be usable by staff with no training'. Classify each requirement and justify your classification.", "answer": ["Producing a monthly sales report is a functional requirement — it is something the solution must DO.", "Being usable without training is a non-functional requirement — it describes how WELL the solution performs.", "1 mark for each classification, 1 mark for each justification.", "Test: a functional requirement can be checked with a pass/fail test case."]}], "card": {"key": "A3", "title": "Functional and non-functional requirements", "front": "Sort requirements into the two categories.", "back": ["Functional — what the solution must DO (calculate, store, display, validate)", "Non-functional — how WELL it does it", "Non-functional covers usability, reliability, portability, robustness, security, maintainability", "Test: could you write a pass/fail test for a feature? Usually functional", "'The system must respond within 2 seconds' is non-functional", "Both come out of the analysis stage"]}}, {"id": "3.1.3", "area": "Unit 3 AoS 1 — Programming", "title": "Design tools for representing modules", "detail": "Mock-up (layout and appearance), IPO chart (inputs, processing, outputs), pseudocode (the logic), data dictionary (name, data type, size, format, validation, example), object description (class name, properties, methods). Know what each one does that the others don't.", "questions": [{"marks": 4, "q": "A developer must document a single module before coding it. Name four design tools they could use and state what each one captures that the others do not.", "answer": ["Mock-up — the appearance and layout of the interface.", "IPO chart — the inputs, the processing, and the outputs of the module.", "Pseudocode — the logic and sequence of steps.", "Data dictionary — each variable's name, data type, size, format and validation.", "Also acceptable: object description — the class name, properties and methods."]}]}, {"id": "3.1.4", "area": "Unit 3 AoS 1 — Programming", "title": "Characteristics of data types", "detail": "Integer, floating point, character, string, Boolean, date/time. Be able to justify a choice — phone numbers and postcodes as strings, not integers; why a Boolean beats a one-character flag.", "questions": [{"marks": 3, "q": "State the most appropriate data type for each and justify one choice: an Australian mobile number; whether an order has been paid; a product price.", "answer": ["Mobile number — string. It is not used in arithmetic and a leading zero must be preserved, which an integer would discard.", "Paid status — Boolean. Only two states are possible.", "Product price — floating point (or a decimal/currency type) to hold cents."]}]}, {"id": "3.1.5", "area": "Unit 3 AoS 1 — Programming", "title": "Characteristics of data structures", "detail": "One-dimensional arrays (many items of the same type, accessed by index), records (related fields of mixed types), files. When each is appropriate and how you iterate through them.", "questions": [{"marks": 3, "q": "A program must store 200 temperature readings, then a set of customer records each holding a name, an age and an address. Name the appropriate data structure for each and justify your choices.", "answer": ["Temperatures — a one-dimensional array: many items of the same data type, accessed by index.", "Customer records — a record: related fields of differing data types grouped as one unit.", "An array of records would store many customers together."]}]}, {"id": "3.1.6", "area": "Unit 3 AoS 1 — Programming", "title": "Characteristics of data sources", "detail": "Plain text, delimited (CSV), XML. Know the structure of each, the advantages and disadvantages, and roughly how a program reads from and writes to them.", "questions": [{"marks": 1, "q": "A solution must store hierarchical data where each record contains a variable number of nested sub-records. Which data source is most appropriate?", "options": ["Plain text", "Delimited (CSV)", "XML", "A one-dimensional array"], "answer": ["C — XML.", "Nested tags carry structure and meaning, so hierarchy is preserved.", "CSV is flat — one record per line with fixed fields — so it cannot represent nesting."]}], "card": {"key": "A4", "title": "Characteristics of data sources", "front": "Compare plain text, CSV and XML.", "back": ["Plain text — simplest, no structure, the program must impose meaning", "Delimited (CSV) — one record per line, fields separated by a delimiter", "CSV is compact and widely supported but has no type information", "XML — nested tags carry structure and meaning, self-describing", "XML is verbose and heavier to parse but handles hierarchy", "Choose by the shape of the data, not by habit"]}}, {"id": "3.1.7", "area": "Unit 3 AoS 1 — Programming", "title": "Principles of object-oriented programming", "detail": "Abstraction (model only what matters), encapsulation (data and methods bundled, access controlled), generalisation (pull shared features into a parent), inheritance (child gains the parent's properties and methods). Identify each from code or an object description.", "questions": [{"marks": 1, "q": "A class named Vehicle defines a method calculateRegistration(). A class named Motorcycle is written so that it automatically has access to that method without it being rewritten. Which principle of object-oriented programming does this demonstrate?", "options": ["Abstraction", "Encapsulation", "Inheritance", "Generalisation"], "answer": ["C — inheritance.", "A child class gains the properties and methods of its parent.", "Generalisation is the design step of pulling shared features UP into the parent; inheritance is the child receiving them."]}, {"marks": 3, "q": "A developer declares the fields of a class as private and provides public methods to read and change them. Name the OOP principle this demonstrates and explain two benefits of designing the class this way.", "answer": ["Encapsulation (1 mark).", "Benefit: the internal representation can change without breaking code that uses the class.", "Benefit: values can be validated before being written, protecting data integrity.", "Either two benefits, clearly explained, for the remaining 2 marks."]}], "card": {"key": "R0", "title": "Principles of object-oriented programming", "front": "Name the four OOP principles and define each.", "back": ["Abstraction — model only the features that matter, hide the rest", "Encapsulation — bundle data with the methods acting on it, restrict access", "Generalisation — pull shared features up into a parent class", "Inheritance — a child class gains the parent's properties and methods", "Be ready to point to each in a code sample or object description", "Encapsulation is about access control; abstraction is about what you model"]}}, {"id": "3.1.8", "area": "Unit 3 AoS 1 — Programming", "title": "Features of a programming language", "detail": "Instructions; control structures — sequence, selection (if/else, case), iteration (pre-test, post-test, for); arithmetic, logical and conditional operators; variables vs constants; functions vs methods; classes and objects; GUI controls; file operations.", "questions": [{"marks": 2, "q": "Explain the difference between a pre-test and a post-test iteration structure, and give one situation where a post-test loop is the better choice.", "answer": ["A pre-test loop checks the condition before the body runs, so the body may execute zero times.", "A post-test loop runs the body once before checking, so it always executes at least once.", "Post-test suits input validation — you must prompt the user at least once before you can test the input."]}], "card": {"key": "A5", "title": "Features of a programming language", "front": "List what makes up a programming language.", "back": ["Control structures: sequence, selection (if/else, case), iteration (pre-test, post-test, for)", "Operators: arithmetic, logical (AND OR NOT), conditional (= < > <= >= <>)", "Variables and constants — and knowing when each is right", "Functions and methods, classes and objects", "GUI controls and event handling", "File operations: open, read, write, close"]}}, {"id": "3.1.9", "area": "Unit 3 AoS 1 — Programming", "title": "Naming conventions", "detail": "Meaningful and consistently applied — camelCase, PascalCase, snake_case, prefixes for control types. Applies to variables, constants, functions, classes and files. Be ready to explain why it matters (readability, maintenance by others).", "questions": [{"marks": 3, "q": "A developer submits code in which variables are named a, temp1 and x2, with no comments. Explain why this is a problem and describe two specific changes that would improve it.", "answer": ["The code cannot be maintained by another developer, who must work out intent from the logic alone.", "Change: meaningful identifiers applied to a consistent convention, e.g. totalSalePrice in camelCase.", "Change: internal documentation explaining the intent of each module and justifying non-obvious choices.", "Comments that restate the code add nothing — they must explain WHY."]}], "card": {"key": "A6", "title": "Naming conventions and internal documentation", "front": "What makes code readable to the next developer?", "back": ["Meaningful, consistently applied names for variables, functions, classes and files", "A convention applied consistently: camelCase, PascalCase or snake_case", "Comments explain INTENT and justify a choice", "A comment restating the code adds nothing", "Indentation and whitespace show structure", "The purpose of both is maintenance by someone who isn't you"]}}, {"id": "3.1.10", "area": "Unit 3 AoS 1 — Programming", "title": "Validation techniques", "detail": "Existence (not blank), type (right data type), range (within acceptable bounds). Manual (proofreading, double entry) vs electronic. Know where validation sits in the code and what should happen when it fails.", "questions": [{"marks": 3, "q": "A form accepts a delivery date. Describe the three validation techniques that should be applied and give an example of input each would reject.", "answer": ["Existence checking — rejects a blank field.", "Type checking — rejects 'tomorrow' where a date is required.", "Range checking — rejects a date in the past, or more than 12 months ahead.", "Validation should occur before the data is used, with a clear message naming the problem."]}]}, {"id": "3.1.11", "area": "Unit 3 AoS 1 — Programming", "title": "Internal documentation", "detail": "Comments, meaningful identifiers, indentation, whitespace. Good comments explain intent and justify a choice rather than restating the line of code. The purpose is future maintenance by someone else.", "questions": [{"marks": 3, "q": "A developer writes the comment '// add 1 to counter' above the line counter = counter + 1. Explain why this comment has little value and write a more useful comment for a line that applies a 15% discount only to members.", "answer": ["The comment restates what the code already says — it adds no information a reader could not get from the line itself.", "Useful comments explain INTENT or justify a decision.", "Better: '// 15% member discount set by the 2025 loyalty policy; rate is stored as a constant so it can be updated in one place'.", "Internal documentation exists so another developer can maintain the code later."]}], "card": {"key": "A6", "title": "Naming conventions and internal documentation", "front": "What makes code readable to the next developer?", "back": ["Meaningful, consistently applied names for variables, functions, classes and files", "A convention applied consistently: camelCase, PascalCase or snake_case", "Comments explain INTENT and justify a choice", "A comment restating the code adds nothing", "Indentation and whitespace show structure", "The purpose of both is maintenance by someone who isn't you"]}}, {"id": "3.1.12", "area": "Unit 3 AoS 1 — Programming", "title": "Sorting algorithms", "detail": "Selection sort (repeatedly find the smallest remaining item and swap it into place — simple but slow on large sets) and quick sort (pick a pivot, partition, recurse — much faster on average). Compare their complexity and justify which suits a given data size.", "questions": [{"marks": 4, "q": "A solution must sort a list of 500 000 customer records by surname. Name two sorting algorithms, compare their efficiency, and recommend one with justification.", "answer": ["Selection sort: repeatedly finds the smallest remaining item and swaps it into place. O(n²).", "Quick sort: selects a pivot, partitions around it, then recurses. O(n log n) on average.", "At 500 000 records the difference is enormous — selection sort performs on the order of n² comparisons.", "Recommend quick sort, justified by the size of the data set."]}], "card": {"key": "A7", "title": "Sorting algorithms", "front": "Compare selection sort and quick sort.", "back": ["Selection sort — repeatedly find the smallest remaining item, swap it into place", "Simple to implement and trace, but slow: O(n²)", "Quick sort — pick a pivot, partition around it, recurse on both sides", "Much faster on average: O(n log n)", "Selection sort is fine for small data; quick sort for large", "Justify by data size, not by preference"]}}, {"id": "3.1.13", "area": "Unit 3 AoS 1 — Programming", "title": "Searching algorithms", "detail": "Linear search (check each item in turn, works on unsorted data) vs binary search (requires sorted data, halves the search range each step). Justify the choice based on whether the data is sorted and how large it is.", "questions": [{"marks": 3, "q": "A program repeatedly searches an unsorted array of 10 000 items. A developer proposes switching to binary search. Evaluate this proposal.", "answer": ["Binary search requires the data to be sorted, so the array must be sorted first.", "Binary search is O(log n) against linear search's O(n), so each individual search is far faster.", "If many searches are performed, sorting once then using binary search is worthwhile.", "If only one or two searches are needed, the cost of sorting outweighs the benefit."]}], "card": {"key": "A8", "title": "Searching algorithms", "front": "Compare linear and binary search.", "back": ["Linear search — check each item in turn from the start", "Works on unsorted data; O(n)", "Binary search — compare to the middle, discard half, repeat", "REQUIRES sorted data; O(log n)", "For small or unsorted data linear is often the sensible choice", "If you have to sort first, count the cost of sorting too"]}}, {"id": "3.1.14", "area": "Unit 3 AoS 1 — Programming", "title": "Types of errors", "detail": "Syntax (breaks the language rules, won't run), logic (runs but produces the wrong result), runtime (crashes mid-execution — divide by zero, missing file, bad index). Identify the type from the symptom described.", "questions": [{"marks": 1, "q": "A program compiles and runs, but a total displayed to the user is consistently $10 too high. This is an example of", "options": ["a syntax error.", "a logic error.", "a runtime error.", "a validation error."], "answer": ["B — a logic error.", "The program executes without crashing but produces the wrong result.", "Syntax errors prevent the program running at all; runtime errors cause it to crash during execution."]}], "card": {"key": "A9", "title": "Types of errors", "front": "Identify the error type from the symptom.", "back": ["Syntax — breaks the language rules, so the program won't run at all", "Logic — runs cleanly but produces the wrong result", "Runtime — crashes partway through execution", "Runtime causes: divide by zero, missing file, index out of range, bad type", "Logic errors are the dangerous ones — nothing tells you they're there", "Testing finds logic errors; the compiler finds syntax errors"]}}, {"id": "3.1.15", "area": "Unit 3 AoS 1 — Programming", "title": "Debugging techniques", "detail": "Breakpoints, stepping through line by line, watches, debugging output/print statements, commenting out sections. These locate the cause of a fault — they don't prove the solution is correct.", "questions": [{"marks": 4, "q": "A solution crashes intermittently when processing a data file. Describe two debugging techniques the developer could use to locate the cause, and explain what each would reveal.", "answer": ["Breakpoints: pause execution at a chosen line and inspect variable values at that moment.", "Reveals the state of the data immediately before the crash.", "Debugging output statements: print variable values as the file is processed.", "Reveals which record is being handled when the failure occurs — often a malformed or empty line.", "Debugging locates the cause; it does not prove the solution is correct."]}, {"marks": 3, "q": "Explain what test data should cover when testing a module that accepts a student mark between 0 and 100, and give one example of each type.", "answer": ["Valid data — a value the module should accept, e.g. 57.", "Invalid data — a value it should reject, e.g. 150 or a non-numeric entry.", "Boundary data — values at the edge of the accepted range, e.g. 0, 100, and just outside at -1 and 101.", "Boundary values are where off-by-one errors surface."]}], "card": {"key": "A10", "title": "Debugging and testing techniques", "front": "What's the difference, and what does each involve?", "back": ["Debugging LOCATES the cause of a known fault", "Breakpoints, stepping line by line, watches, debug output, commenting out code", "Testing CHECKS whether the solution does what it should", "Test cases record input, expected output, actual output, pass/fail", "Test data must cover valid, invalid AND boundary values", "The test table is your evidence that testing happened"]}}, {"id": "3.1.16", "area": "Unit 3 AoS 1 — Programming", "title": "Testing techniques", "detail": "Test cases recording input, expected output, actual output and pass/fail. Test data must cover valid, invalid and boundary values. The test table is your evidence that testing happened.", "questions": [{"marks": 4, "q": "Design a test table with four test cases for a module that accepts a password of between 8 and 16 characters. State the input, the expected output and the type of test data for each.", "answer": ["8 characters — accepted — boundary (lower limit).", "16 characters — accepted — boundary (upper limit).", "12 characters — accepted — valid data.", "7 characters (or 17) — rejected with an error message — invalid/boundary data.", "A complete test table also records the ACTUAL output and a pass/fail result."]}], "card": {"key": "A10", "title": "Debugging and testing techniques", "front": "What's the difference, and what does each involve?", "back": ["Debugging LOCATES the cause of a known fault", "Breakpoints, stepping line by line, watches, debug output, commenting out code", "Testing CHECKS whether the solution does what it should", "Test cases record input, expected output, actual output, pass/fail", "Test data must cover valid, invalid AND boundary values", "The test table is your evidence that testing happened"]}}, {"id": "3.2.1", "area": "Unit 3 AoS 2 — Analysis and Design", "title": "Why individuals and organisations develop software", "detail": "A new opportunity, inefficiency in a current system, changing user needs, legal or regulatory change, competitive advantage, cost reduction. Case study questions want the reason tied to that organisation.", "questions": [{"marks": 2, "q": "A retailer's current stock system requires staff to re-enter the same data into three separate spreadsheets. Identify the reason the organisation would develop a new solution and explain the benefit sought.", "answer": ["Reason: inefficiency in th
