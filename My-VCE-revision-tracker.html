 by the same amount.", "Non-critical activities have float and can slip without affecting the finish date."]}]}, {"id": "4.15", "area": "Unit 4 — Networks and decision mathematics", "title": "Crashing", "detail": "Reducing activity durations at a cost, and recognising when the critical path shifts to a different sequence.", "questions": [{"marks": 3, "q": "A project has critical path A–C–E of 13 days and a second path B–D–E of 12 days. Activity C is crashed by 3 days. Determine the new minimum completion time.", "answer": ["Crashing C by 3 reduces A–C–E from 13 to 10 days.", "B–D–E is unaffected and remains 12 days.", "The critical path has shifted to B–D–E, so the new completion time is 12 days.", "Crashing beyond the point where another path becomes critical gains nothing."]}]}, {"id": "5.1", "area": "Across the course — modelling, algorithms and technology", "title": "Modelling in context", "detail": "Selecting a standard model for a practical situation, and stating the assumptions and conditions it relies on.", "questions": [{"marks": 3, "q": "A student models a population with a recurrence relation assuming a constant growth rate. State two assumptions this model makes and one limitation that follows.", "answer": ["Assumes the growth rate stays constant over every period modelled.", "Assumes no external shocks — no migration, disease or resource limit.", "Limitation: predictions become unreliable over long time spans as conditions change.", "Stating assumptions is part of the modelling process, not an optional extra."]}]}, {"id": "5.2", "area": "Across the course — modelling, algorithms and technology", "title": "Computational thinking and algorithms", "detail": "Abstraction, decomposition, pattern and algorithm applied to problem-solving, and following an algorithm step by step.", "questions": [{"marks": 3, "q": "An algorithm is: set total to 0; for each value in the list, if the value is above 50, add it to total; report total. State what the algorithm computes and identify the decision and repetition steps.", "answer": ["It computes the sum of all values greater than 50.", "Repetition: 'for each value in the list' — the loop.", "Decision: 'if the value is above 50' — the conditional.", "Sequencing, decision and repetition are the three building blocks of any algorithm."]}]}, {"id": "5.3", "area": "Across the course — modelling, algorithms and technology", "title": "Exact versus approximate results", "detail": "Knowing which form your technology has given you, and rounding to a stated number of decimal places or significant figures.", "questions": [{"marks": 3, "q": "A finance solver returns a repayment of 486.3271. State how this should be reported for a monthly loan repayment and explain why.", "answer": ["Report as $486.33, rounded UP to the nearest cent.", "Money is quoted to two decimal places.", "For a repayment that must clear a loan, rounding down would leave a small balance outstanding.", "Always check whether the question specifies rounding — if it does, follow it exactly."]}]}, {"id": "5.4", "area": "Across the course — modelling, algorithms and technology", "title": "Using technology well", "detail": "The finance solver, statistics and regression functions, and matrix operations — choosing the right one and verifying the output rather than trusting it.", "questions": [{"marks": 3, "q": "A student enters PV = −20000 and PMT = −400 into a finance solver for a loan and gets an impossible answer. Explain the error and give the correct sign convention.", "answer": ["Both values have the same sign, which the solver interprets as money flowing the same direction.", "Convention: money received is positive, money paid out is negative.", "For a loan you receive the principal, so PV = +20000, and you pay the repayments, so PMT = −400.", "Always check the answer is plausible before using it."]}]}, {"id": "5.5", "area": "Across the course — modelling, algorithms and technology", "title": "Interpreting and reporting results", "detail": "Reporting an answer in the context of the problem, with units, and discussing the limitations of the model used.", "questions": [{"marks": 3, "q": "A student reports 'the answer is 13'. Explain what is missing and rewrite it for a project network question about completion time.", "answer": ["No units, no context, and no indication of what the number measures.", "Rewritten: 'The minimum completion time for the project is 13 days.'", "State the quantity, the value and the unit, in the context of the question.", "Where relevant, comment on whether the answer is reasonable."]}]}], "source": "VCE Mathematics Study Design 2023–2027.", "theme": {"paper": "#efeae3", "lift": "#f8f4ee", "ink": "#2b2418", "soft": "#6b6052", "faint": "#6f685d", "rule": "#dbd2c3", "ruleSoft": "#e6dfd3", "accent": "#7c5f2a", "track": "#e4ded4"}, "papers": "VCAA 2020–2026 General/Further examinations and NHT papers, plus commercial trial exams, in your General folder. Several have full worked solutions. Exam 1 is 40 multiple-choice; Exam 2 is written response across the four modules."}, {"id": "maths-methods-34", "name": "Mathematical Methods", "areas": ["Area of Study 1 — Functions, relations and graphs", "Area of Study 2 — Algebra, number and structure", "Area of Study 3 — Calculus", "Area of Study 4 — Data analysis, probability and statistics", "Across the course — modelling, algorithms and technology"], "short": {"Area of Study 1 — Functions, relations and graphs": "Functions and graphs", "Area of Study 2 — Algebra, number and structure": "Algebra", "Area of Study 3 — Calculus": "Calculus", "Area of Study 4 — Data analysis, probability and statistics": "Probability and statistics", "Across the course — modelling, algorithms and technology": "Modelling and tech"}, "points": [{"id": "1.1", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Graphs of polynomial functions", "detail": "Key features by degree — axis intercepts, turning points, end behaviour. Sketching by hand up to degree 4, and reading a rule off a graph.", "questions": [{"marks": 3, "q": "For f(x) = x³ − 4x, state the x-intercepts, describe the end behaviour, and state the number of turning points.", "answer": ["Factorise: x(x² − 4) = x(x − 2)(x + 2), so intercepts at x = −2, 0, 2.", "As x → ∞, f(x) → ∞; as x → −∞, f(x) → −∞ (positive leading coefficient, odd degree).", "A cubic with three distinct real roots has two turning points."]}]}, {"id": "1.2", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Power functions", "detail": "y = xⁿ for n ∈ Q. Shape for positive, negative and fractional n; maximal domain and range; asymptotic behaviour where it applies.", "questions": [{"marks": 2, "q": "State the maximal domain and the range of f(x) = x^(1/2) − 3, and describe the shape of its graph.", "answer": ["Maximal domain: [0, ∞) — the square root requires a non-negative argument.", "Range: [−3, ∞).", "Shape: the graph of y = √x translated 3 units down; increasing, concave down, endpoint at (0, −3)."]}]}, {"id": "1.3", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Exponential functions", "detail": "y = aˣ for a ∈ R, and y = eˣ in particular. The key points (−1, 1/a), (0, 1) and (1, a), the horizontal asymptote, and growth vs decay.", "questions": [{"marks": 3, "q": "The graph of y = 2e^(x−1) + 3 is obtained from y = e^x. State the transformations applied in order, the equation of the horizontal asymptote, and the y-intercept.", "answer": ["Dilation by factor 2 from the x-axis, translation 1 unit right, translation 3 units up.", "Horizontal asymptote: y = 3.", "y-intercept: x = 0 gives y = 2e^(−1) + 3 = 2/e + 3 ≈ 3.74."]}]}, {"id": "1.4", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Logarithmic functions", "detail": "y = logₑ(x) and y = log₁₀(x). Vertical asymptote, domain, and the inverse relationship with the exponential function.", "questions": [{"marks": 3, "q": "For y = log_e(2x − 6), state the maximal domain, the equation of the vertical asymptote, and the x-intercept.", "answer": ["Requires 2x − 6 > 0, so domain is (3, ∞).", "Vertical asymptote: x = 3.", "x-intercept when 2x − 6 = 1, so x = 3.5."]}]}, {"id": "1.5", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Circular functions", "detail": "y = sin(x), y = cos(x) and y = tan(x). Amplitude, period, range, exact values, and the asymptotes of tan.", "questions": [{"marks": 3, "q": "State the amplitude, period and range of y = −3 sin(2x) + 1, and give the coordinates of its first maximum for x ≥ 0.", "answer": ["Amplitude 3; period 2π/2 = π; range [−2, 4].", "The negative coefficient reflects the graph, so the first maximum occurs where sin(2x) = −1.", "2x = 3π/2, so x = 3π/4, giving the point (3π/4, 4)."], "source": "2025 Methods Exam 2, Q1 and Q2 — range and asymptotes of circular functions."}]}, {"id": "1.6", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Transformations", "detail": "y = A f(n(x + b)) + c where A, n ≠ 0. Dilations (both 'parallel to' and 'from' an axis), reflections and translations, and the order in which they apply.", "questions": [{"marks": 3, "q": "Describe the sequence of transformations mapping y = f(x) to y = −f(2(x + 1)) − 4, in the correct order.", "answer": ["Dilation by factor 1/2 from the y-axis (parallel to the x-axis).", "Translation 1 unit in the negative x direction.", "Reflection in the x-axis, then translation 4 units down.", "Dilations and reflections are applied before translations."]}]}, {"id": "1.7", "area": "Area of Study 1 — Functions, relations and graphs", "title": "The inverse transformation", "detail": "Working backwards from a transformed graph to the original function, and describing the mapping that does it.", "questions": [{"marks": 3, "q": "The graph of y = f(x) is transformed to y = 3f(x − 2). Describe the transformation that maps the new graph back to the original.", "answer": ["Reverse each transformation, in reverse order.", "Translate 2 units in the negative x direction.", "Then dilate by factor 1/3 from the x-axis.", "Mapping: (x, y) → (x − 2, y/3)."]}]}, {"id": "1.8", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Families of transformed functions", "detail": "How the graph changes as a single transformation parameter varies, and what stays fixed.", "questions": [{"marks": 3, "q": "For the family y = x² + bx + 1 where b ∈ R, determine the values of b for which the graph has no x-intercepts.", "answer": ["No x-intercepts when the discriminant is negative.", "Δ = b² − 4(1)(1) = b² − 4 < 0.", "b² < 4, so −2 < b < 2."]}]}, {"id": "1.9", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Sum and difference functions", "detail": "Graphs of f + g and f − g, including the domain of the result being the intersection of the two domains.", "questions": [{"marks": 2, "q": "Given f(x) = √x with domain [0, ∞) and g(x) = x − 2 with domain R, state the domain of (f + g)(x) and find (f + g)(4).", "answer": ["Domain of a sum is the intersection of the domains: [0, ∞).", "(f + g)(4) = √4 + (4 − 2) = 2 + 2 = 4."]}]}, {"id": "1.10", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Product functions", "detail": "The graph of f × g, including where it cuts the axes and how the factors' signs determine its shape.", "questions": [{"marks": 3, "q": "For f(x) = x and g(x) = x − 3, sketch the key features of y = f(x)g(x), stating the x-intercepts and the coordinates of the turning point.", "answer": ["The product is x(x − 3) = x² − 3x, a parabola.", "x-intercepts at x = 0 and x = 3 — where either factor is zero.", "Turning point midway at x = 1.5, giving (1.5, −2.25)."]}]}, {"id": "1.11", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Composite functions", "detail": "Graphs of f ∘ g. The existence condition ran(g) ⊆ dom(f), and finding the domain and range of the composite. Composites giving reciprocal or quotient functions are excluded.", "questions": [{"marks": 3, "q": "Let f(x) = √x with domain [0, ∞) and g(x) = x − 5 with domain R. Determine whether f(g(x)) is defined, and if so state its rule and domain.", "answer": ["f(g(x)) requires ran(g) ⊆ dom(f). ran(g) = R, dom(f) = [0, ∞), so not defined on all of R.", "Restricting: need x − 5 ≥ 0, so x ≥ 5.", "f(g(x)) = √(x − 5), domain [5, ∞)."], "source": "2025 Methods Exam 2, Q10 — an inequality involving a composite function."}]}, {"id": "1.12", "area": "Area of Study 1 — Functions, relations and graphs", "title": "Modelling practical situations", "detail": "Using polynomial, power, circular, exponential and logarithmic functions, their transformations and combinations, including simple piecewise (hybrid) functions.", "questions": [{"marks": 4, "q": "The depth of water in a harbour is modelled by d(t) = 4 + 2sin(πt/6), where t is hours after midnight. State the maximum depth, the time it first occurs, and the period of the model.", "answer": ["Maximum depth = 4 + 2 = 6 metres, when sin(πt/6) = 1.", "πt/6 = π/2 gives t = 3, so 3 am.", "Period = 2π ÷ (π/6) = 12 hours.", "Minimum depth is 2 metres, at 9 am."]}]}, {"id": "1.13", "area": "Area of Study 1 — Functions, relations and graphs", "title": "The language of key features", "detail": "Domain, maximal or implied domain, co-domain, range, asymptotic behaviour, symmetry, stationary points and points of inflection — used precisely, because marks hang on the wording.", "questions": [{"marks": 2, "q": "Explain the difference between the maximal (implied) domain of a function and a restricted domain, using y = 1/(x − 2) as your example.", "answer": ["The maximal domain is every value of x for which the rule is defined: R \\ {2}.", "A restricted domain is a smaller domain deliberately imposed, e.g. (2, ∞).", "Restricting is often done to make a function one-to-one so an inverse exists."]}]}, {"id": "2.1", "area": "Area of Study 2 — Algebra, number and structure", "title": "Solving polynomial equations", "detail": "Real coefficients, degree n with up to n real solutions. Factor and remainder theorems, the rational root theorem, and numerical solutions where exact ones aren't required.", "questions": [{"marks": 4, "q": "Given that x = 2 is a solution of x³ − 3x² − 4x + 12 = 0, factorise the cubic fully and state all solutions.", "answer": ["Since x = 2 is a root, (x − 2) is a factor.", "Dividing: x³ − 3x² − 4x + 12 = (x − 2)(x² − x − 6).", "Factorise the quadratic: (x − 3)(x + 2).", "Solutions: x = −2, 2, 3."]}]}, {"id": "2.2", "area": "Area of Study 2 — Algebra, number and structure", "title": "Inverse functions", "detail": "The condition for an inverse to exist (one-to-one, or a restricted domain that makes it so), finding the rule, swapping domain and range, and the reflection in y = x.", "questions": [{"marks": 4, "q": "For f(x) = (x − 1)² with domain [1, ∞), find the rule and domain of f⁻¹, and explain why the domain restriction was necessary.", "answer": ["Let y = (x − 1)², swap: x = (y − 1)², so y = 1 + √x (taking the positive root to match the restricted domain).", "f⁻¹(x) = 1 + √x, domain [0, ∞) — which is the range of f.", "Without restriction, f is many-to-one, so no inverse function exists.", "The domain of the inverse is the range of the original."]}]}, {"id": "2.3", "area": "Area of Study 2 — Algebra, number and structure", "title": "Using inverses to solve equations", "detail": "Applying inverse operations to exponential, logarithmic, circular and power equations.", "questions": [{"marks": 3, "q": "Solve 3e^(2x) − 5 = 16 for x, giving an exact answer.", "answer": ["3e^(2x) = 21, so e^(2x) = 7.", "Take the natural log of both sides: 2x = log_e(7).", "x = ½ log_e(7)."]}]}, {"id": "2.4", "area": "Area of Study 2 — Algebra, number and structure", "title": "Composition of functions", "detail": "(f ∘ g)(x) = f(g(x)), defined when ran(g) ⊆ dom(f). Finding the rule, domain and range of a composite.", "questions": [{"marks": 3, "q": "Let f(x) = x² and g(x) = 2x + 1, both with domain R. Find the rules for f(g(x)) and g(f(x)) and state why they differ.", "answer": ["f(g(x)) = (2x + 1)² = 4x² + 4x + 1.", "g(f(x)) = 2x² + 1.", "Composition is not commutative — the order in which the operations are applied changes the result."]}]}, {"id": "2.5", "area": "Area of Study 2 — Algebra, number and structure", "title": "Solving f(x) = g(x)", "detail": "Over a specified interval, by graphical, numerical and algebraic methods, choosing whichever is appropriate.", "questions": [{"marks": 3, "q": "Solve x² − 4 = 3x − 6 algebraically, and state what the solutions represent graphically.", "answer": ["x² − 3x + 2 = 0, giving (x − 1)(x − 2) = 0.", "x = 1 and x = 2.", "These are the x-coordinates of the points where the parabola y = x² − 4 and the line y = 3x − 6 intersect."]}]}, {"id": "2.6", "area": "Area of Study 2 — Algebra, number and structure", "title": "Literal equations and equations with a parameter", "detail": "Solving for x in terms of constants, and finding the general solution — including the values of the parameter for which no solution or infinitely many exist.", "questions": [{"marks": 4, "q": "Consider the system kx + 3y = 6 and 2x + ky = 4, where k ∈ R. Find the values of k for which the system has no solution.", "answer": ["Write as a matrix and use the determinant: det = k·k − 3·2 = k² − 6.", "A unique solution exists when k² − 6 ≠ 0, i.e. k ≠ ±√6.", "When k = √6 the equations are inconsistent (check by substitution) so there is no solution.", "Always test both values — one may give infinitely many solutions instead of none."], "source": "2025 Methods Exam 2, Q4 — a system of equations containing a parameter k."}]}, {"id": "2.7", "area": "Area of Study 2 — Algebra, number and structure", "title": "Simultaneous linear equations", "detail": "Including the cases of no solution and infinitely many solutions. Geometric interpretation is required for two equations in two variables only.", "questions": [{"marks": 4, "q": "For what value of m do the equations 2x + 3y = 7 and 4x + my = 14 have infinitely many solutions? Explain geometrically.", "answer": ["Infinitely many solutions when one equation is a multiple of the other.", "The second is twice the first when m = 6: 4x + 6y = 14.", "Geometrically the two lines coincide — they are the same line, so every point on it is a solution.", "If m = 6 but the constant were not 14, the lines would be parallel and there would be no solution."]}]}, {"id": "2.8", "area": "Area of Study 2 — Algebra, number and structure", "title": "Exponent and logarithm laws", "detail": "Applied to simplifying expressions and solving equations, including changing base and dealing with restrictions on the domain.", "questions": [{"marks": 3, "q": "Solve log_e(x) + log_e(x − 3) = log_e(10) for x.", "answer": ["Combine: log_e(x(x − 3)) = log_e(10), so x² − 3x = 10.", "x² − 3x − 10 = 0, giving (x − 5)(x + 2) = 0, so x = 5 or x = −2.", "Reject x = −2: the domain requires x > 3 for both logarithms to be defined.", "x = 5."]}]}, {"id": "2.9", "area": "Area of Study 2 — Algebra, number and structure", "title": "Exact solutions of trigonometric equations", "detail": "Solving sin(ax + b) = c, cos(ax + b) = c and tan(ax + b) = c by hand over a given interval, finding every solution in that interval rather than just the first.", "questions": [{"marks": 4, "q": "Solve 2 sin(2x) = √3 for x ∈ [0, 2π], giving exact values.", "answer": ["sin(2x) = √3/2. Let u = 2x, where u ∈ [0, 4π].", "sin(u) = √3/2 at u = π/3, 2π/3, and then adding 2π: 7π/3, 8π/3.", "x = u/2 = π/6, π/3, 7π/6, 4π/3.", "Change the interval for u first — that is where solutions are usually lost."], "source": "2025 Methods Exam 1, Q3b — solving a circular function equation over an interval."}]}, {"id": "2.10", "area": "Area of Study 2 — Algebra, number and structure", "title": "Newton's method", "detail": "The algorithm for numerically approximating a root, applying it by hand for an iteration or two, and knowing when it fails.", "questions": [{"marks": 3, "q": "Newton's method is used to approximate a root of f(x) = x³ − 2x − 5 starting at x₀ = 2. Write the iteration formula and find x₁.", "answer": ["x_(n+1) = x_n − f(x_n)/f′(x_n), with f′(x) = 3x² − 2.", "f(2) = 8 − 4 − 5 = −1; f′(2) = 12 − 2 = 10.", "x₁ = 2 − (−1)/10 = 2.1.", "The method fails if f′(x_n) = 0, or may diverge from a poor starting value."]}]}, {"id": "3.1", "area": "Area of Study 3 — Calculus", "title": "Limits, continuity and differentiability", "detail": "The graphical treatment — recognising where a function is continuous but not differentiable, and what a limit means at a point.", "questions": [{"marks": 3, "q": "Explain the difference between a function being continuous at a point and being differentiable at that point, and give an example of a function that is one but not the other.", "answer": ["Continuous at x = a: there is no break — the limit as x → a equals f(a).", "Differentiable at x = a: the gradient approaching from the left equals that from the right.", "f(x) = |x| is continuous at x = 0 but not differentiable — the gradient jumps from −1 to 1.", "Differentiability implies continuity, but not the reverse."]}]}, {"id": "3.2", "area": "Area of Study 3 — Calculus", "title": "Differentiation from first principles", "detail": "The limit definition of the derivative, and applying it to simple functions by hand.", "questions": [{"marks": 3, "q": "Use first principles to find the derivative of f(x) = x² + 3x.", "answer": ["f′(x) = lim(h→0) [f(x + h) − f(x)]/h", "= lim [((x+h)² + 3(x+h)) − (x² + 3x)]/h = lim [2xh + h² + 3h]/h", "= lim (2x + h + 3) as h → 0", "= 2x + 3."]}]}, {"id": "3.3", "area": "Area of Study 3 — Calculus", "title": "Deducing the graph of the derivative", "detail": "Going from the graph of f to the graph of f′ — stationary points become x-intercepts, and the sign of the gradient sets the sign of f′.", "questions": [{"marks": 3, "q": "The graph of y = f(x) has a local maximum at x = −1, a local minimum at x = 3, and is increasing for x > 3. Describe the key features of the graph of y = f′(x).", "answer": ["f′(x) = 0 at x = −1 and x = 3 — stationary points become x-intercepts of the derivative.", "f′(x) > 0 for x < −1 and for x > 3 (f increasing).", "f′(x) < 0 for −1 < x < 3 (f decreasing).", "So the derivative graph cuts the axis downward at −1 and upward at 3."]}]}, {"id": "3.4", "area": "Area of Study 3 — Calculus", "title": "Deducing the graph of an antiderivative", "detail": "Going the other way, from the graph of a function to the graph of one of its antiderivatives.", "questions": [{"marks": 3, "q": "The graph of y = f(x) is a straight line with a constant positive gradient. Describe the shape of the graph of an antiderivative of f, and explain why there are infinitely many.", "answer": ["If f is linear, an antiderivative is quadratic — a parabola.", "A positive gradient in f means the antiderivative is concave up.", "Antiderivatives differ by an arbitrary constant c, which translates the graph vertically.", "Infinitely many because any value of c satisfies F′(x) = f(x)."]}]}, {"id": "3.5", "area": "Area of Study 3 — Calculus", "title": "Standard derivatives", "detail": "Derivatives of xⁿ for n ∈ Q, eˣ, logₑ(x), sin(x), cos(x) and tan(x).", "questions": [{"marks": 3, "q": "Differentiate each: y = x^(3/2), y = log_e(x), y = tan(x).", "answer": ["d/dx of x^(3/2) = (3/2)x^(1/2).", "d/dx of log_e(x) = 1/x.", "d/dx of tan(x) = sec²(x), equivalently 1/cos²(x)."]}]}, {"id": "3.6", "area": "Area of Study 3 — Calculus", "title": "Sum, difference and constant multiple rules", "detail": "Differentiating linear combinations of the standard functions.", "questions": [{"marks": 2, "q": "Differentiate y = 4x³ − 5e^x + 2log_e(x).", "answer": ["dy/dx = 12x² − 5e^x + 2/x.", "Each term differentiated separately; constants multiply through."]}]}, {"id": "3.7", "area": "Area of Study 3 — Calculus", "title": "The product rule", "detail": "Applied by hand to simple combinations of polynomial, exponential, circular, logarithmic and power functions.", "questions": [{"marks": 3, "q": "Find dy/dx for y = x² sin(x), and evaluate it at x = π.", "answer": ["Product rule: dy/dx = 2x sin(x) + x² cos(x).", "At x = π: sin(π) = 0, cos(π) = −1.", "dy/dx = 0 + π²(−1) = −π²."], "source": "2025 Methods Exam 1, Q1 — differentiation requiring product and chain rules."}]}, {"id": "3.8", "area": "Area of Study 3 — Calculus", "title": "The quotient rule", "detail": "Applied by hand, including recognising when rearranging first is quicker.", "questions": [{"marks": 3, "q": "Find the derivative of y = (2x + 1)/(x − 3) and state the value of x for which it is undefined.", "answer": ["Quotient rule: [(2)(x − 3) − (2x + 1)(1)] / (x − 3)²", "= (2x − 6 − 2x − 1)/(x − 3)² = −7/(x − 3)².", "Undefined at x = 3, where the original function has a vertical asymptote."]}]}, {"id": "3.9", "area": "Area of Study 3 — Calculus", "title": "The chain rule", "detail": "Differentiating composite functions, including nested transformations of the standard functions.", "questions": [{"marks": 3, "q": "Find the gradient of the tangent to y = (3x² − 1)⁴ at x = 1.", "answer": ["Chain rule: dy/dx = 4(3x² − 1)³ × 6x = 24x(3x² − 1)³.", "At x = 1: 3(1) − 1 = 2, so (2)³ = 8.", "dy/dx = 24 × 1 × 8 = 192."]}]}, {"id": "3.10", "area": "Area of Study 3 — Calculus", "title": "Graph sketching using differentiation", "detail": "Locating stationary points and determining their nature, finding points of inflection, and identifying intervals where a function is strictly increasing or strictly decreasing.", "questions": [{"marks": 4, "q": "For f(x) = x³ − 3x² + 1, find the stationary points and determine the nature of each.", "answer": ["f′(x) = 3x² − 6x = 3x(x − 2), so stationary at x = 0 and x = 2.", "f(0) = 1, f(2) = 8 − 12 + 1 = −3.", "f″(x) = 6x − 6. At x = 0, f″ = −6 < 0 → local maximum (0, 1).", "At x = 2, f″ = 6 > 0 → local minimum (2, −3)."]}]}, {"id": "3.11", "area": "Area of Study 3 — Calculus", "title": "Optimisation", "detail": "Local maximum and minimum values over an interval, applied to problems in context — including checking the endpoints of the interval, which is where marks are usually lost.", "questions": [{"marks": 4, "q": "A rectangular pen is built against a wall using 40 m of fencing on three sides. Find the dimensions giving the maximum area, and state the maximum area.", "answer": ["Let the two equal sides be x and the third be 40 − 2x. Area A = x(40 − 2x) = 40x − 2x².", "dA/dx = 40 − 4x = 0, so x = 10.", "Second derivative is −4 < 0, confirming a maximum.", "Dimensions 10 m by 20 m, maximum area 200 m². Check endpoints x = 0 and x = 20 both give A = 0."]}]}, {"id": "3.12", "area": "Area of Study 3 — Calculus", "title": "Tangents, normals and rates of change", "detail": "The gradient of a tangent at a point, the equation of a tangent or normal, and interpreting the derivative as a rate of change in context.", "questions": [{"marks": 4, "q": "Find the equation of the tangent to y = x² − 2x at the point where x = 3, and the equation of the normal at the same point.", "answer": ["y(3) = 9 − 6 = 3, so the point is (3, 3).", "dy/dx = 2x − 2, so the gradient at x = 3 is 4.", "Tangent: y − 3 = 4(x − 3), i.e. y = 4x − 9.", "Normal gradient = −1/4, so y − 3 = −¼(x − 3), i.e. y = −x/4 + 15/4."]}]}, {"id": "3.13", "area": "Area of Study 3 — Calculus", "title": "Antiderivatives", "detail": "Antiderivatives of polynomial and power functions, and of f(ax + b) where f is xⁿ for n ∈ Q, eˣ, sin(x) or cos(x), plus linear combinations of these.", "questions": [{"marks": 3, "q": "Find the antiderivative of f(x) = 6x² + e^(2x) − sin(3x).", "answer": ["Antiderivative of 6x² is 2x³.", "Antiderivative of e^(2x) is ½e^(2x).", "Antiderivative of −sin(3x) is (1/3)cos(3x).", "F(x) = 2x³ + ½e^(2x) + (1/3)cos(3x) + c — do not omit the constant."]}]}, {"id": "3.14", "area": "Area of Study 3 — Calculus", "title": "The definite integral as a limiting sum", "detail": "Informal treatment of the integral as a limit of a sum, and approximating a definite integral using the trapezium rule.", "questions": [{"marks": 3, "q": "Use the trapezium rule with two intervals of equal width to estimate the area under y = x² between x = 0 and x = 2, and state whether the estimate is an over- or underestimate.", "answer": ["Interval width h = 1; values y(0) = 0, y(1) = 1, y(2) = 4.", "Area ≈ ½(1)[0 + 2(1) + 4] = ½(6) = 3.", "The exact value is 8/3 ≈ 2.67.", "It is an overestimate because y = x² is concave up, so each chord lies above the curve."], "source": "2025 Methods Exam 2, Q6 — the trapezium rule with two trapeziums."}]}, {"id": "3.15", "area": "Area of Study 3 — Calculus", "title": "The fundamental theorem of calculus", "detail": "The link between antidifferentiation and the definite integral, and the properties of definite integrals.", "questions": [{"marks": 3, "q": "State the fundamental theorem of calculus and use it to evaluate the definite integral of 3x² from x = 1 to x = 3.", "answer": ["If F is an antiderivative of f, then the definite integral of f from a to b equals F(b) − F(a).", "An antiderivative of 3x² is x³.", "F(3) − F(1) = 27 − 1 = 26."]}]}, {"id": "3.16", "area": "Area of Study 3 — Calculus", "title": "Area under and between curves", "detail": "Finding the area of a region bounded by lines or curves over a specified interval, including handling signed area where the curve crosses the axis.", "questions": [{"marks": 4, "q": "Find the area of the region enclosed between y = x² and y = 2x.", "answer": ["Intersections: x² = 2x gives x(x − 2) = 0, so x = 0 and x = 2.", "Between these, 2x lies above x², so integrate (2x − x²) from 0 to 2.", "Antiderivative: x² − x³/3, evaluated 0 to 2 gives 4 − 8/3.", "Area = 4/3 square units."]}]}, {"id": "3.17", "area": "Area of Study 3 — Calculus", "title": "Average value of a function", "detail": "The definition and its calculation over an interval.", "questions": [{"marks": 3, "q": "Find the average value of f(x) = x² over the interval [0, 3].", "answer": ["Average value = 1/(b − a) × the definite integral of f from a to b.", "= (1/3) × [x³/3] from 0 to 3 = (1/3)(9) = 3.", "Note this is not the same as the average of the endpoint values."]}]}, {"id": "3.18", "area": "Area of Study 3 — Calculus", "title": "Applications of integration", "detail": "Problems in context, including the use of integration with probability density functions for continuous random variables.", "questions": [{"marks": 4, "q": "A particle's velocity is v(t) = 3t² − 12 m s⁻¹. Find the displacement from t = 0 to t = 4, and explain why this differs from the distance travelled.", "answer": ["Displacement = integral of v from 0 to 4 = [t³ − 12t] from 0 to 4 = 64 − 48 = 16 m.", "v = 0 when 3t² = 12, so t = 2. The particle moves backwards for 0 < t < 2.", "Distance requires integrating |v|: |−16| from 0 to 2, plus 32 from 2 to 4, giving 48 m.", "Displacement counts direction; distance does not."]}]}, {"id": "4.1", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Random variables", "detail": "The concept of a random variable, discrete versus continuous, and what a probability distribution specifies.", "questions": [{"marks": 2, "q": "Explain the difference between a discrete and a continuous random variable, giving one example of each from a school context.", "answer": ["Discrete: takes countable, separate values — the number of students absent in a class.", "Continuous: takes any value in an interval — the time a student takes to run 100 m.", "Probability for a continuous variable is found over an interval, never at a single point."]}]}, {"id": "4.2", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Discrete probability distributions", "detail": "Specification by rule, table or graph; the probability mass function; and the requirement that the probabilities sum to one.", "questions": [{"marks": 3, "q": "A discrete random variable has Pr(X = 1) = 0.2, Pr(X = 2) = 3k, Pr(X = 3) = 0.3 and Pr(X = 4) = k. Find k.", "answer": ["All probabilities must sum to 1.", "0.2 + 3k + 0.3 + k = 1", "4k = 0.5, so k = 0.125."]}]}, {"id": "4.3", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Mean, variance and standard deviation of a discrete random variable", "detail": "Calculating E(X), Var(X) and sd(X), and interpreting each in the context of the distribution.", "questions": [{"marks": 4, "q": "For X with Pr(X = 0) = 0.4, Pr(X = 1) = 0.4 and Pr(X = 2) = 0.2, find E(X) and sd(X).", "answer": ["E(X) = 0(0.4) + 1(0.4) + 2(0.2) = 0.8.", "E(X²) = 0(0.4) + 1(0.4) + 4(0.2) = 1.2.", "Var(X) = E(X²) − [E(X)]² = 1.2 − 0.64 = 0.56.", "sd(X) = √0.56 = 0.748 (3 dp)."]}]}, {"id": "4.4", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Bernoulli trials", "detail": "The conditions that define them, and recognising whether a described situation actually satisfies those conditions.", "questions": [{"marks": 3, "q": "State the four conditions required for a sequence of Bernoulli trials, and explain whether drawing three cards from a deck without replacement satisfies them.", "answer": ["Two outcomes per trial; a fixed number of trials; constant probability of success; trials independent.", "Drawing without replacement changes the probability on each draw.", "Trials are therefore not independent and p is not constant — not Bernoulli trials.", "With replacement, it would satisfy all four."]}]}, {"id": "4.5", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "The binomial distribution", "detail": "Pr(X = x) = ⁿCₓ pˣ(1 − p)ⁿ⁻ˣ, mean np and variance np(1 − p), and how changing n or p changes the shape of the distribution.", "questions": [{"marks": 3, "q": "For X ~ Bi(8, 0.3), find Pr(X = 3), the mean and the variance.", "answer": ["Pr(X = 3) = ⁸C₃(0.3)³(0.7)⁵ = 56 × 0.027 × 0.16807 = 0.254 (3 dp).", "Mean = np = 8 × 0.3 = 2.4.", "Variance = np(1 − p) = 8 × 0.3 × 0.7 = 1.68."]}]}, {"id": "4.6", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Applying the binomial distribution", "detail": "Including 'at least' and 'at most' phrasing, conditional probability, and finding the smallest n that meets a stated condition.", "questions": [{"marks": 4, "q": "A machine produces items with a 5% defect rate. In a random sample of 20 items, find the probability that at least two are defective, and the mean number of defective items.", "answer": ["X ~ Bi(20, 0.05).", "Pr(X ≥ 2) = 1 − Pr(X = 0) − Pr(X = 1).", "Pr(X = 0) = 0.95²⁰ = 0.3585; Pr(X = 1) = 20(0.05)(0.95)¹⁹ = 0.3774.", "Pr(X ≥ 2) = 1 − 0.7359 = 0.264 (3 dp). Mean = np = 20 × 0.05 = 1."], "source": "2025 Methods Exam 1, Q6 — variance and a cumulative probability for a binomial variable."}]}, {"id": "4.7", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Continuous random variables and probability density functions", "detail": "The requirements that f(x) ≥ 0 and the total area equals one, and Pr(a < X < b) as a definite integral.", "questions": [{"marks": 4, "q": "A continuous random variable has f(x) = kx for 0 ≤ x ≤ 4 and zero elsewhere. Find k, then find Pr(1 < X < 2).", "answer": ["Total area must equal 1: the integral of kx from 0 to 4 = k[x²/2] = 8k = 1, so k = 1/8.", "Pr(1 < X < 2) = integral of x/8 from 1 to 2 = [x²/16] from 1 to 2.", "= 4/16 − 1/16 = 3/16 = 0.1875."]}]}, {"id": "4.8", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Measures for a continuous random variable", "detail": "Mean, median, percentiles, variance and standard deviation, and setting up the integral that each one requires.", "questions": [{"marks": 4, "q": "For the probability density function f(x) = x/8 on [0, 4], find the mean and the median.", "answer": ["Mean = integral of x·f(x) from 0 to 4 = integral of x²/8 = [x³/24] from 0 to 4 = 64/24 = 8/3 ≈ 2.67.", "Median m satisfies the integral of f from 0 to m = 0.5.", "[x²/16] from 0 to m = m²/16 = 0.5, so m² = 8.", "m = 2√2 ≈ 2.83."]}]}, {"id": "4.9", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "The normal distribution", "detail": "Its shape and symmetry, the effect of μ and σ, and the approximate 68–95–99.7 proportions within one, two and three standard deviations.", "questions": [{"marks": 3, "q": "For X ~ N(60, 5²), use the 68–95–99.7 rule to state the percentage of values between 50 and 65, without standardising.", "answer": ["50 is 2 standard deviations below the mean; 65 is 1 above.", "Between −2 sd and the mean: 95/2 = 47.5%.", "Between the mean and +1 sd: 68/2 = 34%.", "Total = 81.5%."]}]}, {"id": "4.10", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Standardising and finding normal probabilities", "detail": "Z = (X − μ)/σ, the standard normal distribution, and using technology to find probabilities or to work backwards from a probability to a value.", "questions": [{"marks": 3, "q": "For X ~ N(70, 8²), find Pr(X > 82) using standardisation, and state the z-score involved.", "answer": ["z = (82 − 70)/8 = 1.5.", "Pr(X > 82) = Pr(Z > 1.5).", "= 1 − 0.9332 = 0.0668, about 6.7%.", "Roughly consistent with the 95% rule: about 2.5% lie beyond z = 2."], "source": "2025 Methods Exam 2, Q12 — working backwards from normal probabilities to the mean."}]}, {"id": "4.11", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Random sampling and the sample proportion", "detail": "Sample proportion p̂ defined as a random variable, and how it varies from sample to sample.", "questions": [{"marks": 3, "q": "Explain what is meant by saying the sample proportion is a random variable, and state the mean and standard deviation of its distribution for samples of size n from a population with proportion p.", "answer": ["Each random sample gives a different value of p̂, so p̂ varies according to a probability distribution.", "Mean of the distribution of p̂ = p.", "Standard deviation = √(p(1 − p)/n).", "Increasing n decreases the standard deviation, so estimates cluster more tightly around p."], "source": "2025 Methods Exam 2, Q8 — a random sample of n households estimating a population proportion."}]}, {"id": "4.12", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "The distribution of sample proportions", "detail": "Mean p and standard deviation √(p(1 − p)/n), and simulating repeated random sampling to see the distribution form.", "questions": [{"marks": 3, "q": "A population has p = 0.4. For samples of size 100, state the mean and standard deviation of the distribution of sample proportions, and describe its shape.", "answer": ["Mean = p = 0.4.", "Standard deviation = √(0.4 × 0.6/100) = √0.0024 = 0.049.", "For large n the distribution of p̂ is approximately normal.", "So about 95% of sample proportions fall within roughly 0.30 to 0.50."]}]}, {"id": "4.13", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Confidence intervals for a population proportion", "detail": "The approximate interval from a large sample, the role of the quantile z, and the 95% interval as the case where z ≈ 1.96.", "questions": [{"marks": 4, "q": "In a sample of 200 voters, 96 support a proposal. Construct an approximate 95% confidence interval for the population proportion.", "answer": ["p̂ = 96/200 = 0.48.", "Standard error = √(0.48 × 0.52/200) = √0.001248 = 0.0353.", "95% interval: 0.48 ± 1.96 × 0.0353 = 0.48 ± 0.0692.", "Interval is (0.411, 0.549)."]}]}, {"id": "4.14", "area": "Area of Study 4 — Data analysis, probability and statistics", "title": "Interpreting a confidence interval", "detail": "What the interval actually claims, how intervals vary between samples, and why a wider interval is not automatically a worse one.", "questions": [{"marks": 3, "q": "A 95% confidence interval for a population proportion is (0.38, 0.46). Explain what this does and does not tell you.", "answer": ["It is a plausible range for the population proportion based on this one sample.", "'95%' refers to the method: about 95% of intervals built this way from repeated samples would capture the true p.", "It does NOT mean there is a 95% probability that p lies in this particular interval — p is fixed, the interval varies.", "A different sample would give a different interval."]}]}, {"id": "5.1", "area": "Across the course — modelling, algorithms and technology", "title": "Algorithm design", "detail": "Sequencing, decision-making and repetition as the building blocks, and representing the ordered steps of a mathematical process.", "questions": [{"marks": 3, "q": "Trace the following and state the values printed in order: n ← 20; k ← 6; while n > k do n ← n − k; print n; end while.", "answer": ["First pass: n = 20 − 6 = 14, print 14. 14 > 6, continue.", "Second pass: n = 8, print 8. 8 > 6, continue.", "Third pass: n = 2, print 2. 2 > 6 is false, loop ends.", "Printed: 14, 8, 2."], "source": "2025 Methods Exam 2, Q7 — tracing a while loop and listing the printed values."}]}, {"id": "5.2", "area": "Across the course — modelling, algorithms and technology", "title": "Pseudocode", "detail": "Reading pseudocode and tracing what it produces, and writing it for a process such as Newton's method or the bisection method.", "questions": [{"marks": 3, "q": "Write pseudocode that repeatedly halves a positive number n until it is less than 1, printing the count of halvings performed.", "answer": ["count ← 0", "while n ≥ 1 do: n ← n/2; count ← count + 1; end while", "print count", "A pre-test loop is correct here — if n < 1 initially, the answer should be 0 halvings."]}]}, {"id": "5.3", "area": "Across the course — modelling, algorithms and technology", "title": "Examples, counter-examples and general cases", "detail": "Their role in working mathematically — a single counter-example disproves, an example never proves.", "questions": [{"marks": 2, "q": "A student claims 'for all real x, x² > x'. Provide a counter-example and explain what a counter-example establishes.", "answer": ["Take x = 0.5: x² = 0.25, which is not greater than 0.5.", "A single counter-example disproves a universal claim.", "No number of supporting examples can prove such a claim — only a general argument can."]}]}, {"id": "5.4", "area": "Across the course — modelling, algorithms and technology", "title": "Exact versus approximate results", "detail": "Recognising which form technology has given you, and rounding to a stated number of decimal places or significant figures.", "questions": [{"marks": 2, "q": "A CAS returns 0.6931472 as the solution of e^x = 2. State the exact solution and explain when an approximate answer is acceptable.", "answer": ["Exact solution: x = log_e(2).", "An approximation is acceptable only when the question asks for a decimal answer, or specifies decimal places or significant figures.", "Exam 1 is technology-free and almost always requires exact form."]}]}, {"id": "5.5", "area": "Across the course — modelling, algorithms and technology", "title": "Domain and range when graphing with technology", "detail": "Setting a window that actually shows the key features, and specifying domain restrictions correctly.", "questions": [{"marks": 2, "q": "A student graphs y = 1/(x − 2) on technology and reports that the graph 'has a vertical line at x = 2'. Explain the error and how to set the graph up correctly.", "answer": ["The near-vertical line is a rendering artefact — the technology joins points either side of the asymptote.", "There is no point on the graph at x = 2; the function is undefined there.", "Set the domain to exclude x = 2, or use a graph style that does not connect across the discontinuity."]}]}, {"id": "5.6", "area": "Across the course — modelling, algorithms and technology", "title": "Parameters and families of functions", "detail": "The role of a parameter in the general form of a function or equation, and generating families of graphs to see its effect.", "questions": [{"marks": 3, "q": "For the family of functions y = a(x − 2)² + 1 where a ∈ R \\ {0}, state which features are fixed and which change as a varies.", "answer": ["Fixed: the turning point is always (2, 1); the axis of symmetry is always x = 2.", "Changes: the width of the parabola, and whether it opens up (a > 0) or down (a < 0).", "Number of x-intercepts changes: none if a > 0, two if a < 0."], "source": "2025 Methods Exam 1, Q9 — solutions depending on a parameter w."}]}, {"id": "5.7", "area": "Across the course — modelling, algorithms and technology", "title": "Numerical, graphical and symbolic forms", "detail": "Linking the three representations of the same function or equation, and matching features across them.", "questions": [{"marks": 3, "q": "A function has a numerical table showing a sign change between x = 1 and x = 2, a graph crossing the x-axis once in that interval, and the rule f(x) = x³ − 3x − 1. Explain how the three representations agree.", "answer": ["The sign change in the table indicates f(a) and f(b) have opposite signs.", "The graph crossing the axis is that same root shown visually.", "The rule can be used with Newton's method or a CAS solver to locate the root numerically.", "All three describe the same fact: a solution of f(x) = 0 lies between 1 and 2."]}]}, {"id": "5.8", "area": "Across the course — modelling, algorithms and technology", "title": "Choosing and justifying CAS functionality", "detail": "Selecting the right tool for the task, applying suitable constraints and conditions, and verifying the result rather than trusting it.", "questions": [{"marks": 2, "q": "A student uses a CAS 'solve' command and obtains an answer of 1.4142136. Explain what has gone wrong if an exact answer was required, and how to obtain one.", "answer": ["The technology has returned a decimal approximation rather than an exact value.", "The exact answer is √2.", "Set the CAS to exact or auto mode, or use an exact-form solve command rather than a numerical solver."]}]}, {"id": "5.9", "area": "Across the course — modelling, algorithms and technology", "title": "Communicating mathematical reasoning", "detail": "Setting out the stages — formulation, solution, interpretation — so the working can be followed, which is what the modelling and problem-solving tasks are marked on.", "questions": [{"marks": 3, "q": "A student writes only '= 24' as their answer to a four-mark problem and receives one mark. Explain what was missing and what a full response requires.", "answer": ["The reasoning is absent — marks are allocated to the stages of the solution, not only the final value.", "Required: the relationship or rule being used, the substitution, the working, then the answer.", "The answer should be stated in context with units where relevant."]}]}], "source": "VCE Mathematics Study Design 2023–2027.", "theme": {"paper": "#e8e8ef", "lift": "#f2f2f8", "ink": "#1f2035", "soft": "#5b5d75", "faint": "#656775", "rule": "#cdcedd", "ruleSoft": "#dcdde8", "accent": "#414a86", "track": "#dcdce5"}, "papers": "VCAA 2023–2026 Methods examinations plus NHT papers, and commercial trial exams, in your Methods folder. Exam 1 is technology-free; Exam 2 is 20 multiple-choice plus extended answer."}, {"id": "physics-34", "name": "Physics", "areas": ["Key science skills", "Unit 3 AoS 1 — Motion in two dimensions", "Unit 3 AoS 2 — Fields", "Unit 3 AoS 3 — Electricity generation", "Unit 4 AoS 1 — Light, matter and relativity", "Unit 4 AoS 2 — Practical investigation"], "short": {"Key science skills": "Skills", "Unit 3 AoS 1 — Motion in two dimensions": "U3 Motion", "Unit 3 AoS 2 — Fields": "U3 Fields", "Unit 3 AoS 3 — Electricity generation": "U3 Generation", "Unit 4 AoS 1 — Light, matter and relativity": "U4 Light, matter, relativity", "Unit 4 AoS 2 — Practical investigation": "U4 Prac"}, "points": [{"id": "S1", "area": "Key science skills", "title": "Aims, questions, hypotheses and predictions", "detail": "Constructing an aim and a research question; identifying the independent, dependent and controlled variables; writing a hypothesis that can actually be tested; predicting possible outcomes.", "questions": [{"marks": 3, "q": "A student investigates how the drop height of a ball affects its rebound height. Write a testable hypothesis and identify the independent and dependent variables.", "answer": ["Hypothesis: as the drop height increases, the rebound height will increase proportionally.", "Independent variable: drop height.", "Dependent variable: rebound height.", "A hypothesis must be a testable prediction about the relationship, not a question or an aim."]}]}, {"id": "S2", "area": "Key science skills", "title": "Investigation methodologies", "detail": "Case study, classification and identification, experiment, fieldwork, literature review, modelling, product/process/system development, simulation. Be able to name the right one for a described investigation and justify it.", "questions": [{"marks": 1, "q": "A student measures the extension of a spring for a range of applied loads to find the spring constant. The methodology used is best described as", "options": ["a correlational study.", "a controlled experiment.", "modelling.", "a case study."], "answer": ["B — a controlled experiment.", "The independent variable (load) is deliberately manipulated and the dependent variable measured.", "A correlational study looks for a relationship without manipulating anything."]}], "card": {"key": "A0", "title": "Investigation methodologies", "front": "Name the methodologies and pick the right one for a described investigation.", "back": ["Controlled experiment — manipulate an IV, measure a DV", "Correlational study — look for a relationship without manipulating anything", "Modelling and simulation — represent a system you can't test directly", "Fieldwork, case study, classification and identification", "Literature review, product/process/system development", "Justify by what the investigation actually does, not what it's about"]}}, {"id": "S3", "area": "Key science skills", "title": "Generating and recording data", "detail": "Primary vs secondary data, qualitative vs quantitative, the logbook as authentication, and organising results into tables and graphs that follow the conventions.", "questions": [{"marks": 3, "q": "Distinguish primary from secondary data and explain the role of the logbook in a VCE physics investigation.", "answer": ["Primary data is generated by the student through their own measurements.", "Secondary data is obtained from another source — published results, databases, textbooks.", "The logbook records measurements as they are taken, with dates and conditions.", "It authenticates the data as the student's own work and provides a record for evaluating the method."]}]}, {"id": "S4", "area": "Key science skills", "title": "Measurement terms", "detail": "True value, uncertainty, accuracy, precision, repeatability, reproducibility, resolution, validity. The study design defines each of these tightly and the exam tests the distinctions — especially accuracy vs precision, and repeatability vs reproducibility.", "questions": [{"marks": 4, "q": "A group's five measurements of g are 9.79, 9.80, 9.79, 9.81 and 9.80 m s⁻². The accepted value is 9.80. Comment on the accuracy and precision of the results, and define both terms.", "answer": ["Accuracy: how close a measurement is to the true value. The mean is 9.798, so the results are accurate.", "Precision: how close repeated measurements are to each other. The spread is 0.02, so they are precise.", "These are independent — a set can be precise but inaccurate if a systematic error is present.", "Repeatability refers to the same person and equipment; reproducibility to a different person or setup."]}]}, {"id": "S5", "area": "Key science skills", "title": "Errors and uncertainty", "detail": "Random error affects precision and shows as a spread; systematic error shifts every reading the same way and comes from the instrument, its calibration or the method (including parallax). Repeating readings reduces random error only. Mistakes are repeated correctly, not reported. Uncertainty as mean ± value, and as uncertainty bars on a graph.", "questions": [{"marks": 4, "q": "A student's five timing measurements are 2.31, 2.28, 2.33, 2.30 and 2.32 s. The stopwatch was later found to start 0.15 s late every time. Identify the type of error this represents, state its effect on accuracy and precision, and explain whether repeating the measurements would help.", "answer": ["A systematic error — it shifts every reading by the same amount in the same direction.", "Accuracy is affected: all readings are 0.15 s too low relative to the true value.", "Precision is unaffected: the readings are still tightly clustered.", "Repeating does not help — averaging reduces random error only. The instrument must be corrected or the offset subtracted."]}], "card": {"key": "A1", "title": "Errors and uncertainty", "front": "Random vs systematic error — what fixes each?", "back": ["Random error — scatter around the true value; affects PRECISION", "Reduce it by repeating measurements and averaging", "Systematic error — shifts every reading the same way; affects ACCURACY", "Causes: mis-calibrated instrument, zero offset, parallax, flawed method", "Repeating does NOT reduce systematic error", "A mistake is not an error — it's excluded, not reported"]}}, {"id": "S6", "area": "Key science skills", "title": "Significant figures and graphing conventions", "detail": "The sig fig rules, including leading and trailing zeros. Axes labelled with units and powers of ten, independent variable horizontal, a smooth trend line, extrapolation shown dashed. Linearising a graph and saying what its gradient physically means.", "questions": [{"marks": 3, "q": "A student calculates 4.56 × 2.1 and writes 9.576. State the correct answer to the appropriate number of significant figures and explain the rule.", "answer": ["2.1 has two significant figures; 4.56 has three.", "For multiplication, the answer carries the number of significant figures of the least precise value.", "Correct answer: 9.6.", "Reporting extra digits implies a precision the measurements do not support."]}]}, {"id": "S7", "area": "Key science skills", "title": "Outliers and data quality", "detail": "Identifying outliers and accounting for them rather than quietly dropping them, which is an ethical as well as a technical point. Recognising contradictory, provisional or incomplete data.", "questions": [{"marks": 3, "q": "In a set of eight readings, one value sits far from the trend line while the other seven cluster tightly. Explain what the student should do and why simply deleting the value is poor practice.", "answer": ["Identify it as a possible outlier and check the logbook for a recorded cause — a misread scale, a disturbed setup, a transcription slip.", "If a cause is found, exclude it and state the reason explicitly in the report.", "If no cause is found, report it and discuss it rather than removing it.", "Silently deleting inconvenient data is unethical and can hide a real effect."]}]}, {"id": "S8", "area": "Key science skills", "title": "Conclusions and their limitations", "detail": "Distinguishing evidence from opinion, judging how far the data supports or refutes the hypothesis, stating the limitations of a conclusion and what further evidence would be needed.", "questions": [{"marks": 3, "q": "A student concludes: 'The results prove that resistance always increases with temperature for all materials.' Identify two problems with this conclusion and write an improved version.", "answer": ["'Prove' overstates it — data supports or is consistent with a hypothesis, it does not prove it.", "'All materials' extends beyond the range investigated; only the material tested can be commented on.", "Improved: 'The data supports the hypothesis that the resistance of this wire increases with temperature over the range 20–80 °C.'"]}], "card": {"key": "A2", "title": "Conclusions and their limitations", "front": "What can a conclusion legitimately claim?", "back": ["State whether the data supports or refutes the hypothesis — nothing more", "No new information in a conclusion", "Limitations: range tested, sample size, assumptions made, uncontrolled variables", "Correlation in the data does not establish causation", "Say what further evidence would be needed"]}}, {"id": "3.1.1", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Newton's three laws in one and two dimensions", "detail": "Two or more coplanar forces acting along a straight line and in two dimensions. Resolving forces into components, force diagrams, and the 'force on A by B' convention. Normal force and friction as the readily observable forces.", "questions": [{"marks": 4, "q": "A 5.0 kg box sits on a horizontal surface and is pulled by a 30 N force at 40° above the horizontal. Calculate the horizontal and vertical components of the applied force and the normal force acting on the box. Take g = 9.8 m s⁻².", "answer": ["Horizontal component: 30 cos(40°) = 23.0 N.", "Vertical component: 30 sin(40°) = 19.3 N, directed upward.", "Weight = 5.0 × 9.8 = 49 N downward.", "Normal force = 49 − 19.3 = 29.7 N — the upward pull reduces it below the weight."]}]}, {"id": "3.1.2", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Uniform circular motion in a horizontal plane", "detail": "Fnet = mv²/r applied to a vehicle on a flat circular road, a vehicle on a banked track, and an object on the end of a string. The key skill is identifying which force actually supplies the centripetal force in each case.", "questions": [{"marks": 4, "q": "A 900 kg car rounds a flat circular bend of radius 50 m at 15 m s⁻¹. Calculate the net force required and identify which force supplies it.", "answer": ["Fnet = mv²/r = 900 × 225 / 50", "= 202 500 / 50 = 4050 N, directed toward the centre of the bend.", "Friction between the tyres and the road supplies the centripetal force.", "If the required force exceeds the maximum friction available, the car skids outward."]}]}, {"id": "3.1.3", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Satellite motion as uniform circular motion", "detail": "Modelling natural and artificial satellites — moons, planets, orbiting spacecraft — as objects in uniform circular orbit.", "questions": [{"marks": 3, "q": "Explain why a satellite in a stable circular orbit is accelerating even though its speed is constant.", "answer": ["Acceleration is the rate of change of velocity, and velocity is a vector.", "The direction of motion changes continuously, so the velocity changes even at constant speed.", "The acceleration is centripetal — directed toward the centre of the orbit.", "Gravity provides the force producing this acceleration."]}]}, {"id": "3.1.4", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Circular motion in a vertical plane", "detail": "Newton's second law at the highest and lowest positions only. Apparent weight at the top and bottom of a loop, and the minimum speed to maintain contact at the top.", "questions": [{"marks": 4, "q": "A 0.50 kg ball on a string of length 1.2 m is swung in a vertical circle. At the highest point the ball travels at 4.0 m s⁻¹. Calculate the tension in the string at that point. Take g = 9.8 m s⁻².", "answer": ["At the top, both tension and weight point toward the centre (downward).", "T + mg = mv²/r", "mv²/r = 0.50 × 16 / 1.2 = 6.67 N; mg = 0.50 × 9.8 = 4.9 N", "T = 6.67 − 4.9 = 1.8 N (2 significant figures)."]}], "card": {"key": "A3", "title": "Circular motion in a vertical plane", "front": "Set up Newton's second law at the top and the bottom of a vertical loop.", "back": ["Net force always points to the centre: Fnet = mv²/r", "At the TOP, both weight and normal force point down: N + mg = mv²/r", "At the BOTTOM, they oppose: N − mg = mv²/r, so N is largest here", "Apparent weight is N, not mg — heaviest at the bottom, lightest at the top", "Minimum speed to keep contact at the top is when N = 0, so v = √(gr)"]}}, {"id": "3.1.5", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Projectile motion near Earth's surface", "detail": "Horizontal and vertical components treated independently — constant horizontal velocity, vertical acceleration g. Plus a qualitative description of how air resistance changes the trajectory, range and speed.", "questions": [{"marks": 4, "q": "A ball is launched horizontally at 12 m s⁻¹ from a 20 m high cliff. Calculate the time of flight and the horizontal range, ignoring air resistance. Take g = 9.8 m s⁻².", "answer": ["Vertical: 20 = ½(9.8)t², so t² = 40/9.8 = 4.08.", "t = 2.02 s.", "Horizontal velocity is constant: range = 12 × 2.02 = 24 m.", "The components are independent — the horizontal speed does not affect the time of fall."]}]}, {"id": "3.1.6", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Conservation of energy and momentum", "detail": "Applied to isolated systems in one dimension, theoretically and practically.", "questions": [{"marks": 4, "q": "A 2.0 kg trolley moving at 3.0 m s⁻¹ collides with a stationary 4.0 kg trolley and they move off together. Calculate their common velocity and the kinetic energy lost.", "answer": ["Momentum before = 2.0 × 3.0 = 6.0 kg m s⁻¹.", "After: 6.0 = (2.0 + 4.0)v, so v = 1.0 m s⁻¹.", "KE before = ½(2.0)(9.0) = 9.0 J. KE after = ½(6.0)(1.0) = 3.0 J.", "Kinetic energy lost = 6.0 J, converted to heat, sound and deformation."]}]}, {"id": "3.1.7", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Impulse in an isolated system", "detail": "FΔt = mΔv for collisions between objects moving in a straight line, and impulse as the area under a force–time graph. Typically applied to vehicle safety — crumple zones extend Δt to reduce the force.", "questions": [{"marks": 3, "q": "A 1200 kg car travelling at 15 m s⁻¹ strikes a barrier and stops in 0.40 s. Calculate the average force on the car, and explain how a crumple zone reduces this force.", "answer": ["Impulse = Δp = mΔv = 1200 × 15 = 1.8 × 10⁴ kg m s⁻¹.", "F = Δp/Δt = 1.8 × 10⁴ / 0.40 = 4.5 × 10⁴ N.", "A crumple zone increases the collision time Δt.", "Δp is fixed by the mass and speed, so a larger Δt gives a smaller average force."]}], "card": {"key": "A4", "title": "Impulse in an isolated system", "front": "Define impulse and connect it to vehicle safety.", "back": ["Impulse = FΔt = change in momentum = mΔv", "Impulse is the area under a force–time graph", "For a given collision, Δp is fixed by the masses and velocities", "Extending Δt therefore reduces the peak force", "Crumple zones, airbags and seatbelts all extend Δt", "Momentum is conserved in every collision in an isolated system"]}}, {"id": "3.1.8", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Work done by a force", "detail": "Work as force × distance moved in the direction of the net force, and as the area under a force–distance graph (one dimension only).", "questions": [{"marks": 3, "q": "A satellite moves in a uniform circular orbit. Explain, with reference to the definition of work, why the gravitational force does no work on the satellite.", "answer": ["Work is the product of force and displacement in the direction of that force.", "In uniform circular motion the gravitational force acts toward the centre.", "The velocity, and so the displacement, is always tangential — perpendicular to the force.", "There is no displacement component along the force, so zero work is done and the speed is constant."]}], "card": {"key": "A5", "title": "Work done by a force", "front": "Define work and say when a force does none.", "back": ["W = Fs, using the component of force along the displacement", "Work is the area under a force–distance graph", "A force perpendicular to the motion does zero work", "That's why the centripetal force in circular motion does no work", "Work done against gravity becomes gravitational potential energy", "Measured in joules; it is a scalar"]}}, {"id": "3.1.9", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Kinetic energy and collisions", "detail": "Ek = ½mv² at low speeds. Distinguishing elastic from inelastic collisions by whether kinetic energy is conserved — momentum is conserved in both.", "questions": [{"marks": 3, "q": "Explain the difference between an elastic and an inelastic collision, and state which quantity is conserved in both.", "answer": ["In an elastic collision, total kinetic energy is conserved.", "In an inelastic collision, some kinetic energy is converted to heat, sound or deformation.", "Momentum is conserved in both, provided the system is isolated.", "A perfectly inelastic collision is one where the objects move off together."]}]}, {"id": "3.1.10", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Elastic potential energy", "detail": "Area under a force–distance graph, and Es = ½kΔx² for ideal springs obeying Hooke's law.", "questions": [{"marks": 3, "q": "A spring obeying Hooke's law with k = 250 N m⁻¹ is compressed by 0.080 m. Calculate the elastic potential energy stored, and state how this appears on a force–distance graph.", "answer": ["Es = ½kΔx² = ½(250)(0.080)²", "= 0.5 × 250 × 0.0064 = 0.80 J.", "On a force–distance graph the stored energy is the area under the line.", "For an ideal spring the graph is a straight line through the origin, so the area is a triangle."]}]}, {"id": "3.1.11", "area": "Unit 3 AoS 1 — Motion in two dimensions", "title": "Gravitational potential energy", "detail": "Eg = mgΔh near Earth's surface, or from the area under a force–distance graph, or the area under a field–distance graph multiplied by mass. Energy dissipated to the environment counts as heat, sound and deformation.", "questions": [{"marks": 3, "q": "A 60 kg student climbs stairs of vertical height 4.5 m. Calculate the gain in gravitational potential energy, and explain why the horizontal distance travelled is irrelevant. Take g = 9.8 m s⁻².", "answer": ["Eg = mgΔh = 60 × 9.8 × 4.5 = 2646 J, about 2.6 kJ.", "Gravity acts vertically, so only vertical displacement is in the direction of the force.", "Horizontal movement is perpendicular to gravity and so involves no work against it."]}]}, {"id": "3.2.1", "area": "Unit 3 AoS 2 — Fields", "title": "The field model", "detail": "Describing gravitation, magnetism and electricity using a field model — how a field explains interaction without contact.", "questions": [{"marks": 2, "q": "Explain what is meant by a field in physics and why the field model is needed.", "answer": ["A field is a region in which an object experiences a force without physical contact.", "It assigns a force-per-unit-property at every point in space.", "It is needed to explain action at a distance — gravity, magnetism and electrostatic interaction all act without touching."]}], "card": {"key": "A6", "title": "The field model and comparing fields", "front": "Compare gravitational, electric and magnetic fields.", "back": ["A field explains action at a distance without contact", "Gravitational — always attractive, monopoles only, acts on mass", "Electric — attractive or repulsive, monopoles exist, acts on charge", "Magnetic — attractive or repulsive, NO monopoles, always a dipole", "All three follow inverse square behaviour for point sources", "Field lines show direction; spacing shows strength"]}}, {"id": "3.2.2", "area": "Unit 3 AoS 2 — Fields", "title": "Comparing gravitational, magnetic and electric fields", "detail": "Directions and shapes, attractive and repulsive fields, and the existence of dipoles and monopoles. Gravity only attracts; magnetic monopoles don't exist. This comparison is a standard exam question.", "questions": [{"marks": 3, "q": "Compare gravitational, electric and magnetic fields in terms of the property they act on, whether they can repel, and the existence of monopoles.", "answer": ["Gravitational: acts on mass, only ever attractive, monopoles exist (a single mass).", "Electric: acts on charge, attractive or repulsive, monopoles exist (a single charge).", "Magnetic: acts on moving charge or magnetic material, attractive or repulsive, NO monopoles — always a dipole.", "All three follow an inverse square relationship for point sources."]}], "card": {"key": "A6", "title": "The field model and comparing fields", "front": "Compare gravitational, electric and magnetic fields.", "back": ["A field explains action at a distance without contact", "Gravitational — always attractive, monopoles only, acts on mass", "Electric — attractive or repulsive, monopoles exist, acts on charge", "Magnetic — attractive or repulsive, NO monopoles, always a dipole", "All three follow inverse square behaviour for point sources", "Field lines show direction; spacing shows strength"]}}, {"id": "3.2.3", "area": "Unit 3 AoS 2 — Fields", "title": "Fields about a point mass or charge", "detail": "Direction and shape of the field, the inverse square law for its magnitude, and the qualitative potential energy change when a mass or charge moves within it.", "questions": [{"marks": 3, "q": "A point charge +Q produces an electric field. At a distance r the field strength is E. Determine the field strength at 3r, and sketch the shape and direction of the field lines around the charge.", "answer": ["E/9 — the field follows an inverse square law, so tripling r divides the field by 9.", "Field lines are radial, pointing away from a positive charge.", "Lines are closer together near the charge, showing the stronger field there.", "Field lines never cross."]}], "card": {"key": "R0", "title": "Fields about a point mass or charge", "front": "Sketch and describe the field around a point mass and a point charge.", "back": ["Radial field lines — into a mass, out of a positive charge, into a negative one", "Magnitude follows an inverse square law: g = GM/r², E = kQ/r²", "Lines closer together = stronger field; they never cross", "Moving a mass away from M increases gravitational PE", "Moving a like charge closer increases electric PE"]}}, {"id": "3.2.4", "area": "Unit 3 AoS 2 — Fields", "title": "Magnetic fields from currents", "detail": "Shapes and directions of the fields produced by bar magnets and by current-carrying wires, loops and solenoids. The right-hand rules.", "questions": [{"marks": 2, "q": "A current flows vertically upward through a straight wire. Describe the shape and direction of the magnetic field produced, and name the rule used.", "answer": ["Concentric circles in horizontal planes around the wire.", "Viewed from above, the field circulates anticlockwise.", "Right-hand grip rule: thumb points along conventional current, fingers curl in the direction of B."]}], "card": {"key": "R1", "title": "Magnetic fields from currents", "front": "Draw the field around a wire, a loop and a solenoid, and give the hand rule.", "back": ["Straight wire — concentric circles around the wire", "Right-hand grip: thumb along conventional current, fingers curl the field", "Loop — field lines concentrate through the centre of the loop", "Solenoid — uniform field inside, like a bar magnet outside", "Solenoid rule: fingers curl with the current, thumb points to the north end", "Bar magnet — lines leave N, enter S, continue S to N inside the magnet"]}}, {"id": "3.2.5", "area": "Unit 3 AoS 2 — Fields", "title": "Classifying fields", "detail": "Identifying a field as static or changing, and as uniform or non-uniform.", "questions": [{"marks": 3, "q": "Classify each as uniform or non-uniform and as static or changing: the field between charged parallel plates connected to a steady supply; the field around a bar magnet; the field inside a solenoid carrying AC.", "answer": ["Between parallel plates on a steady supply — uniform and static.", "Around a bar magnet — non-uniform and static.", "Inside a solenoid on AC — approximately uniform but changing.", "Uniform means the same magnitude and direction throughout; static means unchanging in time."]}]}, {"id": "3.2.6", "area": "Unit 3 AoS 2 — Fields", "title": "Electric field and electric force", "detail": "E = kQ/r² and F = kq₁q₂/r² for point charges.", "questions": [{"marks": 3, "q": "Two point charges of +2.0 μC and −3.0 μC are held 0.20 m apart. Calculate the magnitude of the force between them and state whether it is attractive or repulsive. Take k = 8.99 × 10⁹ N m² C⁻².", "answer": ["F = kq₁q₂/r²", "F = 8.99 × 10⁹ × (2.0 × 10⁻⁶)(3.0 × 10⁻⁶) / (0.20)²", "F = 8.99 × 10⁹ × 6.0 × 10⁻¹² / 0.040 = 1.3 N", "Attractive — the charges are unlike."]}], "card": {"key": "A7", "title": "Electric field and electric force", "front": "Give the two point-charge relationships and how they connect.", "back": ["Field of a point charge: E = kQ/r²", "Force between two point charges: F = kq₁q₂/r²", "The two are linked by F = qE", "Field direction is the force on a POSITIVE test charge", "Like charges repel, unlike attract"]}}, {"id": "3.2.7", "area": "Unit 3 AoS 2 — Fields", "title": "Accelerating a charge in a uniform electric field", "detail": "Potential energy changes W = qV, the field between parallel plates E = V/d, and the force on a charge F = qE.", "questions": [{"marks": 4, "q": "An electron is accelerated from rest through a potential difference of 500 V between parallel plates 0.020 m apart. Calculate the field strength between the plates and the speed of the electron on arrival. Take e = 1.6 × 10⁻¹⁹ C, mₑ = 9.1 × 10⁻³¹ kg.", "answer": ["E = V/d = 500 / 0.020 = 2.5 × 10⁴ V m⁻¹.", "Work done W = qV = 1.6 × 10⁻¹⁹ × 500 = 8.0 × 10⁻¹⁷ J.", "All of this becomes kinetic energy: ½mv² = 8.0 × 10⁻¹⁷", "v = √(2 × 8.0 × 10⁻¹⁷ / 9.1 × 10⁻³¹) = 1.3 × 10⁷ m s⁻¹."]}], "card": {"key": "A8", "title": "Accelerating a charge in a uniform field", "front": "Give the three relationships for parallel plates.", "back": ["Uniform field between plates: E = V/d", "Force on a charge in that field: F = qE", "Work done accelerating it: W = qV, which becomes kinetic energy", "So qV = ½mv² gives the exit speed", "Field lines are straight, evenly spaced, from positive plate to negative"]}}, {"id": "3.2.8", "area": "Unit 3 AoS 2 — Fields", "title": "Magnetic force on a charged particle", "detail": "F = qvB where v and B are perpendicular or parallel, with direction from the right-hand rule. The radius of the circular path from qvB = mv²/r, for v much less than c.", "questions": [{"marks": 3, "q": "A proton enters a uniform magnetic field with its velocity perpendicular to the field. Explain why it follows a circular path at constant speed, and state how the radius would change if its speed were doubled.", "answer": ["The magnetic force F = qvB is always perpendicular to the velocity.", "A force perpendicular to motion changes direction but does no work, so the speed is constant.", "That constant perpendicular force provides the centripetal force, giving a circular path.", "r = mv/qB, so doubling v doubles the radius."]}], "card": {"key": "A9", "title": "Magnetic force on a charged particle", "front": "When does a magnetic field exert a force, and what path results?", "back": ["F = qvB when v is perpendicular to B", "Zero force when v is parallel to B — no component across the field", "Direction from the right-hand rule; reverse it for a negative charge", "The force is always perpendicular to v, so speed never changes", "Circular path with qvB = mv²/r, giving r = mv/qB", "Valid for v much less than c"]}}, {"id": "3.2.9", "area": "Unit 3 AoS 2 — Fields", "title": "Gravitational field and gravitational force", "detail": "g = GM/r², Fg = Gm₁m₂/r², and Eg = mgΔh for potential energy changes in a uniform gravitational field.", "questions": [{"marks": 3, "q": "Calculate the gravitational field strength at the surface of a planet of mass 6.0 × 10²⁴ kg and radius 6.4 × 10⁶ m. Take G = 6.67 × 10⁻¹¹ N m² kg⁻².", "answer": ["g = GM/r²", "g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ / (6.4 × 10⁶)²", "g = 4.00 × 10¹⁴ / 4.1 × 10¹³", "g = 9.8 N kg⁻¹ (or m s⁻²)."]}], "card": {"key": "A10", "title": "Gravity, normal force and apparent weight", "front": "Distinguish weight from apparent weight, and explain orbital 'weightlessness'.", "back": ["Field strength g = GM/r²; force Fg = Gm₁m₂/r²", "Near the surface, PE change = mgΔh in a uniform field", "Weight is the gravitational force; apparent weight is the normal force N", "In orbit gravity is the only force, so N = 0 and apparent weight is zero", "The astronaut is NOT weightless — gravity is what holds the orbit", "They are in continuous free fall around the Earth"]}}, {"id": "3.2.10", "area": "Unit 3 AoS 2 — Fields", "title": "Gravitational potential energy from graphs", "detail": "The change in gravitational potential energy as the area under a force vs distance graph, and as the area under a field vs distance graph multiplied by mass.", "questions": [{"marks": 3, "q": "A graph of gravitational field strength against distance is given for a planet. Explain how to obtain the change in gravitational potential energy of a 500 kg satellite moving between two altitudes.", "answer": ["Find the area under the field–distance graph between the two distances.", "That area gives the energy change per unit mass.", "Multiply by the mass: ΔEg = area × 500.", "Equivalently, the area under a force–distance graph gives the energy change directly."]}]}, {"id": "3.2.11", "area": "Unit 3 AoS 2 — Fields", "title": "Force due to gravity and normal force", "detail": "Applying Fg and FN, including to satellites in orbit where the orbit is assumed uniform and circular. Apparent weight, and why an orbiting astronaut is not weightless.", "questions": [{"marks": 3, "q": "An astronaut aboard a space station in low Earth orbit appears to float. Explain why the astronaut is not weightless, using the terms weight and apparent weight.", "answer": ["Weight is the gravitational force, which is still substantial in low Earth orbit — it is what keeps the station in orbit.", "Apparent weight is the normal force from the surroundings.", "In orbit gravity is the only force acting, so there is no normal force and apparent weight is zero.", "The astronaut and station are both in continuous free fall around the Earth."]}], "card": {"key": "A10", "title": "Gravity, normal force and apparent weight", "front": "Distinguish weight from apparent weight, and explain orbital 'weightlessness'.", "back": ["Field strength g = GM/r²; force Fg = Gm₁m₂/r²", "Near the surface, PE change = mgΔh in a uniform field", "Weight is the gravitational force; apparent weight is the normal force N", "In orbit gravity is the only force, so N = 0 and apparent weight is zero", "The astronaut is NOT weightless — gravity is what holds the orbit", "They are in continuous free fall around the Earth"]}}, {"id": "3.2.12", "area": "Unit 3 AoS 2 — Fields", "title": "Modelling satellite motion", "detail": "a = v²/r = 4π²r/T² for artificial satellites, the Moon and planets. Relating period to orbital radius, and geostationary orbits.", "questions": [{"marks": 4, "q": "A satellite orbits at radius 8.0 × 10⁶ m with a period of 7200 s. Calculate its orbital speed and centripetal acceleration.", "answer": ["Circumference = 2πr = 2π × 8.0 × 10⁶ = 5.03 × 10⁷ m.", "v = 5.03 × 10⁷ / 7200 = 6.98 × 10³ m s⁻¹.", "a = v²/r = (6.98 × 10³)² / 8.0 × 10⁶ = 4.87 × 10⁷ / 8.0 × 10⁶", "a = 6.1 m s⁻². Alternatively a = 4π²r/T² gives the same result."]}]}, {"id": "3.2.13", "area": "Unit 3 AoS 2 — Fields", "title": "Interaction of two fields", "detail": "Electric charges, magnetic poles and current-carrying conductors can attract or repel; masses only ever attract.", "questions": [{"marks": 2, "q": "Two long parallel wires carry current in the same direction. State whether they attract or repel and explain using the field of one wire acting on the other.", "answer": ["They attract.", "The first wire's mag
