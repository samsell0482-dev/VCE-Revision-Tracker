<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216">
<title>VCE Units 3 &amp; 4 revision tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="theme-glass">
/* ─────────────────────────────────────────────────────────────
   GLASS  ·  VARIANCE 7 / MOTION 6 / DENSITY 4
   Web frosted-glass approximation (backdrop-filter + layered
   borders + highlight). Not Apple Liquid Glass, which is an
   Apple-platform material with no public web package.
   Radius rule: surfaces 20 · pills 999 · rating boxes 14.
   One accent per page = the subject you are inside.
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme:light dark;
  --paper:#eef0f3; --paper-deep:#e4e7ec;
  --ink:#151a20; --ink-soft:#4d565f; --ink-faint:#5e6873;
  --rule:rgba(21,26,32,.13); --rule-soft:rgba(21,26,32,.07);
  --track:rgba(21,26,32,.10);
  --accent:#3f4f4a;

  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.76);
  --edge:rgba(255,255,255,.85);
  --edge-low:rgba(255,255,255,.45);
  --shade:rgba(24,32,45,.10);
  --shade-deep:rgba(24,32,45,.16);

  --red:#bc4430; --amber:#d39b2c; --green:#1e5c52;
  --on-red:#fff; --on-amber:#1b2a27; --on-green:#fff;
  --red-ink:#9c3322; --amber-ink:#7d5410; --green-ink:#17504a;

  --focus:var(--accent);
  --gutter:104px;
  --r-surface:20px; --r-pill:999px; --r-box:14px;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-spring:cubic-bezier(.34,1.42,.48,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0f1216; --paper-deep:#0a0c0f;
    --ink:#e9edf1; --ink-soft:#a3aeb9; --ink-faint:#8d98a3;
    --rule:rgba(255,255,255,.14); --rule-soft:rgba(255,255,255,.07);
    --track:rgba(255,255,255,.09);
    --accent:#8fa39c;

    --glass:rgba(255,255,255,.055);
    --glass-strong:rgba(255,255,255,.085);
    --edge:rgba(255,255,255,.20);
    --edge-low:rgba(255,255,255,.09);
    --shade:rgba(0,0,0,.34);
    --shade-deep:rgba(0,0,0,.48);

    --red:#e0765c; --amber:#edc266; --green:#54b39a;
    --on-red:#120906; --on-amber:#150f04; --on-green:#03130f;
    --red-ink:#eb9077; --amber-ink:#edc266; --green-ink:#6cc4ab;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{
  margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;
  transition:background-color 380ms var(--ease-in-out),color 380ms var(--ease-in-out);
}
/* the field the glass sits on: two soft accent washes, fixed so nothing repaints on scroll */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(62% 48% at 10% 0%, color-mix(in srgb,var(--accent) 38%,transparent), transparent 72%),
    radial-gradient(58% 46% at 94% 20%, color-mix(in srgb,var(--accent) 24%,transparent), transparent 70%),
    linear-gradient(180deg,transparent 40%,var(--paper-deep));
  transition:background 420ms var(--ease-in-out);
}
.wrap{max-width:1080px;margin:0 auto;
  padding:0 max(22px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
button,[role="button"]{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}

/* ── the glass surface, used by every panel ── */
.pane{
  position:relative;isolation:isolate;border-radius:var(--r-surface);
  background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 1px 2px var(--shade), 0 16px 40px -22px var(--shade-deep);
}
@media (prefers-reduced-transparency:reduce){
  .pane{background:var(--glass-strong);backdrop-filter:none;-webkit-backdrop-filter:none}
}

/* ── masthead: asymmetric split, not centred ── */
.masthead{padding:76px 0 14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:end}
#subject-view .masthead{padding:14px 0 10px;display:block}
h1{font-size:clamp(38px,5.6vw,66px);font-weight:600;line-height:1.02;letter-spacing:-.035em;margin:0}
#subject-title{font-size:clamp(32px,4.6vw,50px)}
.standfirst{grid-column:1;margin:18px 0 0;max-width:42ch;color:var(--ink-soft);font-size:16px}

.backlink{background:none;border:0;padding:9px 16px 9px 13px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-soft);
  display:inline-flex;gap:8px;align-items:center;margin-top:34px;border-radius:var(--r-pill);
  background:var(--glass);border:1px solid var(--edge-low);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 var(--edge);
  transition:color 180ms var(--ease-out),transform 180ms var(--ease-spring),box-shadow 180ms var(--ease-out)}
.backlink:active{transform:scale(.96)}
.backlink:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* ── bars ── */
.bar{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--track)}
.totals .bar{height:14px}
.mini .bar{height:9px}
.seg{height:100%}
.seg[data-s="3"]{background:var(--green)}
.seg[data-s="2"]{background:var(--amber)}
.seg[data-s="1"]{background:var(--red)}
@media (prefers-reduced-motion:no-preference){.seg{transition:width 420ms var(--ease-out)}}

/* ── totals panel: the right half of the split hero ── */
.totals{grid-column:2;grid-row:1 / span 2;align-self:stretch;padding:24px 24px 20px;margin:0;
  border-radius:var(--r-surface);background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 1px 2px var(--shade), 0 16px 40px -22px var(--shade-deep)}
@media (prefers-reduced-transparency:reduce){.totals{background:var(--glass-strong);backdrop-filter:none}}
.totals-row{display:grid;grid-template-columns:22px 1fr 96px;gap:13px;align-items:center;margin-bottom:11px}
.totals-row:last-child{margin-bottom:0}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.count{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.count b{font-weight:600;color:var(--ink)}

/* ── legend: the colour key, doubles as the instructions ── */
.legend-key{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule-soft)}
.key{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);
  padding:5px 11px 5px 7px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--edge-low)}
.key i{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.key[data-s="1"] i{background:var(--red)}
.key[data-s="2"] i{background:var(--amber)}
.key[data-s="3"] i{background:var(--green)}

.section-label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin:52px 0 14px}

/* ── subject bento: 5 items, 5 cells, first one is the feature ── */
#subject-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#subject-list .subject:first-child{grid-column:1 / -1}
.subject{width:100%;text-align:left;border:1px solid var(--edge-low);padding:22px 22px 20px;font:inherit;color:inherit;
  border-radius:var(--r-surface);background:var(--glass);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 1px 2px var(--shade), 0 16px 40px -22px var(--shade-deep);
  display:grid;gap:18px;align-content:start;
  transition:transform 320ms var(--ease-spring),box-shadow 320ms var(--ease-out),border-color 320ms var(--ease-out)}
#subject-list .subject:first-child{grid-template-columns:1fr minmax(0,320px);align-items:center;gap:30px}
@media (prefers-reduced-transparency:reduce){.subject{background:var(--glass-strong);backdrop-filter:none}}
.subject:active{transform:scale(.988)}
.subject:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.subject h2{font-size:22px;font-weight:600;margin:0 0 5px;letter-spacing:-.022em;display:flex;align-items:center;gap:10px}
#subject-list .subject:first-child h2{font-size:29px}
.subject .dot{display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--swatch,var(--accent));flex:0 0 auto}
.subject .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.minis{display:flex;flex-direction:column;gap:7px}
.mini{display:grid;grid-template-columns:11px 1fr;gap:10px;align-items:center}
.mini span{font-family:var(--mono);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

/* ── map ── */
.map{padding:20px 22px 16px;margin-top:20px;border-radius:var(--r-surface);
  background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 1px 2px var(--shade), 0 16px 40px -22px var(--shade-deep)}
@media (prefers-reduced-transparency:reduce){.map{background:var(--glass-strong);backdrop-filter:none}}
.map-row{display:grid;grid-template-columns:22px 1fr 112px;gap:13px;align-items:center;margin-bottom:6px}
.map-groups{display:flex;gap:10px}
.map-group{display:flex;gap:2px}
.cell{position:relative;flex:1 1 0;height:18px;min-width:3px;padding:0;border:0;border-radius:4px;background:var(--track);
  animation:bloom 460ms var(--ease-spring) backwards}
.cell::after{content:"";position:absolute;inset:-5px -1px}
@keyframes bloom{from{opacity:0;transform:scale(.55) translateY(3px)}}
@keyframes beat{50%{transform:scaleY(1.5)}}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px;z-index:1}
.cell[data-state="1"]{background:var(--red)}
.cell[data-state="2"]{background:var(--amber)}
.cell[data-state="3"]{background:var(--green)}
.cell.beat{animation:beat 400ms var(--ease-out)}
.map-legend{display:grid;grid-template-columns:22px 1fr 112px;gap:13px;margin-top:10px}
.legend-groups{display:flex;gap:10px}
.legend-groups span{font-size:10px;letter-spacing:.02em;color:var(--ink-faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-top:1px solid var(--rule-soft);padding-top:6px}
.readout{margin:14px 0 0;min-height:1.5em;font-size:13px;color:var(--ink-soft)}
.readout b{font-weight:600;color:var(--ink)}

/* ── pass breakdown ── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{padding:14px 15px 13px;border-radius:16px;background:var(--glass);border:1px solid var(--edge-low);
  box-shadow:inset 0 1px 0 var(--edge)}
.stat-n{display:block;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat[data-s="3"] .stat-n{color:var(--green-ink)}
.stat[data-s="2"] .stat-n{color:var(--amber-ink)}
.stat[data-s="1"] .stat-n{color:var(--red-ink)}
.stat[data-s="0"] .stat-n{color:var(--ink-faint)}
.stat-k{display:block;margin-top:7px;font-size:11.5px;line-height:1.35;color:var(--ink-soft)}

/* ── controls ── */
.controls{position:sticky;top:12px;z-index:5;margin-top:18px;padding:11px 14px max(11px,env(safe-area-inset-top));
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;border-radius:var(--r-pill);
  background:var(--glass-strong);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 10px 30px -18px var(--shade-deep)}
@media (prefers-reduced-transparency:reduce){.controls{background:var(--paper);backdrop-filter:none}}
.group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.group-label{font-size:11.5px;color:var(--ink-faint);font-weight:500}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{white-space:nowrap;background:transparent;border:1px solid transparent;border-radius:var(--r-pill);padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink-soft);
  transition:background-color 180ms var(--ease-out),color 180ms var(--ease-out),transform 180ms var(--ease-spring)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:0 2px 8px -2px var(--shade-deep)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ── points ── */
.area{margin-top:42px}
.area-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:0 4px 12px}
.area-head h3{font-size:19px;font-weight:600;letter-spacing:-.022em;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:11px}
.area-pre{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.area-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.point{display:grid;grid-template-columns:var(--gutter) 1fr;gap:20px;padding:18px 20px;scroll-margin-top:110px;
  border-radius:16px;border:1px solid transparent;
  transition:background-color 240ms var(--ease-out),border-color 240ms var(--ease-out)}
.point.flash{animation:wash 1500ms var(--ease-out)}
@keyframes wash{0%,55%{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--edge-low)}}
.boxes{display:flex;gap:7px;padding-top:2px}
.box{width:30px;height:30px;border-radius:var(--r-box);border:1.5px solid var(--ink-faint);background:transparent;color:var(--ink-faint);
  font-family:var(--mono);font-size:12px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums;
  transition:background-color 200ms var(--ease-out),border-color 200ms var(--ease-out),color 200ms var(--ease-out),transform 200ms var(--ease-spring)}
.box:active{transform:scale(.88)}
.box:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.box[data-state="1"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.box[data-state="2"]{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.box[data-state="3"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.point-id{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-bottom:5px;letter-spacing:.04em}
.point-title{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.018em;margin:0 0 6px}
.point-detail{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.6;max-width:64ch}

.deck-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-top:42px;padding:0 4px 12px;border-bottom:1px solid var(--rule)}
.deck-head h3{font-size:22px;font-weight:600;letter-spacing:-.025em;margin:0}
.deck-head span{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.deck-note{margin:14px 4px 20px;font-size:13px;color:var(--ink-soft);max-width:60ch}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qcard{padding:17px 19px 15px;break-inside:avoid;border-radius:var(--r-surface);
  background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 16px 40px -24px var(--shade-deep)}
@media (prefers-reduced-transparency:reduce){.qcard,.qz,.papers,.empty,.sync{background:var(--glass-strong);backdrop-filter:none}}
.qcard.red{box-shadow:inset 0 1px 0 var(--edge), inset 3px 0 0 var(--red), 0 16px 40px -24px var(--shade-deep)}
.qcard.amber{box-shadow:inset 0 1px 0 var(--edge), inset 3px 0 0 var(--amber), 0 16px 40px -24px var(--shade-deep)}
.qcard-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.qcard-head .n{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em}
.qcard.red .n{color:var(--red-ink)}
.qcard.amber .n{color:var(--amber-ink)}
.qcard-head .refs{font-family:var(--mono);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.qcard h4{font-size:16.5px;font-weight:600;letter-spacing:-.018em;margin:0 0 6px;line-height:1.28}
.qcard .front{margin:0 0 9px;font-size:13px;color:var(--ink-soft)}
.qcard ul{margin:0;padding-left:16px}
.qcard li{font-size:13px;line-height:1.5;margin-bottom:5px}
.qz{padding:19px 21px 17px;margin-bottom:12px;border-radius:var(--r-surface);
  background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--edge), 0 16px 40px -24px var(--shade-deep)}
.qz-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.qz-head .n{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.qz-head .marks{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.qz .stem{margin:0 0 11px;font-size:14.5px;line-height:1.55}
.qz ol.opts{margin:0 0 11px;padding-left:21px}
.qz ol.opts li{font-size:13.5px;margin-bottom:4px}
.qz .reveal{background:transparent;border:1px solid var(--rule);border-radius:var(--r-pill);padding:6px 15px;font-size:12.5px;font-weight:500;color:var(--ink-soft);
  transition:border-color 180ms var(--ease-out),color 180ms var(--ease-out),transform 180ms var(--ease-spring)}
.qz .reveal:active{transform:scale(.95)}
.qz .reveal:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.qz .ans{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-soft)}
.qz .ans p{margin:0 0 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.qz .ans ul{margin:0;padding-left:16px}
.qz .ans li{font-size:13.5px;line-height:1.5;margin-bottom:5px}
.qz .src{margin:10px 0 0;font-size:12px;color:var(--ink-faint)}
.papers{margin-top:30px;padding:18px 20px;border-radius:var(--r-surface);background:var(--glass);border:1px solid var(--edge-low);
  backdrop-filter:blur(26px);box-shadow:inset 0 1px 0 var(--edge);font-size:13px;color:var(--ink-soft)}
.papers b{color:var(--ink);font-weight:600}
.print-row{margin-top:24px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.print-row .hint{font-size:12.5px;color:var(--ink-faint)}
.empty{margin-top:46px;padding:48px 32px;border-radius:var(--r-surface);text-align:center;
  background:var(--glass);border:1px solid var(--edge-low);backdrop-filter:blur(26px);box-shadow:inset 0 1px 0 var(--edge)}
.empty strong{display:block;font-size:21px;font-weight:600;letter-spacing:-.022em;margin-bottom:7px}
.empty span{color:var(--ink-soft);font-size:14px}

/* ── sync + footer ── */
.sync{margin-top:56px;padding:22px 24px;border-radius:var(--r-surface);
  background:var(--glass);border:1px solid var(--edge-low);

<script>
(function () {
  const key = 'vce-revision-tracker-theme';
  window.setTrackerTheme = function (theme, remember) {
    const themes = ['glass', 'poster', 'midnight', 'notebook'];
    theme = themes.includes(theme) ? theme : 'glass';
    // The two new themes share Glass's responsive layout, with their own visual styles.
    document.getElementById('theme-glass').media = theme !== 'poster' ? 'all' : 'not all';
    ['poster', 'midnight', 'notebook'].forEach(function (name) {
      document.getElementById('theme-' + name).media = theme === name ? 'all' : 'not all';
    });
    // Chromium does not reliably re-resolve var()-based values when a sheet's media
    // changes: :root updates but `background:var(--paper)` stays painted at the old
    // colour, so switching away from a theme leaves its palette behind. Forcing a
    // full re-style of the tree is the only thing that clears it.
    if (document.body) {
      const root = document.documentElement;
      const display = root.style.display;
      root.style.display = 'none';
      void root.offsetHeight;
      root.style.display = display;
    }
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('[data-tracker-theme]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.trackerTheme === theme));
    });
    const colours = {glass:['#eef0f3','#0f1216'], poster:['#f2f1ed','#0c0c0a'], midnight:['#101522','#101522'], notebook:['#f5f0e5','#f5f0e5']}[theme];
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
      meta.content = colours[meta.media.includes('dark') ? 1 : 0];
    });
    if (remember) { try { localStorage.setItem(key, theme); } catch (e) {} }
    window.dispatchEvent(new Event('tracker-theme-change'));
  };
  let saved;
  try { saved = localStorage.getItem(key); } catch (e) {}
  setTrackerTheme(saved, false);
  document.addEventListener('DOMContentLoaded', function () {
    setTrackerTheme(document.documentElement.dataset.theme, false);
    document.querySelectorAll('[data-tracker-theme]').forEach(function (button) {
      button.addEventListener('click', function () { setTrackerTheme(button.dataset.trackerTheme, true); });
    });
  });
})();
</script>

<script>
const SUBJECTS = [{"id": "english-language-34", "name": "English Language", "areas": ["Unit 3 AoS 1 — Informality", "Unit 3 AoS 2 — Formality", "Unit 4 AoS 1 — Language variation in Australian society", "Unit 4 AoS 2 — Individual and group identities", "Metalanguage by subsystem", "Linguistic terms and theories"], "short": {"Unit 3 AoS 1 — Informality": "U3 Informality", "Unit 3 AoS 2 — Formality": "U3 Formality", "Unit 4 AoS 1 — Language variation in Australian society": "U4 Variation", "Unit 4 AoS 2 — Individual and group identities": "U4 Identity", "Metalanguage by subsystem": "Metalanguage", "Linguistic terms and theories": "Terms and theories"}, "points": [{"id": "3.1.1", "area": "Unit 3 AoS 1 — Informality", "title": "The role of Standard English in informal texts", "detail": "How SAE functions as the reference point that informality is measured against, and what it means for a text to depart from it deliberately rather than through error.", "questions": [{"marks": 3, "q": "Explain why a text can depart from Standard English deliberately rather than through error, and describe how you would tell the two apart in an informal text.", "answer": ["Standard English is the codified variety used as a reference point, not a measure of correctness.", "Deliberate departure is systematic and serves a purpose — solidarity, identity, humour, speed.", "Error is inconsistent and serves no communicative function.", "Consistency across the text, and whether the feature fits the tenor and audience, distinguish them."]}]}, {"id": "3.1.2", "area": "Unit 3 AoS 1 — Informality", "title": "Functions of language in a given context", "detail": "Jakobson's six functions — referential, emotive, conative, phatic, metalinguistic, poetic — and identifying which are operating in a text, usually more than one.", "questions": [{"marks": 4, "q": "A friend texts: 'hey u free sat? think im gonna lose it if i dont get out of the house lol'. Identify two functions of language operating and justify each.", "answer": ["Referential — the message conveys information and a question about Saturday availability.", "Emotive — 'lose it', 'lol' express the speaker's emotional state.", "Also acceptable: phatic, maintaining the social connection between friends.", "Conative if the request is read as directing the friend to respond."]}]}, {"id": "3.1.3", "area": "Unit 3 AoS 1 — Informality", "title": "Register, tenor and audience in informal texts", "detail": "How the relationship between participants, their social distance and the assumed audience drive the level of informality.", "questions": [{"marks": 3, "q": "Explain how tenor shapes the level of informality, using the contrast between a message to a sibling and one to a new employer.", "answer": ["Tenor is the relationship between participants, including social distance and relative power.", "Low social distance and equal power with a sibling permit slang, ellipsis and minimal mitigation.", "High social distance and unequal power with an employer require standard forms, full clauses and negative politeness.", "The same speaker shifts register because the tenor changes, not their ability."]}]}, {"id": "3.1.4", "area": "Unit 3 AoS 1 — Informality", "title": "Features of informal writing", "detail": "Across a range of texts: abbreviations, spellings reflecting pronunciation, syntactic creativity, ellipsis, shortened lexical forms, non-linear structure.", "questions": [{"marks": 4, "q": "Identify four features that mark a written text as informal and explain what each contributes to the relationship between writer and reader.", "answer": ["Contractions and shortenings — signal casualness and speed.", "Colloquial lexis or slang — signals shared identity and reduces social distance.", "Ellipsis and sentence fragments — assume shared context between writer and reader.", "Non-standard orthography, emojis, lower case — substitute for prosody and mark intimacy.", "Each should be tied to intimacy, solidarity or equality."]}], "card": {"key": "A0", "title": "Features of informal writing", "front": "What marks a written text as informal?", "back": ["Lexis — colloquialism, slang, contractions, shortenings, hypocoristics", "Syntax — ellipsis, sentence fragments, coordination over subordination", "Orthography — non-standard spelling, lower case, repeated letters", "Emojis and graphemes substituting for prosody", "Discourse — loose structure, first and second person, direct address"]}}, {"id": "3.1.5", "area": "Unit 3 AoS 1 — Informality", "title": "Features of informal speech", "detail": "Spontaneity and planning both playing a role, prosodic and paralinguistic support, and the idiosyncratic choices individual speakers make.", "questions": [{"marks": 3, "q": "Explain why non-fluency features in a transcript are evidence of informality rather than evidence of a poor speaker.", "answer": ["Spontaneous speech is planned in real time, so pauses, false starts and repairs are expected.", "Their presence shows low planning and an unrehearsed exchange, characteristic of informal contexts.", "Filled pauses also hold the floor while the speaker formulates the next utterance.", "Judging them as errors is a prescriptivist reading; descriptively they are normal features of speech."]}], "card": {"key": "A1", "title": "Features of informal speech", "front": "What marks a spoken text as informal?", "back": ["Non-fluency: filled pauses, false starts, repetition, repairs", "Connected speech processes throughout", "Overlapping speech, backchannels, latching", "Colloquial and slang lexis, swearing, taboo", "Simple syntax, ellipsis, high context-dependence", "Spontaneity — but planning still appears in places"]}}, {"id": "3.1.6", "area": "Unit 3 AoS 1 — Informality", "title": "Context and language features in informal texts", "detail": "The relationship between the situational and cultural context of an exchange and the specific features that appear in it — the heart of every analytical commentary.", "questions": [{"marks": 4, "q": "Explain how the situational context of a group chat between close friends produces the specific language features found in it.", "answer": ["Tenor: close, equal relationships mean low social distance and minimal face mitigation.", "Field: everyday personal subject matter allows colloquial lexis rather than specialised terms.", "Mode: written but spontaneous, so it borrows spoken features — ellipsis, fragments, emojis for prosody.", "Shared cultural context means much can be left implicit, producing high inference and in-group references."]}], "card": {"key": "A2", "title": "How context shapes features", "front": "Link situational context to the features that appear — informal and formal.", "back": ["Field — the subject matter drives the lexis and any jargon", "Tenor — relationship and social distance set the politeness and formality", "Mode — spoken or written changes planning, cohesion and non-fluency", "Setting — public or private, immediate or distant audience", "Informal: shared context means more can be left implicit", "Formal: context must be made explicit for an unknown audience"]}}, {"id": "3.1.7", "area": "Unit 3 AoS 1 — Informality", "title": "Features of spoken discourse in informal texts", "detail": "Openings and closings, adjacency pairs, minimal responses, overlapping speech, discourse markers and non-fluency features, and what each contributes.", "questions": [{"marks": 3, "q": "Explain how openings and closings differ between an informal conversation between friends and a formal job interview.", "answer": ["Informal: openings are loose, may skip greetings entirely, and closings are negotiated over several turns.", "Formal: openings follow convention with explicit greetings and often self-identification.", "Formal closings are managed by the participant with higher status, signalling the end clearly.", "The difference reflects tenor — social distance requires more explicit structuring."]}], "card": {"key": "A3", "title": "Spoken discourse in informal and formal texts", "front": "Which discourse features appear, and which get suppressed, in each?", "back": ["Informal — openings/closings loose, overlap common, non-fluency frequent", "Informal — adjacency pairs casual, backchannels constant", "Formal — turns allocated by role, overlap rare, non-fluency edited out", "Formal — planned openings and closings, explicit topic management", "Formal speech carries written-language organisation with spoken delivery"]}}, {"id": "3.1.8", "area": "Unit 3 AoS 1 — Informality", "title": "Subsystem patterning, colloquial language and slang", "detail": "Identifying patterning across the subsystems, and the role of colloquialisms and slang in marking informality and in-group membership.", "questions": [{"marks": 4, "q": "Distinguish colloquial language from slang, and explain how each contributes to informality in a text between teenagers.", "answer": ["Colloquial language is informal but widely understood across the speech community.", "Slang is group-specific, changes faster, and marks membership of a particular group.", "Colloquialism lowers formality and signals a relaxed register.", "Slang additionally excludes outsiders and constructs in-group identity for the participants."]}]}, {"id": "3.1.9", "area": "Unit 3 AoS 1 — Informality", "title": "Taboo language, dysphemism and swearing", "detail": "Swearing patterns and taboo language as markers of informality and solidarity, and the social work they do beyond giving offence.", "questions": [{"marks": 4, "q": "A transcript of close friends contains repeated swearing. Explain why this is not necessarily aggressive, and identify what it is likely achieving.", "answer": ["Swearing is not only used to offend — its function depends on context and tenor.", "Among close friends it commonly signals solidarity and in-group membership.", "It marks the exchange as informal and relaxed, where taboo constraints can be suspended.", "It can also intensify emotion or add humour rather than express hostility."]}]}, {"id": "3.1.10", "area": "Unit 3 AoS 1 — Informality", "title": "Emoticons, emojis and context-specific graphemes", "detail": "How written informal texts substitute for prosody and paralinguistics, and how a grapheme's meaning shifts with context.", "questions": [{"marks": 3, "q": "Explain how emojis and non-standard orthography compensate for the absence of prosodic and paralinguistic features in written informal texts.", "answer": ["Written text lacks pitch, stress, volume and facial expression, which carry attitude in speech.", "Emojis substitute for facial expression, marking humour, sarcasm or softening a face-threatening act.", "Capitals and repeated letters substitute for volume and elongation ('STOP', 'nooooo').", "Meaning is context-specific and varies between groups and generations."]}], "card": {"key": "A10", "title": "Emojis, graphemes and multi-word lexemes", "front": "How do written informal texts replace prosody, and what is a multi-word lexeme?", "back": ["Emojis and emoticons substitute for facial expression and tone", "Meaning is context-specific and shifts between groups and generations", "Capitals, repeated letters and punctuation stand in for volume and pitch", "Context-specific graphemes — symbols meaningful only in their setting", "Multi-word lexeme — stored and retrieved as one unit (idioms, phrasal verbs)"]}}, {"id": "3.1.11", "area": "Unit 3 AoS 1 — Informality", "title": "Discourse strategies and cooperation", "detail": "Topic management, turn-taking, repair sequences, and the ways speakers cooperate to keep an interaction running.", "questions": [{"marks": 4, "q": "Using the concepts of turn-taking, topic management and repair, explain how participants in an informal conversation cooperate.", "answer": ["Turn-taking: participants use prosodic and grammatical cues to pass the floor; overlap is often supportive.", "Topic management: topics are introduced, developed and shifted collaboratively rather than controlled by one speaker.", "Repair: self-repair and other-repair fix breakdowns without threatening face.", "Backchannels signal continued attention, encouraging the speaker to continue."]}], "card": {"key": "R10", "title": "Discourse strategies and cooperation", "front": "How do speakers cooperate to keep a conversation running?", "back": ["Turn-taking — cues that pass the floor; overlap can support or compete", "Topic management — initiating, shifting and closing topics", "Repair sequences — self-repair and other-repair when it breaks down", "Minimal responses and backchannels (mm, yeah) show active listening", "Discourse markers (so, anyway, well) signal structure", "Code switching signals shared group membership"]}}, {"id": "3.1.12", "area": "Unit 3 AoS 1 — Informality", "title": "Informality for intimacy, solidarity and equality", "detail": "How informal choices reduce social distance, including the politeness strategies that support it.", "questions": [{"marks": 4, "q": "Explain how informal language can be used to build solidarity, and identify two specific features that achieve this.", "answer": ["Solidarity is the sense of shared identity and belonging between participants.", "Feature: slang or in-group lexis, comprehensible only to members, marking who belongs.", "Feature: hypocoristics and nicknames, signalling familiarity and reducing social distance.", "Also acceptable: swearing used non-aggressively, ellipsis assuming shared knowledge, positive politeness."]}], "card": {"key": "R11", "title": "Why speakers choose informality", "front": "Informal language for intimacy, solidarity and equality — how does each work?", "back": ["Intimacy — cuts social distance: nicknames, hypocoristics, in-jokes", "Solidarity — signals shared identity: slang, swearing, ellipsis", "Equality — flattens hierarchy: first names, colloquialism, positive politeness", "Also: linguistic innovation, negotiating taboo, building rapport", "In an analysis, always tie the specific feature to the purpose"]}}, {"id": "3.1.13", "area": "Unit 3 AoS 1 — Informality", "title": "Informality for innovation, harmony and in-group membership", "detail": "Promoting linguistic innovation, negotiating social taboos, building rapport, and signalling who belongs to the group and who doesn't.", "questions": [{"marks": 4, "q": "Explain how informal language promotes linguistic innovation and helps negotiate social taboos, giving an example of each.", "answer": ["Informal contexts tolerate novelty, so neologisms, blends and new slang emerge and spread there first.", "Example: internet-origin coinages entering everyday speech before any dictionary records them.", "Taboo topics are negotiated through euphemism, dysphemism and humour, letting participants discuss the difficult.", "Example: joking dysphemism about illness or death, which manages discomfort while allowing the subject to be raised."]}]}, {"id": "3.1.14", "area": "Unit 3 AoS 1 — Informality", "title": "Cohesion and coherence in informal texts", "detail": "The discourse factors that hold an informal text together, and why a text can be cohesive without being coherent or the reverse.", "questions": [{"marks": 3, "q": "Explain why an informal conversation between close friends may have low cohesion but remain highly coherent for its participants.", "answer": ["Shared context means much is left implicit — ellipsis, deixis and unexplained references reduce surface cohesion.", "Participants supply the missing links through inference from shared knowledge.", "Coherence depends on whether it makes sense to its audience, not on explicit linking devices.", "An outsider reading the same transcript may find it incoherent."]}], "card": {"key": "A4", "title": "Cohesion — the devices", "front": "Name the cohesive devices that tie a text together.", "back": ["Lexical choice — synonymy, antonymy, hyponymy, hypernymy, collocation", "Reference — anaphoric (back), cataphoric (forward), deictics", "Substitution and ellipsis — avoid repeating what’s recoverable", "Conjunctions and adverbials — signal logical links", "Information flow — clefting, front focus, end focus", "Repetition — of word, structure or sound"]}}, {"id": "3.1.15", "area": "Unit 3 AoS 1 — Informality", "title": "Transcription conventions", "detail": "The conventions for transcribing spoken English — symbols, legend and line numbers — and referring to line numbers accurately in an analysis.", "questions": [{"marks": 3, "q": "A transcript line reads: '12 A: so (.) i mean it's not [that] bad'. Explain what each convention represents.", "answer": ["'12' is the line number, used for accurate reference in an analysis.", "'(.)' marks a micropause — a brief pause too short to time.", "'[' marks the onset of overlapping speech with another speaker.", "Always quote line numbers when referring to a transcript in your answer."]}]}, {"id": "3.2.1", "area": "Unit 3 AoS 2 — Formality", "title": "The role of Standard English in formal texts", "detail": "How SAE carries prestige in formal contexts, and what its use signals about the writer or speaker.", "questions": [{"marks": 3, "q": "Explain what a writer's use of Standard English in a formal text signals to the reader, and why the variety carries that force.", "answer": ["It signals authority, credibility and membership of educated institutional discourse.", "SAE carries overt prestige because it is the codified variety used by powerful institutions.", "That prestige is a social fact, not a linguistic one — SAE is not inherently clearer or more logical.", "Departing from it in a formal text risks the writer being judged as less competent."]}]}, {"id": "3.2.2", "area": "Unit 3 AoS 2 — Formality", "title": "Functions of language in formal texts", "detail": "The same six functions, but identifying how they operate in planned, edited and often public language.", "questions": [{"marks": 3, "q": "Identify the dominant function of language in a public health advertisement and explain how a second function supports it.", "answer": ["Conative is dominant — the text directs the audience to change behaviour.", "Referential support: statistics or medical information establish the basis for the instruction.", "Poetic function may also operate through slogans, alliteration or rhythm making the message memorable."]}]}, {"id": "3.2.3", "area": "Unit 3 AoS 2 — Formality", "title": "Register, tenor and audience in formal texts", "detail": "How anticipating an audience's interpretation shapes formal choices, and how tenor sets the degree of formality.", "questions": [{"marks": 4, "q": "Explain how anticipating an unknown, public audience shapes the language of a formal written text.", "answer": ["Context cannot be assumed, so the text must be explicit — low deixis, few unexplained references.", "Interpretation cannot be checked in real time, so cohesion and structure must be strong.", "The widest plausible audience is addressed, so specialised terms are defined or avoided.", "Face needs of a diverse audience are managed through non-discriminatory language and hedging."]}]}, {"id": "3.2.4", "area": "Unit 3 AoS 2 — Formality", "title": "Context and language features in formal texts", "detail": "The relationship between situational and cultural context and the features that appear — including what the context makes explicit that an informal text would leave assumed.", "questions": [{"marks": 4, "q": "Explain how the situational context of a government media release shapes its language features.", "answer": ["Tenor: distant and institutional, requiring formality and negative politeness.", "Field: policy or administrative matter, drawing on jargon and specialised lexis.", "Mode: written, planned and edited, producing complex syntax and strong cohesion.", "The audience is unknown and public, so context must be made explicit rather than assumed — and language may be chosen to obscure as well as clarify."]}], "card": {"key": "A2", "title": "How context shapes features", "front": "Link situational context to the features that appear — informal and formal.", "back": ["Field — the subject matter drives the lexis and any jargon", "Tenor — relationship and social distance set the politeness and formality", "Mode — spoken or written changes planning, cohesion and non-fluency", "Setting — public or private, immediate or distant audience", "Informal: shared context means more can be left implicit", "Formal: context must be made explicit for an unknown audience"]}}, {"id": "3.2.5", "area": "Unit 3 AoS 2 — Formality", "title": "Features of formal writing", "detail": "Greater cohesion, editing, explicitness about context, complex syntax and nominalisation — and the capacity to be deliberately ambiguous.", "questions": [{"marks": 4, "q": "Identify four features of formal written language and explain what each signals.", "answer": ["Standard English and careful editing — signals authority and credibility.", "Complex syntax with subordination — allows precise qualification of claims.", "Nominalisation — raises formality and can remove the actor from the clause.", "Specialised lexis or jargon — establishes expertise and assumes an informed reader.", "Also acceptable: explicitness, low deixis, strong cohesive linking."]}], "card": {"key": "A6", "title": "Features of formal writing", "front": "What marks a written text as formal?", "back": ["Standard English throughout, edited and proofread", "Complex syntax, subordination, nominalisation", "Precise, often specialised or technical lexis; jargon", "Explicit — context spelled out for an unknown audience", "Strong cohesion and clear structure", "Can be deliberately ambiguous or evasive when it suits"]}}, {"id": "3.2.6", "area": "Unit 3 AoS 2 — Formality", "title": "Features of formal speech", "detail": "Formal speech carrying the organisational features of written language while still drawing on prosody and paralinguistic features; rehearsal and editing.", "questions": [{"marks": 3, "q": "Explain how a formal speech differs from both spontaneous speech and formal writing.", "answer": ["Unlike spontaneous speech, it is rehearsed and edited, so non-fluency is minimal and structure is planned.", "It carries written-language organisation: full clauses, clear sections, strong cohesion.", "Unlike formal writing, it retains prosody and paralinguistics — pitch, stress, pause and gesture used deliberately for effect.", "It sits between the two modes rather than belonging wholly to either."]}], "card": {"key": "A7", "title": "Features of formal speech", "front": "What marks a spoken text as formal?", "back": ["Rehearsed, edited, sometimes read from a script", "Written-language organisation: clear structure, full clauses", "Non-fluency minimised; prosody used deliberately for effect", "Standard pronunciation; fewer connected speech processes", "Still draws on prosodic and paralinguistic features to persuade"]}}, {"id": "3.2.7", "area": "Unit 3 AoS 2 — Formality", "title": "Features of spoken discourse in formal texts", "detail": "How the discourse features of speech appear, or are suppressed, in a planned formal spoken text.", "questions": [{"marks": 3, "q": "Explain how turn-taking and topic management differ in a courtroom exchange compared with a casual conversation.", "answer": ["Turn-taking rights are allocated by role — the barrister questions, the witness answers.", "Topic control sits with the more powerful participant; the witness cannot introduce a new topic.", "Interruption is marked and often sanctioned rather than supportive.", "This reflects the institutional tenor and the unequal power relationship."]}], "card": {"key": "A3", "title": "Spoken discourse in informal and formal texts", "front": "Which discourse features appear, and which get suppressed, in each?", "back": ["Informal — openings/closings loose, overlap common, non-fluency frequent", "Informal — adjacency pairs casual, backchannels constant", "Formal — turns allocated by role, overlap rare, non-fluency edited out", "Formal — planned openings and closings, explicit topic management", "Formal speech carries written-language organisation with spoken delivery"]}}, {"id": "3.2.8", "area": "Unit 3 AoS 2 — Formality", "title": "Subsystem patterning and rhetoric", "detail": "Patterning across the subsystems used rhetorically — syntactic patterning such as antithesis, listing and parallelism, and phonological patterning.", "questions": [{"marks": 4, "q": "A speech includes: 'We have the resources. We have the expertise. We have the will.' Analyse the patterning used and its persuasive effect.", "answer": ["Syntactic parallelism: three clauses of identical structure.", "Repetition (anaphora) of 'We have the' at the start of each.", "Tricolon: the three-part structure creates rhythm and a sense of completeness.", "Effect: builds cumulative force, and the inclusive 'we' aligns speaker with audience, making the conclusion feel inevitable."]}], "card": {"key": "A8", "title": "Subsystem patterning and rhetoric", "front": "How is patterning used rhetorically in formal texts?", "back": ["Phonological — alliteration, rhythm to make a line stick", "Syntactic — antithesis, listing, parallelism for force and balance", "Semantic — metaphor, hyperbole, irony to frame the issue", "Rhetoric works across subsystems at once in a single line", "State the persuasive purpose, not just the device name"]}}, {"id": "3.2.9", "area": "Unit 3 AoS 2 — Formality", "title": "Jargon, euphemism, doublespeak and non-discriminatory language", "detail": "Jargon establishing expertise or excluding outsiders, euphemism negotiating taboo, doublespeak obscuring, and non-discriminatory language as a deliberate choice.", "questions": [{"marks": 4, "q": "Distinguish euphemism from doublespeak, and explain the different purposes each serves in public language.", "answer": ["Euphemism substitutes a milder term for one considered harsh or taboo, usually to protect face.", "Doublespeak deliberately obscures or reverses meaning to conceal an unwelcome reality.", "Euphemism: 'passed away' for died — softening for the hearer's benefit.", "Doublespeak: 'rightsizing' for mass redundancy — protecting the speaker, not the hearer."]}]}, {"id": "3.2.10", "area": "Unit 3 AoS 2 — Formality", "title": "Discourse strategies and cooperation in formal contexts", "detail": "How cooperation is managed when roles and turn-taking rights are unequal.", "questions": [{"marks": 3, "q": "Explain how politeness strategies are used to manage the power imbalance in a formal workplace email from an employee to a senior manager.", "answer": ["Negative politeness dominates: hedging, modality and apology minimise imposition.", "Indirect requests ('I was wondering whether') give the manager an easy refusal.", "Formal address terms and full standard forms acknowledge the status difference.", "The greater the social distance and power gap, the more mitigation is required."]}], "card": {"key": "A9", "title": "Discourse strategies in formal contexts", "front": "How is cooperation managed when roles and rights are unequal?", "back": ["Turn-taking rights allocated by role — chair, interviewer, judge", "Topic control sits with the more powerful participant", "Interruption is marked and often face-threatening", "Repair is more explicit and more costly to face", "Politeness strategies mitigate the imbalance"]}}, {"id": "3.2.11", "area": "Unit 3 AoS 2 — Formality", "title": "Formality for distance, authority and expertise", "detail": "Politeness strategies in formal texts, reinforcing social distance and hierarchy, and establishing expertise and authority.", "questions": [{"marks": 4, "q": "Explain how formal language reinforces social distance and establishes expertise, naming one feature that achieves each.", "answer": ["Social distance: negative politeness and formal address terms mark the participants as non-intimate.", "Feature: modality and hedging ('it may be appropriate to consider') avoid direct imposition.", "Expertise: jargon and specialised lexis signal membership of a professional field.", "Jargon simultaneously establishes authority for insiders and excludes those outside the field."]}]}, {"id": "3.2.12", "area": "Unit 3 AoS 2 — Formality", "title": "Formality for harmony, taboo and obfuscation", "detail": "Promoting social harmony, negotiating social taboos and building rapport, and the clarify–manipulate–obfuscate range, particularly in public language.", "questions": [{"marks": 4, "q": "A company statement reads: 'Regrettably, a small number of accounts may have been subject to unauthorised access.' Analyse how the language manages the situation.", "answer": ["Agentless passive 'may have been subject to' removes the company as actor, obscuring responsibility.", "Modality 'may' and the minimiser 'a small number' reduce the apparent scale.", "'Unauthorised access' is a euphemism for a data breach.", "The text sits toward the obfuscation end of the clarify–manipulate–obfuscate range while appearing to disclose."]}]}, {"id": "3.2.13", "area": "Unit 3 AoS 2 — Formality", "title": "Cohesion and coherence in formal texts", "detail": "The discourse factors creating cohesion and coherence, and why formal texts usually score higher on both.", "questions": [{"marks": 3, "q": "Explain why formal written texts typically show higher cohesion than informal spoken texts.", "answer": ["Formal texts are planned and edited, so cohesive devices can be deliberately inserted.", "The audience is unknown and absent, so links must be made explicit rather than inferred.", "Conjunctive adverbials, clear reference chains and consistent lexical fields do the work that shared context does in conversation.", "Informal speech relies on inference and deixis instead."]}], "card": {"key": "A5", "title": "Coherence — the factors", "front": "What makes a text coherent, and how does it differ from cohesion?", "back": ["Cohesion is the surface glue; coherence is whether it makes sense", "Inference — the reader supplies what isn’t stated", "Logical ordering — the sequence matches the content", "Formatting — headings, paragraphs, layout guiding the reader", "Consistency and conventions — the text behaves as its type should", "A text can be cohesive and incoherent, or coherent with little cohesion"]}}, {"id": "4.1.1", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Standard Australian English and its role", "detail": "The features that distinguish SAE, and how public institutions afford it prestige in Australian society.", "questions": [{"marks": 3, "q": "Explain what gives Standard Australian English its status, and why describing other varieties as 'incorrect' is a prescriptivist position.", "answer": ["SAE is codified in dictionaries, grammars and style guides and used by institutions — education, government, media.", "Its status is social and historical, not a property of the variety itself.", "Other varieties are systematic and rule-governed, with their own consistent patterns.", "Calling them incorrect applies SAE's norms as a universal standard, which is prescriptivism."]}]}, {"id": "4.1.2", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Identities conveyed in Australian texts", "detail": "The ways a variety of identities are conveyed and reflected in written and spoken Australian texts.", "questions": [{"marks": 4, "q": "Explain how a text can convey an Australian identity, naming two linguistic features and their effect.", "answer": ["Lexis: distinctly Australian terms and hypocoristics (arvo, servo, ute) signal shared cultural knowledge.", "Phonology: Australian vowels and non-rhoticity mark the speaker as local.", "Discourse: understatement, self-deprecation and the levelling of status markers.", "Together these construct an identity recognisable to insiders and often stereotyped by outsiders."]}]}, {"id": "4.1.3", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Broad, General and Cultivated accents", "detail": "The evolution of the three Australian accent groups, their phonological features, and the attitudes attached to each.", "questions": [{"marks": 4, "q": "Describe the three Australian accent groups and explain how attitudes to them have shifted.", "answer": ["Broad — strongest Australian features, historically associated with rural and working-class speakers.", "General — the most widely used variety, occupying the middle of the continuum.", "Cultivated — closest to Received Pronunciation, historically associated with prestige and education.", "Cultivated has declined and now sometimes attracts negative judgement as affected, while Broad carries covert prestige as authentically Australian."]}]}, {"id": "4.1.4", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Cultural variation in Australian English", "detail": "How English varies according to culture — Standard Australian English, Aboriginal Australian Englishes and migrant ethnolects, and the features that mark each.", "questions": [{"marks": 4, "q": "Name three varieties of English used in Australia and describe one distinguishing feature of each.", "answer": ["Standard Australian English — codified, used in education, government and media.", "Aboriginal Australian Englishes — a continuum drawing on First Nations languages, contact language and non-standard English features.", "Migrant ethnolects — combine Australian English with features of a community's first language.", "All three are systematic varieties; the differences are patterned, not random."]}]}, {"id": "4.1.5", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Attitudes to varieties of English", "detail": "Attitudes within Australian society to different varieties, including prescriptivist and descriptivist positions, and what those attitudes reveal about the holder.", "questions": [{"marks": 4, "q": "A talkback caller complains that young people 'are ruining the language'. Identify the position taken and write a descriptivist response.", "answer": ["Prescriptivist — treating one variety as correct and change as decay.", "Descriptivist response: language change is constant, systematic and observable in every period.", "Features now considered standard were themselves once condemned as errors.", "The task of linguistics is to describe how language is used, not to rule on how it should be."]}]}, {"id": "4.1.6", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Global contact and modern technologies", "detail": "How English in Australia is being shaped by global contact, technology and other social change.", "questions": [{"marks": 4, "q": "Explain two ways global contact and modern technologies are changing Australian English, with an example of each.", "answer": ["Borrowing and Americanisation: American lexis and spellings spread through media and software defaults.", "Technology-driven innovation: new coinages and abbreviations originate online and move into speech.", "Convergence: exposure to global varieties reduces some distinctly Australian features.", "Speed of spread has increased — an innovation can be national within weeks rather than years."]}]}, {"id": "4.1.7", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Language and national identity", "detail": "The role of language in conveying a perceived national identity, and why that identity is contested rather than settled.", "questions": [{"marks": 4, "q": "Explain how language conveys a perceived national identity, and why that identity is contested.", "answer": ["Shared lexis, accent and discourse conventions construct a recognisable national variety.", "Certain features become emblematic — hypocoristics, understatement, the 'fair go' register of egalitarianism.", "Contested because the identity constructed often reflects only some Australians.", "It can exclude First Nations peoples and migrant communities whose varieties are equally Australian."]}]}, {"id": "4.1.8", "area": "Unit 4 AoS 1 — Language variation in Australian society", "title": "Stereotypes and their validity", "detail": "Language features associated with emerging and established stereotypes, adopted consciously or subconsciously, and challenging the validity of those associations.", "questions": [{"marks": 4, "q": "A commentator claims that speakers of a Broad Australian accent 'sound uneducated'. Evaluate this claim using your knowledge of language attitudes.", "answer": ["This is a stereotype: a feature associated with a group and generalised to individuals.", "Accent is not correlated with intelligence or education — it is a systematic phonological variety.", "The judgement reflects overt prestige attached to more standard varieties, not linguistic fact.", "Variation within any accent group exceeds the variation between groups, so the generalisation fails."]}], "card": {"key": "R12", "title": "Stereotypes and their validity", "front": "Language and stereotypes — what is the argument, and how do you challenge it?", "back": ["Features get associated with groups — Broad accent, ethnolects, teen slang", "Adopted consciously to perform an identity, or subconsciously", "Stereotypes are generalisations, not reliable claims about individuals", "They carry covert prestige for insiders and stigma from outsiders", "Challenge: variation WITHIN a group exceeds variation BETWEEN groups"]}}, {"id": "4.2.1", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Sociolects and idiolects", "detail": "Social and personal variation according to age, gender, sexuality, occupation, interests, aspirations and education.", "questions": [{"marks": 4, "q": "Define sociolect and idiolect, and explain why an individual belongs to several sociolects at once.", "answer": ["Sociolect: variation associated with a social group — age, occupation, interest, education, gender.", "Idiolect: the unique combination of features used by one individual at a point in their life.", "A person belongs simultaneously to groups defined by age, workplace, interests and region.", "Their idiolect draws on all of these, and shifts as those group memberships change."]}]}, {"id": "4.2.2", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Representations of identity in texts", "detail": "How individual and group identities are represented across a range of written and spoken texts.", "questions": [{"marks": 4, "q": "Explain how a text can represent a group identity, using the concepts of lexis and discourse.", "answer": ["Shared lexis — jargon, slang or in-group terms that only members fully interpret.", "Discourse features — shared conventions for openings, humour, turn-taking and topic.", "These construct the boundary of the group, marking who is inside and who is not.", "Representation may be produced by the group itself, or imposed on it by outsiders through stereotype."]}]}, {"id": "4.2.3", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Social expectations and community attitudes", "detail": "The ways the language of individuals and of groups is shaped by what the surrounding community expects and accepts.", "questions": [{"marks": 3, "q": "Explain how community expectations shape an individual's language choices in a workplace, and what happens when those expectations are breached.", "answer": ["Communities establish norms for register, taboo and politeness appropriate to each setting.", "Individuals shift within their repertoire to meet the expectation — more formal register, less slang, more mitigation.", "Breaching the norm carries social cost: loss of credibility, exclusion, or formal sanction.", "Conforming earns acceptance and access to the group's resources."]}], "card": {"key": "R13", "title": "Social expectations and community attitudes", "front": "How do social expectations shape the language of individuals and groups?", "back": ["Communities set norms for register, taboo and politeness in each setting", "Breaching a norm carries social cost; conforming earns acceptance", "Expectations differ across workplace, family, online and school", "Attitudes to non-standard varieties pressure speakers toward SAE", "Individuals shift within their repertoire to meet the expectation"]}}, {"id": "4.2.4", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Linguistic repertoire, power and prestige", "detail": "How people draw on their repertoire to gain power and prestige, including exploiting overt and covert norms.", "questions": [{"marks": 4, "q": "Explain how a speaker might use their linguistic repertoire to gain prestige in two different contexts, referring to both overt and covert prestige.", "answer": ["Repertoire is the range of varieties and registers a speaker can draw on.", "In a job interview, shifting toward SAE and formal register claims overt prestige and institutional authority.", "Among a peer group, using slang or a local variety claims covert prestige and signals solidarity.", "A wider repertoire means more situations can be navigated successfully."]}], "card": {"key": "A11", "title": "Linguistic repertoire, power and prestige", "front": "How do speakers use their repertoire to gain power and prestige?", "back": ["Repertoire — the full range of varieties and registers a speaker controls", "Shifting toward SAE claims authority and overt prestige", "Shifting toward local forms claims solidarity and covert prestige", "Jargon claims expertise and excludes outsiders", "A wider repertoire means more social situations navigable"]}}, {"id": "4.2.5", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Overt and covert prestige", "detail": "Overt prestige attached to standard varieties and covert prestige attached to local forms, and how both can be deliberately used.", "questions": [{"marks": 4, "q": "Define overt and covert prestige and explain how one speaker might pursue both in a single day.", "answer": ["Overt prestige attaches to the standard variety, recognised publicly and institutionally.", "Covert prestige attaches to non-standard forms, valued within a group for signalling authenticity.", "In a job interview the speaker shifts toward SAE, claiming overt prestige.", "With friends afterwards they use slang and a broader accent, claiming covert prestige. Both are strategic uses of one repertoire."]}]}, {"id": "4.2.6", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Code switching and belonging", "detail": "Code switching as a means of demonstrating group membership and belonging, rather than as a deficiency.", "questions": [{"marks": 3, "q": "Explain why code switching is evidence of linguistic skill rather than deficiency.", "answer": ["Code switching requires competence in more than one variety and the judgement to know when each fits.", "Switches are typically rule-governed and occur at grammatically permissible points.", "It is used purposefully — to signal group membership, express an idea unavailable in the other code, or include a listener.", "Treating it as confusion applies a monolingual standard to multilingual competence."]}]}, {"id": "4.2.7", "area": "Unit 4 AoS 2 — Individual and group identities", "title": "Social attitudes, language choices and discrimination", "detail": "The relationship between social attitudes and language choices, and how personal associations and prejudices can lead to social disadvantage and discrimination.", "questions": [{"marks": 4, "q": "Explain how attitudes toward a language variety can result in social disadvantage, with reference to a specific context.", "answer": ["Attitudes toward a variety transfer onto its speakers, who are judged on competence or character.", "In employment, a candidate speaking a stigmatised ethnolect may be rated less favourably despite equal qualifications.", "Consequences extend to education, housing and treatment in the justice system.", "Linguistic prejudice often operates as an acceptable proxy for racial or class prejudice."]}], "card": {"key": "A12", "title": "Social attitudes and discrimination", "front": "How do language attitudes lead to disadvantage?", "back": ["Attitudes to a variety transfer onto its speakers", "Non-standard varieties judged as less intelligent or less competent", "Consequences in employment, education, housing, the justice system", "Linguistic prejudice is often the socially acceptable cover for other bias", "Speakers may abandon a variety to avoid the cost"]}}, {"id": "M1", "area": "Metalanguage by subsystem", "title": "Connected speech processes", "detail": "Assimilation, vowel reduction, elision and insertion — identifying them in a transcript and explaining what they signal about formality and planning.", "questions": [{"marks": 3, "q": "In a transcript, a speaker produces 'goin' to the shops' and 'han(d)bag'. Identify the connected speech process in each case and explain what their presence suggests about the exchange.", "answer": ["'goin'' — elision: the final consonant of the -ing cluster is dropped.", "'han(d)bag' — elision of /d/ in the consonant cluster.", "Both suggest rapid, spontaneous, informal speech.", "They indicate low planning and reduced social distance, not careless or incorrect speech."]}], "card": {"key": "R0", "title": "Connected speech processes", "front": "What are the four connected speech processes, and what do they signal?", "back": ["Assimilation — a sound shifts to match a neighbour: “ten bikes” → /tem baɪks/", "Vowel reduction — full vowel becomes schwa /ə/ in unstressed syllables", "Elision — a sound is dropped: “friendship” → /frenʃɪp/", "Insertion — an extra sound appears: “warmth” → /wɔːmpθ/", "All four signal speed, spontaneity and informality — not carelessness"]}}, {"id": "M2", "area": "Metalanguage by subsystem", "title": "The IPA and transcription of Australian English", "detail": "Reading and writing IPA transcriptions of Australian English as described by Harrington, Cox & Evans.", "questions": [{"marks": 2, "q": "Explain what is meant by saying Australian English is non-rhotic, and give one example using IPA.", "answer": ["The /r/ phoneme is not pronounced when it follows a vowel and is not followed by another vowel.", "'car' is /kaː/ rather than /kaːr/.", "Also acceptable: 'farm' /faːm/, 'water' /woːtə/."]}], "card": {"key": "R1", "title": "IPA and transcribing Australian English", "front": "What do you need to get right when transcribing Australian English?", "back": ["Phonemic transcription sits inside slashes / /", "Australian English is non-rhotic — no /r/ after a vowel: “car” = /kaː/", "Stress marked with ˈ immediately before the stressed syllable", "Watch the vowels — /æ/ vs /e/, and the diphthongs /æɪ/ /ɑe/ /æɔ/", "Cox and Evans is the description the study design names"]}}, {"id": "M3", "area": "Metalanguage by subsystem", "title": "Prosodic features", "detail": "Pitch, stress, volume, tempo and intonation, and the meaning each carries in a spoken text.", "questions": [{"marks": 3, "q": "A speaker delivers a line with rising intonation at the end of a declarative and stress placed on the final word. Explain what each prosodic feature contributes to the meaning.", "answer": ["Rising intonation on a declarative (HRT) can seek agreement, signal uncertainty, or invite the listener to respond.", "Stress on the final word foregrounds it as the most important information in the utterance.", "Together they can soften an assertion and reduce the face threat of disagreeing.", "Name the feature AND state its function — not the label alone."]}], "card": {"key": "R2", "title": "Prosodic vs paralinguistic features", "front": "What belongs to prosody, what belongs to paralinguistics, and what does each do?", "back": ["Prosody is IN the voice: pitch, stress, volume, tempo, intonation", "Rising intonation (HRT) — question, uncertainty, or seeking agreement", "Stress shifts focus; tempo and volume carry urgency and emotion", "Paralinguistics is AROUND the voice: laughter, crying, creaky voice, breathiness", "Non-verbal: gesture, facial expression, eye contact, posture", "Both carry meaning a bare transcript cannot show"]}}, {"id": "M4", "area": "Metalanguage by subsystem", "title": "Phonological patterning", "detail": "Alliteration, assonance, consonance, onomatopoeia, rhythm and rhyme — and what the patterning achieves rather than just naming it.", "questions": [{"marks": 3, "q": "A public health slogan reads 'Slow down, stay safe, save lives'. Identify one phonological and one syntactic patterning feature and explain the effect of each.", "answer": ["Phonological — alliteration of /s/ across 'slow', 'stay', 'safe', 'save': memorability and cohesion.", "Syntactic — parallelism: three imperative verb phrases of matching structure.", "The rhythm of the tricolon gives the slogan force and makes it easy to recall.", "Marks require the effect, not just the identification."]}], "card": {"key": "R3", "title": "Phonological patterning", "front": "Name the phonological patterning devices — and the effect of each.", "back": ["Alliteration — repeated initial consonant; memorability, cohesion", "Assonance — repeated vowel sounds", "Consonance — repeated consonants, not only initial", "Onomatopoeia — the sound imitates the sense", "Rhythm and rhyme — pace, playfulness, memorability", "Never stop at the label — always state what the patterning achieves"]}}, {"id": "M5", "area": "Metalanguage by subsystem", "title": "Word formation processes", "detail": "Affixation, abbreviation, shortening, compounding, blending, backformation, conversion of word class, initialism, acronym and contraction.", "questions": [{"marks": 4, "q": "Identify the word formation process used to create each of the following: 'brunch', 'ANZAC', 'to medal' (as in to win a medal), 'servo'.", "answer": ["'brunch' — blending of breakfast and lunch.", "'ANZAC' — acronym: pronounced as a word, not letter by letter.", "'to medal' — conversion of word class, noun to verb.", "'servo' — shortening with hypocoristic -o suffix."]}], "card": {"key": "R6", "title": "Word formation processes", "front": "How are new words formed? Name each process with an example.", "back": ["Affixation (un-, -ness) · compounding (laptop) · blending (brunch)", "Shortening (uni) · contraction (don’t) · abbreviation", "Initialism = said letter by letter (ATM); acronym = said as a word (ANZAC)", "Backformation (edit ← editor) · conversion of word class (to google)", "Hypocoristics — the -ie/-o suffix (mozzie, arvo, servo)", "Hypocoristics are distinctively Australian: informality and solidarity"]}}, {"id": "M6", "area": "Metalanguage by subsystem", "title": "Hypocoristic use of suffixes", "detail": "The Australian pattern of mozzie, sickie, tradie — same denotation as the original, different connotation and formality.", "questions": [{"marks": 3, "q": "Explain what hypocoristics are, give two Australian examples, and describe their social function.", "answer": ["Hypocoristics shorten a word and add a suffix, usually -ie/-y or -o.", "Examples: mozzie, arvo, tradie, barbie, servo.", "They mark informality and signal solidarity and shared Australian identity.", "They carry the same denotation as the full form but different connotation."]}], "card": {"key": "R6", "title": "Word formation processes", "front": "How are new words formed? Name each process with an example.", "back": ["Affixation (un-, -ness) · compounding (laptop) · blending (brunch)", "Shortening (uni) · contraction (don’t) · abbreviation", "Initialism = said letter by letter (ATM); acronym = said as a word (ANZAC)", "Backformation (edit ← editor) · conversion of word class (to google)", "Hypocoristics — the -ie/-o suffix (mozzie, arvo, servo)", "Hypocoristics are distinctively Australian: informality and solidarity"]}}, {"id": "M7", "area": "Metalanguage by subsystem", "title": "Word classes", "detail": "Nouns including pronouns; verbs including auxiliary and modal verbs; adjectives; adverbs; prepositions; conjunctions (coordinators and subordinators); determiners; interjections.", "questions": [{"marks": 3, "q": "In the sentence 'The council may consider the proposal next month', identify the modal verb, the determiner and the adverbial, and explain what the modal contributes.", "answer": ["Modal verb: 'may'. Determiner: 'The'. Adverbial: 'next month'.", "The modal expresses possibility rather than certainty.", "It hedges the commitment, leaving the council free not to act — a negative politeness or evasion strategy."]}], "card": {"key": "A13", "title": "Word classes", "front": "Name the word classes and what each does.", "back": ["Nouns — including pronouns; name entities", "Verbs — including auxiliary and modal verbs; modals carry obligation and certainty", "Adjectives modify nouns; adverbs modify verbs, adjectives, whole clauses", "Prepositions show relationship in space, time or logic", "Conjunctions — coordinators (and, but) and subordinators (because, although)", "Determiners specify reference; interjections carry emotion"]}}, {"id": "M8", "area": "Metalanguage by subsystem", "title": "Lexical word formation and loss", "detail": "Neologism, borrowings, commonisation and nominalisation.", "questions": [{"marks": 3, "q": "Identify the process of lexical change in each: 'esky' used for any portable cooler; 'the government's implementation of the policy'; 'doomscrolling'.", "answer": ["'esky' — commonisation: a proper noun (brand name) becoming a common noun.", "'implementation' — nominalisation: the verb 'implement' converted to a noun.", "'doomscrolling' — neologism, formed by compounding.", "Nominalisation raises formality and removes the actor from the clause."]}], "card": {"key": "R7", "title": "Lexical change", "front": "Four ways the lexicon changes, beyond word formation.", "back": ["Neologism — a brand new word, or a new sense for an old one", "Borrowing — taken from another language (yakka, tsunami)", "Commonisation — a proper noun becomes a common noun (esky, google)", "Nominalisation — verb or adjective becomes a noun (decide → decision)", "Nominalisation raises formality and conveniently deletes the actor", "Also obsolescence — words falling out of use"]}}, {"id": "M9", "area": "Metalanguage by subsystem", "title": "Phrases", "detail": "Noun phrase, verb phrase, adjective phrase, adverb phrase and prepositional phrase — identifying them and naming their head.", "questions": [{"marks": 2, "q": "Identify the head of the noun phrase 'the recently approved planning application' and explain what the length of this phrase suggests about the text's register.", "answer": ["Head: 'application'.", "'the', 'recently approved' and 'planning' are all premodifiers.", "Heavily premodified noun phrases are characteristic of formal, written, often bureaucratic register."]}], "card": {"key": "A14", "title": "Phrases", "front": "The five phrase types — how do you identify one?", "back": ["A phrase is named after its head word", "Noun phrase, verb phrase, adjective phrase, adverb phrase, prepositional phrase", "A phrase can be a single word or many", "Long premodified noun phrases are a marker of formal writing", "Identify the head first, then the modifiers around it"]}}, {"id": "M10", "area": "Metalanguage by subsystem", "title": "Clauses", "detail": "Functions within the clause — subject, object, predicate, complement, adverbial — and combining clauses through coordination and subordination.", "questions": [{"marks": 3, "q": "Classify the sentence 'Although the deadline had passed, the committee accepted the submission because the delay was explained' by structure, and identify the subordinating conjunctions.", "answer": ["Complex sentence — one main clause with two subordinate clauses.", "Main clause: 'the committee accepted the submission'.", "Subordinating conjunctions: 'Although' and 'because'.", "A high density of subordination is a marker
